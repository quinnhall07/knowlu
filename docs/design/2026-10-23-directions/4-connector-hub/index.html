<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowlu Connections Hub</title>
<meta name="description" content="Direction 4 of the 2026-10-23 Knowlu UI run: onboarding as a board of places Knowlu reads, one sheet per source, then the reveal and the main page as a ranked list with receipts. Invented student data only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Direction 4: Connections hub. Tokens from BRIEF §4.3. */
:root {
  color-scheme: light;
  --ground: oklch(0.955 0.006 250);
  --cabinet: oklch(0.925 0.009 250);
  --cabinet-2: oklch(0.900 0.011 250);
  --tile: oklch(0.990 0.003 250);
  --tile-edge: oklch(0.830 0.012 250);
  --rule: oklch(0.890 0.010 250);
  --ink: oklch(0.240 0.020 255);
  --ink-2: oklch(0.430 0.018 255);
  --ink-3: oklch(0.520 0.016 255);
  --brand: #BC4444;
  --brand-hover: oklch(0.500 0.150 25);
  --on-brand: oklch(0.990 0.003 25);
  --focus: oklch(0.500 0.130 255);
  --done: oklch(0.480 0.080 165);
  --done-fill: oklch(0.930 0.035 165);
  --reading: oklch(0.560 0.050 235);
  --needs: oklch(0.470 0.100 75);
  --needs-fill: oklch(0.935 0.050 85);
  --skipped: var(--ink-2);
  --sel: oklch(0.900 0.040 255);
  --shadow-1: 0 1px 2px oklch(0.3 0.02 255 / 0.10), 0 4px 12px oklch(0.3 0.02 255 / 0.07);
  --shadow-2: 0 2px 4px oklch(0.3 0.02 255 / 0.10), 0 16px 40px oklch(0.3 0.02 255 / 0.14);
  /* course and domain tints: fill / label */
  --bio: oklch(0.920 0.045 135);   --bio-l: oklch(0.360 0.070 135);
  --chem: oklch(0.915 0.040 320);  --chem-l: oklch(0.380 0.090 320);
  --cs: oklch(0.915 0.040 255);    --cs-l: oklch(0.380 0.100 255);
  --span: oklch(0.935 0.060 90);   --span-l: oklch(0.400 0.080 75);
  --eng: oklch(0.920 0.040 195);   --eng-l: oklch(0.380 0.070 200);
  --job: oklch(0.915 0.030 230);   --job-l: oklch(0.380 0.060 230);
  --club: oklch(0.920 0.040 295);  --club-l: oklch(0.390 0.080 295);
  --pers: oklch(0.925 0.035 70);   --pers-l: oklch(0.400 0.060 60);
  --ring-a: oklch(0.520 0.090 165); --ring-b: oklch(0.520 0.090 245); --ring-c: oklch(0.560 0.090 75);
  --font: "Schibsted Grotesk", "Segoe UI", sans-serif;
  --mono: "Red Hat Mono", ui-monospace, monospace;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --dark: 1; } }
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: oklch(0.200 0.012 255);
  --cabinet: oklch(0.170 0.012 255);
  --cabinet-2: oklch(0.150 0.012 255);
  --tile: oklch(0.255 0.013 255);
  --tile-edge: oklch(0.350 0.014 255);
  --rule: oklch(0.310 0.014 255);
  --ink: oklch(0.950 0.008 250);
  --ink-2: oklch(0.790 0.012 250);
  --ink-3: oklch(0.720 0.012 250);
  --brand: oklch(0.640 0.150 25);
  --brand-hover: oklch(0.690 0.150 25);
  --on-brand: oklch(0.160 0.020 25);
  --focus: oklch(0.760 0.110 255);
  --done: oklch(0.780 0.090 165);
  --done-fill: oklch(0.320 0.040 165);
  --reading: oklch(0.740 0.060 235);
  --needs: oklch(0.840 0.110 85);
  --needs-fill: oklch(0.330 0.050 80);
  --sel: oklch(0.330 0.050 255);
  --shadow-1: 0 1px 2px oklch(0 0 0 / 0.35), 0 4px 12px oklch(0 0 0 / 0.30);
  --shadow-2: 0 2px 4px oklch(0 0 0 / 0.40), 0 16px 40px oklch(0 0 0 / 0.45);
  --bio: oklch(0.330 0.045 135);  --bio-l: oklch(0.880 0.060 135);
  --chem: oklch(0.330 0.045 320); --chem-l: oklch(0.880 0.060 320);
  --cs: oklch(0.330 0.050 255);   --cs-l: oklch(0.880 0.060 255);
  --span: oklch(0.340 0.050 85);  --span-l: oklch(0.890 0.080 90);
  --eng: oklch(0.330 0.045 200);  --eng-l: oklch(0.880 0.060 195);
  --job: oklch(0.330 0.035 230);  --job-l: oklch(0.870 0.050 230);
  --club: oklch(0.330 0.045 295); --club-l: oklch(0.880 0.060 295);
  --pers: oklch(0.340 0.040 70);  --pers-l: oklch(0.880 0.060 70);
  --ring-a: oklch(0.780 0.090 165); --ring-b: oklch(0.760 0.090 245); --ring-c: oklch(0.800 0.100 80);
}

* { box-sizing: border-box; }
html { font-size: 15px; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--ground); color: var(--ink);
  font-family: var(--font); font-size: 1rem; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
::selection { background: var(--sel); color: var(--ink); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-underline-offset: 3px; }
h1, h2, h3, p { margin: 0; text-wrap: balance; }
p { text-wrap: pretty; }

.host { font-family: var(--mono); font-size: 0.9em; }
.dim { color: var(--ink-2); }
.small { font-size: 0.8333rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
* { scrollbar-width: thin; scrollbar-color: var(--tile-edge) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--tile-edge); border-radius: 8px; border: 3px solid transparent; background-clip: padding-box; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 18px;
  border-radius: 8px; border: 1px solid var(--tile-edge); background: var(--tile); color: var(--ink);
  font-weight: 600; white-space: nowrap; transition: background 150ms var(--ease), border-color 150ms var(--ease), transform 150ms var(--ease);
}
.btn:hover { border-color: var(--ink-3); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.btn.primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); }
.btn[disabled], .btn[aria-disabled="true"] { background: var(--cabinet); border-color: var(--tile-edge); color: var(--ink-2); cursor: not-allowed; transform: none; }
.btn.quiet { border-color: transparent; background: transparent; padding: 0 10px; color: var(--ink-2); font-weight: 500; }
.btn.quiet:hover { color: var(--ink); background: var(--cabinet); }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: 0.8667rem; border-radius: 6px; }
.link { background: none; border: 0; padding: 0; color: var(--ink); font-weight: 600; text-decoration: underline; text-decoration-color: var(--tile-edge); text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.link:hover { text-decoration-color: var(--ink); }

/* Wordmark */
.wordmark { height: 22px; width: auto; display: block; }
:root[data-theme="dark"] .wordmark-chip { background: oklch(0.96 0.005 250); padding: 4px 8px; border-radius: 6px; }

/* ---------- Status badges (shape carries the state; colour is never the only signal) ---------- */
.tag { width: 16px; height: 16px; flex: none; display: inline-block; }
.tag svg { width: 16px; height: 16px; display: block; overflow: visible; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.tag .b-done { fill: var(--done); }
.tag .b-next { fill: var(--brand); }
.tag .b-mark { stroke: var(--tile); stroke-width: 1.8; }
.tag .b-ring { stroke: var(--ink-3); stroke-width: 1.5; }
.tag .b-track { stroke: var(--rule); stroke-width: 2; }
.tag .b-spin { stroke: var(--reading); stroke-width: 2; transform-origin: 8px 8px; animation: spin 1.4s linear infinite; }
.tag .b-needs { stroke: var(--needs); stroke-width: 2.2; }
.tag .b-needs-m { stroke: var(--needs); stroke-width: 2; }
.tag .b-skip { stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 2.4 2.2; }
.tag .b-lock { stroke: var(--ink-3); stroke-width: 1.4; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Onboarding: the hub (one board, every screen) ---------- */
.ob { height: 100vh; display: grid; grid-template-rows: 56px minmax(0, 1fr); }
.ob-top { display: flex; align-items: center; gap: 20px; padding: 0 20px 0 28px; background: var(--cabinet); border-bottom: 1px solid var(--rule); }
.ob-top .count { font-size: 0.9333rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ob-top .count b { color: var(--ink); font-weight: 600; }
.ob-top .left { font-size: 0.8667rem; color: var(--ink-2); white-space: nowrap; }
.ob-top .spacer { flex: 1; }
.board-view { overflow: auto; padding: 52px 56px 40px; background: var(--cabinet); display: grid; grid-template-columns: 392px minmax(0, 1fr); gap: 56px; align-items: start; }
.board-head h1 { font-size: 2rem; line-height: 1.15; font-weight: 700; letter-spacing: -0.025em; }
.board-head .lede { font-size: 1.1333rem; color: var(--ink-2); margin-top: 14px; }
.board-head .lede + .lede { margin-top: 10px; }
.return-line { display: flex; gap: 10px; align-items: baseline; margin-top: 18px; padding: 12px 14px; background: var(--tile); border: 1px solid var(--tile-edge); border-radius: 10px; }
.board-foot { margin-top: 28px; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
.board-foot .price { color: var(--ink-2); font-size: 0.9333rem; }
.hub-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.hub-h h2 { font-size: 0.9333rem; font-weight: 700; }
.hub-h .dim { font-size: 0.8333rem; }

.board { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.board.cols1 { grid-template-columns: minmax(0, 1fr); gap: 6px; }
.board > li { position: relative; display: flex; }
.tile {
  position: relative; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; column-gap: 12px; row-gap: 1px; align-content: start;
  width: 100%; min-height: 96px; padding: 14px 14px 14px 14px; text-align: left; color: var(--ink); font: inherit; cursor: pointer;
  background: var(--tile); border: 1px solid var(--tile-edge); border-radius: 12px; box-shadow: 0 1px 2px oklch(0.3 0.02 255 / 0.06);
  transition: border-color 150ms var(--ease), box-shadow 180ms var(--ease), transform 180ms var(--ease);
}
.tile:hover { border-color: var(--ink-3); box-shadow: var(--shadow-1); }
.tile:active { transform: translateY(1px); }
.tile .src { grid-row: 1 / span 3; width: 34px; height: 34px; border-radius: 9px; background: var(--ground); color: var(--ink-2); display: grid; place-items: center; }
.tile .src svg.i { width: 18px; height: 18px; vertical-align: 0; }
.tile .t-name { grid-column: 2; font-weight: 600; line-height: 1.3; padding-top: 1px; }
.tile .tag { grid-column: 3; grid-row: 1; margin-top: 3px; }
.tile .t-word { grid-column: 2 / span 2; font-size: 0.8667rem; font-weight: 600; line-height: 1.35; color: var(--ink-2); }
.tile .t-line { grid-column: 2 / span 2; font-size: 0.8333rem; color: var(--ink-2); line-height: 1.4; margin-top: 3px; }
.tile.st-next { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand), var(--shadow-1); }
.tile.st-next .src { background: var(--brand); color: var(--on-brand); }
.tile.st-next .t-word { color: var(--brand); }
.tile.st-done .src { background: var(--done-fill); color: var(--done); }
.tile.st-done .t-word { color: var(--done); }
.tile.st-reading .t-word { color: var(--reading); }
.tile.st-needs { background: var(--needs-fill); border-color: transparent; }
.tile.st-needs .t-word { color: var(--needs); }
.tile.st-ready .t-word { color: var(--ink); }
.tile.st-later { background: transparent; box-shadow: none; border-style: dashed; }
.tile.st-later .t-name { color: var(--ink-2); }
.tile.st-later .src { background: transparent; border: 1px dashed var(--tile-edge); }
.tile.st-skipped { background: transparent; box-shadow: none; }
.tile.current { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink), var(--shadow-1); }
.tile.current::after { content: ""; position: absolute; right: -1px; top: 50%; width: 9px; height: 18px; margin-top: -9px; background: var(--ink); clip-path: polygon(0 50%, 100% 0, 100% 100%); }
.board.compact .tile { min-height: 0; padding: 11px 12px; grid-template-columns: 30px minmax(0, 1fr) auto; }
.board.compact .tile .src { width: 30px; height: 30px; grid-row: 1 / span 2; }
.board.cols1 .tile .t-line { display: none; }
.board.compact .tile .t-word { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.added-flag { position: absolute; top: -8px; right: 12px; z-index: 2; font-size: 0.7333rem; font-weight: 700; background: var(--ink); color: var(--tile); padding: 1px 7px; border-radius: 10px; }

/* Round 2 board: ranked by state and importance, not a grid of equal cards */
.board2 { display: flex; flex-direction: column; gap: 22px; }
.board2 ol, .board2 ul { list-style: none; margin: 0; padding: 0; }
.leadlist { display: flex; flex-direction: column; gap: 10px; }
.leadlist > li { position: relative; display: flex; }
.tile.lead { min-height: 0; padding: 18px 20px; grid-template-columns: 44px minmax(0, 1fr) auto; column-gap: 16px; }
.tile.lead .src { width: 44px; height: 44px; border-radius: 11px; }
.tile.lead .src svg.i { width: 22px; height: 22px; }
.tile.lead .t-name { font-size: 1.2rem; font-weight: 700; letter-spacing: -0.01em; }
.tile.lead .t-word { font-size: 0.9333rem; margin-top: 2px; }
.tile.lead .t-line { font-size: 0.9333rem; color: var(--ink); margin-top: 6px; max-width: 68ch; text-wrap: pretty; }
.tile.lead.st-needs .src { background: var(--needs); color: var(--needs-fill); }
.bsec h3 { font-size: 0.8667rem; font-weight: 700; color: var(--ink); margin-bottom: 8px; display: flex; gap: 8px; align-items: baseline; }
.bsec h3 span { font-weight: 500; color: var(--ink-2); }
.clist { background: var(--tile); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
.clist > li + li { border-top: 1px solid var(--rule); }
.crow { width: 100%; display: grid; grid-template-columns: 16px 156px minmax(0, 1fr); column-gap: 12px; row-gap: 2px; align-items: baseline;
  padding: 11px 16px; background: none; border: 0; text-align: left; color: var(--ink); font: inherit; cursor: pointer; transition: background 150ms var(--ease); }
.crow:hover { background: var(--ground); }
.crow .tag { align-self: start; margin-top: 2px; }
.crow .c-name { font-weight: 600; line-height: 1.35; }
.crow .c-proof { line-height: 1.4; color: var(--ink); text-wrap: pretty; }
.crow .c-line { grid-column: 2 / span 2; font-size: 0.8667rem; color: var(--ink-2); line-height: 1.4; }
.crow.st-ready .c-proof { color: var(--ink-2); font-size: 0.8667rem; text-align: right; }
.crow.st-reading .c-proof { color: var(--reading); font-weight: 600; }
.crow.st-skipped .c-proof { color: var(--ink-2); }
.crow.primary { padding-top: 14px; padding-bottom: 14px; }
.crow.primary .c-name { font-size: 1.0667rem; }
.crow.primary .c-proof { font-size: 1.0667rem; font-weight: 600; }
.crow.current { background: var(--sel); }
.clist .kids > ul { margin-left: 44px !important; border-left: 1px solid var(--rule); }
.clist .kids .crow { grid-template-columns: 16px 112px minmax(0, 1fr); padding-top: 8px; padding-bottom: 8px; font-size: 0.9333rem; }
.clist .kids > ul > li + li { border-top: 1px solid var(--rule); }
.clist .found .crow .c-line::before { content: "Found at your school · "; color: var(--ink-2); font-weight: 600; }
.small-print { display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 9px 16px; background: var(--ground); }
.small-print .sp { display: inline-flex; gap: 7px; align-items: center; background: none; border: 0; padding: 2px 0; font: inherit; font-size: 0.8667rem; color: var(--ink-2); cursor: pointer; }
.small-print .sp b { color: var(--ink); font-weight: 600; }
.small-print .sp .tag, .small-print .sp .tag svg { width: 13px; height: 13px; }
.small-print .sp:hover { color: var(--ink); }
.nflag { display: inline-block; margin-left: 8px; vertical-align: 2px; font-size: 0.7333rem; font-weight: 700; background: var(--ink); color: var(--tile); padding: 0 7px; border-radius: 10px; line-height: 1.6; }
.gates li { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 12px; padding: 4px 0; align-items: baseline; }
.gates .g-k { font-size: 0.8667rem; color: var(--ink-2); }
.gates .g-v { display: flex; flex-wrap: wrap; gap: 6px; }
.gchip { font: inherit; font-size: 0.8667rem; color: var(--ink-2); background: transparent; border: 1px solid var(--rule); border-radius: 999px; padding: 2px 10px; cursor: pointer; }
.gchip:hover { color: var(--ink); border-color: var(--ink-3); }
.finish { position: relative; display: flex; padding-top: 14px; border-top: 1px dashed var(--tile-edge); }
.tile.fin { min-height: 0; padding: 12px 16px; background: transparent; box-shadow: none; border-color: var(--rule); }
.tile.fin.st-later .src { border: 0; background: var(--cabinet-2); }
.tile.fin.st-next { background: var(--tile); border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand), var(--shadow-1); }
.tile.fin.st-reading { background: var(--tile); }
.board2.compact { gap: 16px; }
.board2.compact .tile.lead { padding: 14px 16px; }
.board2.compact .tile.lead .t-line { font-size: 0.8667rem; }
.board2.compact .crow { grid-template-columns: 16px 150px minmax(0, 1fr); padding: 9px 14px; }
.board2.compact .gates li { grid-template-columns: 1fr; gap: 4px; }
.board2.cols1 .crow { grid-template-columns: 16px minmax(0, 1fr); }
.board2.cols1 .crow .c-proof, .board2.cols1 .crow .c-line { grid-column: 2; text-align: left; }
.board2.cols1 .tile .t-line { display: none; }
/* the wait: what is left, counted */
.waitlist { margin-top: 22px; background: var(--tile); border: 1px solid var(--rule); border-radius: 12px; padding: 6px 16px; }
.waitlist ul { list-style: none; margin: 0; padding: 0; }
.waitlist h2 { font-size: 0.9333rem; font-weight: 700; padding: 10px 0 6px; display: flex; justify-content: space-between; }
.waitlist h2 span { font-weight: 500; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.waitlist li { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 10px; padding: 8px 0; border-top: 1px solid var(--rule); align-items: baseline; font-size: 0.9333rem; }
.waitlist li .tag { align-self: start; margin-top: 2px; }
.waitlist li .wv { color: var(--ink-2); font-variant-numeric: tabular-nums; font-size: 0.8667rem; }
.waitlist li.run { font-weight: 600; }
.waitlist li.run .wv { color: var(--reading); }
.waitbar { height: 4px; border-radius: 2px; background: var(--rule); margin: 4px 0 12px; overflow: hidden; }
.waitbar i { display: block; height: 100%; background: var(--reading); border-radius: 2px; }

/* hub + drawer */
.ob-body { display: grid; grid-template-columns: minmax(0, 1fr) 620px; min-height: 0; overflow: hidden; }
.ob-body.wide { grid-template-columns: 320px minmax(0, 1fr); }
.hub { position: relative; overflow: auto; padding: 22px 26px 24px 28px; background: var(--cabinet); }
.drawer { display: flex; flex-direction: column; min-height: 0; background: var(--tile); border-left: 1px solid var(--tile-edge); box-shadow: -16px 0 40px oklch(0.3 0.02 255 / 0.07); animation: slidein 220ms var(--ease); }
@keyframes slidein { from { opacity: 0.4; transform: translateX(16px); } to { opacity: 1; transform: none; } }
.sh-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px 10px 12px; border-bottom: 1px solid var(--rule); min-height: 52px; flex: none; }
.sh-head .crumb { flex: 1; font-size: 0.8667rem; color: var(--ink-2); font-weight: 500; }
.sh-head .mins { font-size: 0.8333rem; color: var(--ink-2); }
.sh-body { flex: 1; min-height: 0; overflow: auto; padding: 24px 36px 18px; }
.sh-body h2 { font-size: 1.5rem; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; }
.sh-body .why { font-size: 1.1333rem; line-height: 1.45; margin-top: 10px; max-width: 58ch; }
.sh-body .sub { color: var(--ink-2); margin-top: 8px; max-width: 62ch; }
.sh-foot { flex: none; display: flex; align-items: center; gap: 10px; padding: 14px 36px 16px; flex-wrap: wrap; background: var(--tile); border-top: 1px solid var(--rule); }
.sh-foot .grow { flex: 1; }
.later-note { margin-top: 14px; font-size: 0.8667rem; color: var(--ink-2); }

const PROOF = {
  acc: 'Signed in', sch: '5 classes · 26 assignments, 4 turned in', pay: 'Trial on · first charge Oct 25',
  mail: 'Forwarding on · test arrived in 38 s', goo: '40 messages, 1 to do · 6 events', cal: '6 events this week',
  zy: '1 book · 8 assignments, 3 done', vhl: '1 course · 6 assignments, 2 done', syl: '5 of 5 read · 10 exams'
};
const READING = { sch: 'Reading · usually 1–3 min', mail: 'Waiting for the test message', goo: 'Reading · under a minute', zy: 'Reading · about a minute', vhl: 'Reading · about a minute', syl: "Reading CS 110's syllabus", week: 'First full run' };
const PLACES = ['sch', 'mail', 'goo', 'cal', 'zy', 'vhl', 'syl'];
/* Your week: 27 rows read; Knowlu is sure of 25, two are asked one by one. */
const WEEK_FLAGS = ['eng-late', 'cs-weights'];
function weekAnswered() { return WEEK_FLAGS.filter(k => UI.wk[k]).length; }
function weekProof() { const a = weekAnswered(); return a === 2 ? '27 confirmed' : `${25 + a} confirmed · ${2 - a} asked later`; }

function stateOf(b, id) { return (b.s && b.s[id]) || 'later'; }
function wordOf(b, t) {
  if (b.w && b.w[t.id]) return b.w[t.id];
  const st = stateOf(b, t.id);
  if (t.slot) return t.lock;
  if (st === 'done') return t.id === 'week' ? weekProof() : PROOF[t.id];
  if (st === 'next') return (b.cur === t.id ? 'Open now' : 'Suggested next') + ' · about ' + t.mins + ' min';
  if (st === 'ready') return 'Ready · about ' + t.mins + ' min';
  if (st === 'reading') return READING[t.id] || 'Reading';
  if (st === 'later') return t.lock;
  return STATE_WORD[st];
}
function countLine(b) {
  const done = id => stateOf(b, id) === 'done' || stateOf(b, id) === 'reading';
  const present = TILES(b).map(t => t.id);
  const pl = PLACES.filter(id => present.includes(id));
  const n = pl.filter(done).length;
  let classes = 0, asg = 0, tin = 0;
  if (stateOf(b, 'sch') === 'done') { classes = 5; asg += 26; tin += 4; }
  if (stateOf(b, 'zy') === 'done') { asg += 8; tin += 3; }
  if (stateOf(b, 'vhl') === 'done') { asg += 6; tin += 2; }
  if (!n && stateOf(b, 'acc') !== 'done') return 'Nothing connected yet';
  if (!n) return '<b>Signed in.</b> No places connected yet';
  return `<b>${n} of ${pl.length} places connected</b>` + (classes ? ` · found ${classes} classes, ${asg} assignments, ${tin} already turned in` : '');
}
function minsLeft(b) { return TILES(b).filter(t => !t.slot && !['done', 'skipped', 'reading'].includes(stateOf(b, t.id))).reduce((s, t) => s + t.mins, 0); }
function payDone(b) { return stateOf(b, 'pay') === 'done'; }

function boardTile(b, t) {
  const st = t.slot ? 'later' : stateOf(b, t.id);
  const word = wordOf(b, t);
  const added = (b.added || []).includes(t.id);
  const cur = b.cur === t.id;
  let target;
  if (t.slot) target = 'preview:slot';
  else if (st === 'done' || st === 'reading') target = 'receipt:' + t.id;
  else if (st === 'later') target = 'preview:' + t.id;
  else target = (b.go && b.go[t.id]) || t.go;
  return { st, word, added, cur, target };
}
/* Round 2: the board is no longer nine equal cards. It is ranked by state, then by importance:
   what needs you or comes next (one large tile), what is reading now, what is open in any order,
   what is connected (each with its proof in full, never cut), then what isn't open yet (one quiet
   line per gate, no padlocks), and Your week at the end as the finish line. Homework sites and
   syllabi sit under the school that found them; account and payment are the small print. */
const FOUND_BY_SCH = ['zy', 'vhl', 'syl'];
const MINOR = ['acc', 'pay'];
function boardHTML(b, cls = '') {
  const tiles = TILES(b);
  const info = t => Object.assign({ t }, boardTile(b, t));
  const all = tiles.map(info);
  const curAttr = x => x.cur ? ' aria-current="step"' : '';
  const aria = x => `aria-label="${esc(x.t.name)}. ${esc(x.word)}. ${esc(x.t.line)}"`;
  const newFlag = x => x.added ? '<span class="nflag">New</span>' : '';
  const week = all.find(x => x.t.id === 'week');
  const rest = all.filter(x => x !== week);
  const lead = rest.filter(x => ['needs', 'next'].includes(x.st));
  const reading = rest.filter(x => x.st === 'reading');
  const ready = rest.filter(x => x.st === 'ready');
  const done = rest.filter(x => ['done', 'skipped'].includes(x.st));
  const later = rest.filter(x => x.st === 'later');
  const leadHTML = x => `<li><button class="tile lead st-${x.st}${x.cur ? ' current' : ''}" data-go="${x.target}"${curAttr(x)} ${aria(x)}>
    <span class="src">${ic(x.t.ic)}</span><span class="t-name">${esc(x.t.name)}${newFlag(x)}</span>${tagSvg(x.st)}<span class="t-word">${esc(x.word)}</span><span class="t-line">${esc(x.t.line)}</span></button></li>`;
  const rowHTML_ = (x, extra = '') => `<li class="${extra}"><button class="crow st-${x.st}${x.cur ? ' current' : ''}${x.t.id === 'sch' ? ' primary' : ''}${MINOR.includes(x.t.id) ? ' minor' : ''}" data-go="${x.target}"${curAttr(x)} ${aria(x)}>
    ${tagSvg(x.st)}<span class="c-name">${esc(x.t.name)}${newFlag(x)}</span><span class="c-proof">${esc(x.word)}</span>${x.st === 'ready' ? `<span class="c-line">${esc(x.t.line)}</span>` : ''}</button></li>`;
  const sec = (h, sub, inner, k = '') => inner ? `<section class="bsec ${k}"><h3>${h}${sub ? ` <span>${sub}</span>` : ''}</h3>${inner}</section>` : '';
  /* connected: places first (school with what it found beneath it), then the small print */
  const places = done.filter(x => !MINOR.includes(x.t.id) && !FOUND_BY_SCH.includes(x.t.id));
  const kids = done.filter(x => FOUND_BY_SCH.includes(x.t.id));
  const minor = done.filter(x => MINOR.includes(x.t.id));
  let conn = '';
  places.forEach(x => {
    conn += rowHTML_(x);
    if (x.t.id === 'sch' && kids.length) conn += `<li class="kids"><ul>${kids.map(k => rowHTML_(k)).join('')}</ul></li>`;
  });
  if (!places.some(x => x.t.id === 'sch') && kids.length) conn += kids.map(k => rowHTML_(k)).join('');
  if (minor.length) conn += `<li class="small-print">${minor.map(x => `<button class="sp st-${x.st}" data-go="${x.target}" ${aria(x)}>${tagSvg(x.st)}<b>${esc(x.t.name)}</b> ${esc(x.word)}</button>`).join('')}</li>`;
  /* not open yet: one line per gate */
  const gates = {};
  later.forEach(x => { (gates[x.t.lock] = gates[x.t.lock] || []).push(x); });
  const laterHTML = Object.entries(gates).map(([gate, xs]) => `<li><span class="g-k">${esc(gate)}</span><span class="g-v">${xs.map(x => `<button class="gchip" data-go="${x.target}" aria-label="${esc(x.t.name)}. ${esc(gate)}. ${esc(x.t.line)}">${esc(x.t.slot ? 'Homework sites your school uses' : x.t.name)}</button>`).join('')}</span></li>`).join('');
  const wk = week ? `<div class="finish st-${week.st}${week.cur ? ' current' : ''}"><button class="tile fin st-${week.st}${week.cur ? ' current' : ''}" data-go="${week.target}"${curAttr(week)} ${aria(week)}>
    <span class="src">${ic('list')}</span><span class="t-name">Your week</span>${tagSvg(week.st)}<span class="t-word">${esc(week.word)}</span><span class="t-line">${esc(week.t.line)}</span></button></div>` : '';
  const anyReady = ready.length;
  return `<div class="board2 ${cls}" aria-label="Your connections">
    ${lead.length ? `<ol class="leadlist">${lead.map(leadHTML).join('')}</ol>` : ''}
    ${sec('Reading now', '', reading.length ? `<ul class="clist">${reading.map(x => rowHTML_(x)).join('')}</ul>` : '', 'reading')}
    ${sec(lead.length ? 'Also open' : 'Open now', anyReady > 1 ? 'any order · about 1 min each' : '', anyReady ? `<ul class="clist">${ready.map(x => rowHTML_(x, FOUND_BY_SCH.includes(x.t.id) ? 'found' : '')).join('')}</ul>` : '')}
    ${sec('Connected', done.length ? 'what each one found' : '', conn ? `<ul class="clist">${conn}</ul>` : '')}
    ${sec('Not open yet', '', laterHTML ? `<ul class="gates">${laterHTML}</ul>` : '', 'later')}
    ${wk}</div>`;
}
function hubHead(b) {
  return `<div class="hub-h"><h2>Your connections</h2><span class="dim">${payDone(b) ? 'Any order from here. Your week comes last.' : 'Account, school, then payment. The rest opens after.'}</span></div>`;
}
function obTop(b, right = '') {
  const left = b && !b.noLeft ? minsLeft(b) : 0;
  return `<header class="ob-top"><span class="wordmark-chip"><img class="wordmark" src="assets/Knowlu_Wordmark_Red.png" alt="Knowlu"></span>
  <span class="count">${b ? countLine(b) : ''}</span><span class="spacer"></span>${right}${left ? `<span class="left">About ${left} min left</span>` : ''}
  <button class="btn quiet sm" data-go="P-EXIT">Finish later</button></header>`;
}

/* ===== onboarding screens, part 1: board views, account, school ===== */
const ORDER = ['acc', 'sch', 'pay', 'mail', 'goo', 'cal', 'zy', 'vhl', 'syl', 'week'];
const ANY_ORDER = ['mail', 'goo', 'cal', 'zy', 'vhl', 'syl'];
let bAt = function (cur, o = {}) {
  const s = {}; const ci = ORDER.indexOf(cur);
  const paid = ci > ORDER.indexOf('pay');
  for (const id of ORDER) {
    if (id === 'cal' && !o.cal) continue;
    const i = ORDER.indexOf(id);
    if (id === cur) s[id] = 'next';
    else if (i < ci) s[id] = 'done';
    else if (paid && ANY_ORDER.includes(id)) s[id] = 'ready';
    else s[id] = 'later';
  }
  Object.assign(s, o.s || {});
  const found = o.found !== undefined ? o.found : ci >= ORDER.indexOf('pay');
  return { s, found, cal: o.cal, cur: o.dock === false ? null : cur, w: o.w, added: o.added, go: o.go };
};

function weekGrid(days, o = {}) {
  const startH = o.startH || 8, endH = o.endH || 23, pxH = o.pxH || 30;
  const H = (endH - startH) * pxH;
  const y = t => { const [h, m] = t.split(':').map(Number); return Math.max(0, (h + m / 60 - startH) * pxH); };
  const shortT = s => s.replace(/:00 /, ' ').replace(' am', 'a').replace(' pm', 'p');
  const hours = []; for (let h = startH; h <= endH; h += 2) hours.push(h);
  const dues = days.map(d => (d.due || []).filter(x => (!(x.state_now || '').startsWith('done') || o.allDue) && !(o.noVhl && /^VHL/.test(x.title))));
  let html = `<div class="wkgrid"><div></div>`;
  days.forEach(d => { const dt = new Date(d.date + 'T12:00'); html += `<div class="dayhead${d.date === o.today ? ' today' : ''}">${d.weekday.slice(0, 3)} <span class="dim">${dt.getDate()}</span></div>`; });
  html += `<div class="lane-lbl">Due</div>`;
  dues.forEach(list => {
    const show = list.slice(0, 3);
    html += `<div class="lane">${show.map(x => `<span class="duechip" title="Due ${esc(x.title)} at ${esc(x.due_time)}"><span class="t">${shortT(x.due_time)}</span> <b>${esc(x.title.split(':')[0])}</b></span>`).join('')}${list.length > 3 ? `<span class="more">+${list.length - 3} more</span>` : ''}</div>`;
  });
  html += `<div class="hours" style="height:${H}px">${hours.map(h => `<span style="top:${(h - startH) * pxH}px">${h % 12 || 12}${h < 12 ? 'a' : 'p'}</span>`).join('')}</div>`;
  days.forEach(d => {
    html += `<div class="col" style="height:${H}px">${hours.map(h => `<i class="hl" style="top:${(h - startH) * pxH}px"></i>`).join('')}`;
    d.blocks.forEach(bk => {
      const top = y(bk.start), h = Math.max(y(bk.end) - top, 17);
      const isClass = ['class', 'lab', 'office hours'].includes(bk.kind);
      const cls = isClass ? 'c-' + (DOMAIN_CLASS[bk.domain] || 'pers') : 'ev';
      const lvl = bk.level === 'optional' ? ' optional' : bk.level === 'soft' ? ' soft' : '';

function timelineHTML(blocks, o = {}) {

  if (o.free) segs += `<span class="seg free" style="left:${x(o.free[0])}%;width:${x(o.free[1]) - x(o.free[0])}%"></span>`;
  const ticks = [8, 12, 16, 20].map(h => `<span style="left:${x(h)}%">${h % 12 || 12} ${h < 12 ? 'am' : 'pm'}</span>`).join('');

}
function fillWork(from, need, busy) {
  const out = []; let t = from;
  for (const [a, b] of busy.concat([[24, 24]])) { if (need <= 0) break; if (t < a) { const take = Math.min(a - t, need); out.push([t, t + take]); need -= take; t += take; } t = Math.max(t, b); }
  return out;
}

  }

  if (el.dataset.flash) FLASH = el.dataset.flash;
  if (el.dataset.dom) UI.dom = el.dataset.dom;
  if (el.dataset.toast && !el.dataset.go && !el.dataset.act) { toast(el.dataset.toast); return; }

      ? '<li>Sign in to Blackboard in your browser.</li><li>Open <b>Calendar</b>, then the settings menu.</li><li>Choose <b>Share calendar</b> (some schools say <b>Get calendar link</b>).</li><li>Copy the link and paste it below.</li>'

    return;

  if (el.dataset.wk) { UI.wk[el.dataset.wk] = el.dataset.v; if (el.dataset.v === 'reread') toast('Knowlu reads that part of the file again and shows you what it finds.'); render(); return; }
  const a = el.dataset.act;
  if (a) { act(a, el); return; }
  if (el.dataset.go) go(el.dataset.go);
});

function act(a, el) {
  const id = el.dataset.id;
  switch (a) {
    case 'done': if (UI.done.has(id)) UI.done.delete(id); else { UI.done.add(id); toast('Done. ' + esc((ALL_TASKS[id] || {}).title || ''), 'Undo', () => { UI.done.delete(id); render(); }); } render(); break;
    case 'pin': if (UI.pinned.has(id)) UI.pinned.delete(id); else UI.pinned.add(id); render(); break;
    case 'focus': toast('Lock in starts here: today\'s tasks one at a time, in Knowlu\'s order. Done, Skip, Pause, Exit.'); break;
    case 'steps': if (UI.open.has(id)) UI.open.delete(id); else UI.open.add(id); render(); break;
    case 'later': UI.showLater = !UI.showLater; render(); break;
    case 'closed': UI.showClosed = !UI.showClosed; render(); break;
    case 'archive': UI.archived.add(id); toast('Archived. It stays in your history.', 'Undo', () => { UI.archived.delete(id); render(); }); go('M-TODAY'); break;
    case 'undo': UI.undone = true; toast("Pre-lecture quiz: Ch. 7 is back on your list. Knowlu won't mark it done again on its own.", 'Undo', () => { UI.undone = false; render(); }); go('M-UNDONE'); break;
    case 'redo': UI.undone = false; toast('Marked done again.'); go('M-TODAY'); break;
    case 'latepick': UI.latePick = el.dataset.v; render(); break;
    case 'lateset': if (!UI.latePick) { toast('Pick when you\'ll turn it in first.'); break; } UI.archived.add('t-chem-ps6'); toast(`Problem set 6 is back on your list, due ${UI.latePick.toLowerCase()}.`, 'Undo', () => { UI.archived.delete('t-chem-ps6'); render(); }); UI.latePick = null; go('M-TODAY'); break;
    case 'answer': toast(el.dataset.v === 'Not now' ? 'Moved to the back of the line.' : `Answered: ${esc(el.dataset.v)}.`, el.dataset.v === 'Not now' ? null : 'Undo', () => {}); UI.deck++; render(); break;
    case 'vhlfix': UI.vhlFixed = true; toast('VHL is connected again. Reading new VHL work.'); go('M-CONN'); break;
    case 'grades': SET.grades = !SET.grades; saveSet(); render(); break;
    case 'rail': SET.rail = SET.rail === 'collapsed' ? 'open' : 'collapsed'; saveSet(); render(); break;
    case 'tester': SET.tester = !SET.tester; render(); break;
    case 'syl-file': UI.sylChosen = true; render(); break;
    case 'undo-dues': toast('Pay Pre-Health Society dues is removed from your list. It stays in what Knowlu found, marked removed by you.', 'Undo', () => {}); break;
    case 'skip': { const k = SKIPS[el.dataset.skip]; UI.skipped[k.tile] = k.word; go(k.next); break; }
    case 'back': go(PREV && !PREV.startsWith('receipt:') ? PREV : 'BOARD'); break;
    case 'wkopen': UI.wkOpen[el.dataset.k] = !UI.wkOpen[el.dataset.k]; render(); break;
    case 'check-code': {
      const code = $$('[data-code]').map(i => i.value).join('');
      if (code === '482913') go('P-ACC-DONE'); else $('#code-err').hidden = false; break;
    }
    case 'check-feed': {
      const v = $('#feed').value.trim();
      if (/^https:\/\/\S+\.ics(\?\S*)?$/.test(v)) { toast('Calendar link added. Knowlu is reading it.'); go('P-SCH-PROOF'); } else $('#feed-err').hidden = false; break;
    }
  }
}
document.addEventListener('input', e => {
  if (e.target.matches('[data-code]') && e.target.value) { const n = $(`[data-code="${+e.target.dataset.code + 1}"]`); if (n) n.focus(); }
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select')) return;
  const main = CUR && SCR[CUR] && SCR[CUR].main;
  if (e.key === 'Escape') { if (main && CUR !== 'M-TODAY') go(CUR === 'S-REPAIR' ? 'M-CONN' : 'M-TODAY'); else if (!main && $('.drawer')) go('BOARD'); return; }
  if (!main) return;
  if (e.ctrlKey && e.key === '\\') { act('rail', {}); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const rows = $$('[data-row]').map(r => r.dataset.row);
  const i = rows.indexOf(UI.sel);
  if (e.key === 'j' || e.key === 'k') {
    UI.sel = rows[Math.max(0, Math.min(rows.length - 1, i + (e.key === 'j' ? 1 : -1)))] || rows[0]; render();
    const r = $(`[data-row="${UI.sel}"]`); if (r) r.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter' && UI.sel && !e.target.matches('button')) { $(`[data-row="${UI.sel}"] [data-insp]`) ? $(`[data-row="${UI.sel}"] [data-insp]`).click() : null; }
  else if (e.key === 'x' && UI.sel) act('done', { dataset: { id: UI.sel } });
  else if (e.key === 'p' && UI.sel) act('pin', { dataset: { id: UI.sel } });
  else if (e.key === 'f' && UI.sel) act('focus', { dataset: { id: UI.sel } });
  else if (e.key === 'c') go('M-CONN');
  else if (e.key === 'd') go('M-DECIDE');
});

/* prototype panel (Quinn's "make it adjustable" + "Copy my settings") */
function protoPanel() {
  const opts = Object.entries(SCR).map(([k, v]) => `<option value="${k}">${k} · ${esc(v.title)}</option>`).join('');
  const cb = (k, l) => `<label><input type="checkbox" data-set="${k}" ${SET[k] ? 'checked' : ''}> ${l}</label>`;
  return `<button class="proto-btn" id="proto-btn" aria-expanded="false" aria-controls="proto">Prototype</button>
  <div class="proto" id="proto" hidden><h3>Prototype controls</h3>
    <label for="proto-screen" style="display:block">Jump to a screen</label><select id="proto-screen">${opts}</select>
    <label style="margin-top:10px">Theme <select data-set="theme" style="width:auto;margin-left:auto"><option value="light">Light</option><option value="dark">Dark</option><option value="auto">Follow Windows</option></select></label>
    ${cb('why', 'Why lines on the list')}${cb('ranges', 'Estimates as ranges')}${cb('grades', 'Show grades')}${cb('avoided', 'Show a task being avoided')}
    ${cb('shared', 'School shares one sign-in (curated)')}${cb('past100', 'Past the first 100 Gmail-permission users')}
    <div class="row2"><button class="btn sm" id="copy-set">Copy my settings</button><button class="btn sm quiet" id="reset-set">Reset</button></div></div>`;
}
function wireProto() {
  document.body.insertAdjacentHTML('beforeend', protoPanel());
  const p = $('#proto'), b = $('#proto-btn');
  b.onclick = () => { p.hidden = !p.hidden; b.setAttribute('aria-expanded', !p.hidden); };
  $('#proto-screen').onchange = e => go(e.target.value);
  $('[data-set="theme"]').value = SET.theme;
  p.addEventListener('change', e => {
    const k = e.target.dataset.set; if (!k) return;
    SET[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value; saveSet(); applyTheme(); render();
  });
  $('#copy-set').onclick = () => {
    const txt = 'Knowlu direction 4 settings: ' + JSON.stringify(SET);
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Settings copied.'), () => toast(txt));
  };
  $('#reset-set').onclick = () => { SET = Object.assign({}, DEFAULTS); saveSet(); applyTheme(); location.reload(); };
}
wireProto();
render();

</script>
