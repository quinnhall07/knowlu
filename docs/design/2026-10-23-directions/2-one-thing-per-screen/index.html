<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowlu · Setup, one screen at a time</title>
<meta name="description" content="Direction 2 prototype: the long onboarding as one sheet per ask, the week reveal, and Today. Invented student data only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Direction 2: Setup, one screen at a time. Campus wayfinding: a route line of stops at the foot,
   one sign per screen, Public Sans (the US Web Design System face, built for plain public signage and forms). */
:root{
  --ground:oklch(0.972 0.008 92);
  --sheet:oklch(0.992 0.004 92);
  --ink:oklch(0.235 0.014 70);
  --ink-2:oklch(0.44 0.014 70);
  --rule:oklch(0.895 0.01 88);
  --rule-2:oklch(0.80 0.012 88);
  --signal:oklch(0.42 0.085 168);
  --signal-soft:oklch(0.935 0.03 168);
  --on-signal:oklch(0.99 0.004 92);
  --proof:oklch(0.46 0.09 160);
  --needs:oklch(0.72 0.13 78);
  --needs-ink:oklch(0.46 0.10 62);
  --dim:oklch(0.972 0.008 92 / .84);
  --shadow:0 1px 2px oklch(0.235 0.014 70 / .06), 0 10px 28px oklch(0.235 0.014 70 / .10);
  --tint-l:0.92; --tint-c:0.05; --lab-l:0.36; --lab-c:0.09;
  --font:"Public Sans",system-ui,sans-serif;
  --gap-row:2px; --row-h:38px; --gap-group:44px;
  --t-fast:160ms; --t-mid:260ms; --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:oklch(0.205 0.008 75); --sheet:oklch(0.245 0.009 75); --ink:oklch(0.95 0.008 90);
    --ink-2:oklch(0.79 0.012 88); --rule:oklch(0.33 0.008 75); --rule-2:oklch(0.43 0.01 75);
    --signal:oklch(0.80 0.10 168); --signal-soft:oklch(0.31 0.04 168); --on-signal:oklch(0.19 0.01 168);
    --proof:oklch(0.80 0.10 160); --needs:oklch(0.84 0.12 85); --needs-ink:oklch(0.86 0.11 85);
    --dim:oklch(0.205 0.008 75 / .86);
    --shadow:0 1px 2px oklch(0 0 0 / .3), 0 12px 32px oklch(0 0 0 / .38);
    --tint-l:0.33; --tint-c:0.055; --lab-l:0.90; --lab-c:0.06; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:oklch(0.205 0.008 75); --sheet:oklch(0.245 0.009 75); --ink:oklch(0.95 0.008 90);
  --ink-2:oklch(0.79 0.012 88); --rule:oklch(0.33 0.008 75); --rule-2:oklch(0.43 0.01 75);
  --signal:oklch(0.80 0.10 168); --signal-soft:oklch(0.31 0.04 168); --on-signal:oklch(0.19 0.01 168);
  --proof:oklch(0.80 0.10 160); --needs:oklch(0.84 0.12 85); --needs-ink:oklch(0.86 0.11 85);
  --dim:oklch(0.205 0.008 75 / .86);
  --shadow:0 1px 2px oklch(0 0 0 / .3), 0 12px 32px oklch(0 0 0 / .38);
  --tint-l:0.33; --tint-c:0.055; --lab-l:0.90; --lab-c:0.06; color-scheme:dark;
}
:root[data-density="compact"]{--row-h:32px; --gap-row:0px; --gap-group:30px}
:root[data-density="roomy"]{--row-h:44px; --gap-row:4px; --gap-group:52px}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--font);font-size:1.0625rem;line-height:1.5;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow:hidden}
::selection{background:var(--signal);color:var(--on-signal)}
input,textarea,select,button{font:inherit;color:inherit;caret-color:var(--signal)}
*{scrollbar-width:thin;scrollbar-color:var(--rule-2) transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--rule-2);border-radius:8px;border:3px solid var(--ground)}
a{color:var(--signal);text-underline-offset:.2em;text-decoration-thickness:1px}
:focus-visible{outline:2px solid var(--signal);outline-offset:3px;border-radius:4px}
[tabindex="-1"]:focus{outline:none}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance;letter-spacing:-0.012em}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
svg.i.s{width:16px;height:16px;vertical-align:-3px}

/* ---------- frame ---------- */
.frame{height:100vh;display:grid;grid-template-rows:52px 1fr auto}
.top{display:flex;align-items:center;gap:14px;padding:0 24px;border-bottom:1px solid var(--rule)}
.wm{display:inline-flex;align-items:center;line-height:0;margin-right:6px}
.wm img{height:20px;width:auto}
.wm .d{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wm .l{display:none}:root:not([data-theme="light"]) .wm .d{display:inline}}
:root[data-theme="dark"] .wm .l{display:none}:root[data-theme="dark"] .wm .d{display:inline}
.top .sp{flex:1}
.top .meta{color:var(--ink-2);font-size:.9375rem}
.tb{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:7px 10px;border-radius:6px;
  color:var(--ink-2);font-size:.9375rem;cursor:pointer;text-decoration:none}
.tb:hover{background:var(--signal-soft);color:var(--ink)}
.tb[aria-current="page"]{color:var(--ink);font-weight:700}
.tb.proto{border:1px dashed var(--rule-2);font-size:.8125rem}
.main{overflow:auto;position:relative}

/* ---------- the sign (one per onboarding screen) ---------- */
.stage{min-height:100%;display:flex;justify-content:center;padding:36px 24px 32px}
.stage.mid{align-items:center;padding-top:24px}
.sheet{width:38rem;max-width:100%}
.sheet.wide{width:52rem}
.sheet>h1{font-size:2.375rem;line-height:1.1}
.resume{font-size:.9375rem;color:var(--ink-2);margin:0 0 14px;display:flex;gap:8px;align-items:center}
.why{margin-top:10px;font-size:1.1875rem;line-height:1.45;max-width:36rem}
.note{margin-top:12px;color:var(--ink-2);font-size:1rem;max-width:36rem}
.note b{color:var(--ink);font-weight:700}
.act{margin-top:22px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.act .side-note{font-size:.9375rem;color:var(--ink-2);line-height:1.35}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 22px;border-radius:8px;border:1px solid transparent;
  background:var(--signal);color:var(--on-signal);font-weight:700;font-size:1.0625rem;cursor:pointer;text-decoration:none;
  transition:transform var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease),opacity var(--t-fast)}
.btn:hover{box-shadow:0 2px 6px oklch(0.235 0.014 70 / .18),0 6px 16px oklch(0.42 0.085 168 / .22)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn2{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--rule-2);
  background:transparent;color:var(--ink);font-weight:600;font-size:1rem;cursor:pointer;text-decoration:none}
.btn2:hover{border-color:var(--signal);background:var(--signal-soft)}
.btn2.sm{min-height:34px;padding:0 12px;font-size:.9375rem}
.lnk{background:none;border:0;padding:0;color:var(--signal);cursor:pointer;font-size:1rem;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.22em}
.skip{margin-top:26px;font-size:1rem}
.skip .cost{display:block;color:var(--ink-2);margin-top:4px;max-width:34rem;font-size:.9375rem}
.links{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:baseline}
.fine{margin-top:16px;font-size:.875rem;color:var(--ink-2)}

/* receipt: the proof of the step just finished, carried onto the next sign */
.receipt{list-style:none;margin:0 0 24px;padding:0 0 14px;border-bottom:1px solid var(--rule);display:grid;gap:8px;font-size:1rem;color:var(--ink-2)}
.receipt li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start}
.receipt li b{color:var(--ink);font-weight:700}
.receipt li .lnk,.receipt li .btn2{font-size:.9375rem;white-space:nowrap}
.receipt .st{margin-top:1px}

/* secure line: a rule and a lock, never a box */
.secure{margin-top:18px;border-top:1px solid var(--rule);padding-top:14px;display:grid;
  grid-template-columns:20px 1fr;gap:4px 12px;font-size:.9375rem;max-width:36rem;color:var(--ink-2)}
.secure>svg{color:var(--ink);margin-top:2px}
.secure p+p{margin-top:6px}
.secure b{color:var(--ink)}
.secure .fields{grid-column:2;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;color:var(--ink)}
.secure .fields>p{grid-column:1/3}
.field label{display:block;font-size:.9375rem;color:var(--ink-2)}
.field input,.field select{display:block;width:100%;height:46px;margin-top:4px;border:1px solid var(--rule-2);border-radius:7px;background:var(--sheet);padding:0 12px;color:var(--ink)}
.field input:focus,.field select:focus{outline:2px solid var(--signal);outline-offset:0;border-color:transparent}
.field .err{font-size:.9375rem;color:var(--needs-ink);margin-top:6px;display:flex;gap:6px}

/* search */
.search{margin-top:22px;max-width:36rem}
.search .box{display:flex;align-items:center;gap:10px;height:48px;border:1px solid var(--rule-2);border-radius:8px;padding:0 12px;background:var(--sheet)}
.search .box input{border:0;background:none;flex:1;height:100%;outline:none}
.search .box:focus-within{outline:2px solid var(--signal);outline-offset:0;border-color:transparent}
.search .hit{display:flex;justify-content:space-between;align-items:center;margin-top:6px;padding:10px 12px;border-radius:8px;background:var(--signal-soft);font-size:1rem}
.search .hit small{color:var(--ink-2)}

/* what one sign-in covers */
.covers{margin:14px 0 0;padding:0;list-style:none;font-size:1rem;display:grid;gap:4px;max-width:36rem}
.covers li{display:grid;grid-template-columns:22px 8.5rem 1fr;gap:8px;align-items:baseline}
.covers li span{color:var(--ink-2)}
.covers li.off{color:var(--ink-2)}
.covers li.off b{text-decoration:line-through;text-decoration-thickness:1px}
.covers svg{color:var(--proof)}

/* proof lines */
.proof{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:12px;max-width:36rem}
.proof li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;font-size:1.0625rem}
.proof li>.lnk{white-space:nowrap}
.proof li .t small{display:block;color:var(--ink-2);font-size:.9375rem;margin-top:2px}
.proof li.reading .t{color:var(--ink-2)}
.st{width:22px;height:22px;display:grid;place-items:center;margin-top:1px}
.st svg{width:20px;height:20px;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.st.done svg{stroke:var(--proof)}
.st.done .ck{stroke-dasharray:20;stroke-dashoffset:0;animation:draw var(--t-mid) var(--ease)}
@keyframes draw{from{stroke-dashoffset:9;opacity:.5}}
.st.reading svg{stroke:var(--ink-2);animation:turn 2.4s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
.st.needs svg{fill:var(--needs);stroke:none}
.st.skip svg{stroke:var(--ink-2)}

/* waiting state */
.wait{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;margin-top:28px;padding:18px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);max-width:36rem}
.winsk{width:128px;height:88px;border:1px solid var(--rule-2);border-radius:8px;background:var(--sheet);box-shadow:var(--shadow);position:relative;overflow:hidden}
.winsk::before{content:"";position:absolute;inset:0 0 auto;height:17px;background:var(--rule)}
.winsk i{position:absolute;left:12px;right:12px;height:7px;border-radius:3px;background:var(--rule)}
.winsk .host{position:absolute;left:8px;top:3px;font-size:9px;color:var(--ink);font-style:normal;white-space:nowrap}
.raised{margin:0 0 20px;padding:12px 14px;border-radius:8px;background:var(--signal-soft);display:flex;gap:10px;font-size:1rem;max-width:36rem}
.drop{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-top:24px;padding:20px;border:1.5px dashed var(--rule-2);border-radius:10px;max-width:36rem}

/* steps list (fallbacks) */
.steps{margin:18px 0 0;padding:0;list-style:none;counter-reset:s;display:grid;gap:8px;max-width:36rem;font-size:1rem}
.steps li{counter-increment:s;display:grid;grid-template-columns:26px 1fr}
.steps li::before{content:counter(s);font-weight:700;color:var(--ink-2)}
.choices{list-style:none;margin:22px 0 0;padding:0;display:grid;max-width:36rem;border-top:1px solid var(--rule)}
.choices li{border-bottom:1px solid var(--rule)}
.choices button{display:grid;grid-template-columns:1fr 20px;gap:4px 12px;width:100%;text-align:left;background:none;border:0;padding:14px 4px;cursor:pointer}
.choices button:hover{background:var(--signal-soft)}
.choices button b{font-weight:700}
.choices button span{grid-column:1;color:var(--ink-2);font-size:.9375rem}
.choices button svg{grid-row:1/3;grid-column:2;align-self:center;color:var(--ink-2)}

/* payment */
.price{margin-top:24px;max-width:36rem;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:16px 0;display:grid;grid-template-columns:1fr auto;gap:2px 16px;align-items:baseline}
.price .p{font-size:1.75rem;font-weight:700;letter-spacing:-0.01em}
.price .p small{font-size:1rem;font-weight:400;color:var(--ink-2)}
.price .d{color:var(--ink-2);font-size:.9375rem;grid-column:1/3}
.found{margin-top:14px;font-size:1rem;color:var(--ink-2);max-width:36rem;display:flex;gap:8px}
.found svg{color:var(--proof);margin-top:3px}
details.plans{margin-top:12px;max-width:36rem}
details.plans summary{cursor:pointer;color:var(--signal);font-size:1rem;list-style:none;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.22em;display:inline}
details.plans summary::-webkit-details-marker{display:none}
.planlist{border:0;margin:10px 0 0;padding:0;display:grid}
.plan{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:10px 4px;border-bottom:1px solid var(--rule);cursor:pointer;font-size:1rem}
.plan:first-of-type{border-top:1px solid var(--rule)}
.plan:has(input:checked){background:var(--signal-soft)}
.plan input{margin:4px 0 0;accent-color:var(--signal);width:16px;height:16px}
.plan small{display:block;color:var(--ink-2);font-size:.875rem}
.plan .p{font-weight:700;white-space:nowrap}

/* ---------- the route line (asks at the foot) ---------- */
.rail{border-top:1px solid var(--rule);background:var(--ground);padding:14px 24px 14px;display:grid;grid-template-columns:9.5rem 1fr;gap:6px 20px;align-items:start}
.rail .lead{font-size:.875rem;color:var(--ink-2);line-height:1.3}
.rail .lead b{display:block;color:var(--ink);font-size:1.0625rem;font-weight:700}
.rail ol{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.rail li{position:relative;padding-top:24px;min-width:0}
.rail li::before{content:"";position:absolute;top:8px;left:0;right:0;height:2px;background:var(--rule-2)}
.rail li:last-child::before{right:auto;width:18px}
.rail li.done::before,.rail li.skipped::before{background:var(--signal)}
.rail .dot{position:absolute;top:0;left:0;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--ground);border:2px solid var(--rule-2)}
.rail .dot svg{width:12px;height:12px;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.rail li.done .dot{background:var(--signal);border-color:var(--signal);color:var(--on-signal)}
.rail li.done .dot svg{stroke:var(--on-signal)}
.rail li.now .dot{border:5px solid var(--signal);background:var(--ground)}
.rail li.skipped .dot{border-color:var(--signal)}
.rail li.skipped .dot svg{stroke:var(--ink-2)}
.rail li.needs .dot{border-color:var(--needs);background:var(--needs)}
.rail li.needs .dot svg{stroke:var(--ground)}
.rail .lb{display:block;font-size:.9375rem;line-height:1.25;color:var(--ink-2);padding-right:8px}
.rail li.now .lb{color:var(--ink);font-weight:700}
.rail li.done .lb{color:var(--ink)}
.rail li.needs .lb{color:var(--ink)}
.rail li .w{display:block;font-size:.8125rem;color:var(--ink-2);margin-top:1px}
.rail li.needs .w{color:var(--needs-ink)}
.rail li button{all:unset;cursor:pointer;display:block}
.rail li button:hover .lb{text-decoration:underline;text-underline-offset:.2em}
.rail li button:focus-visible{outline:2px solid var(--signal);outline-offset:3px;border-radius:4px}
.rail .bg{grid-column:2;font-size:.875rem;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.rail .bg svg{animation:turn 2.4s linear infinite}

/* prototype controls: floating, outside the design */
.protobar{position:fixed;right:16px;bottom:112px;z-index:12;max-width:250px;padding:10px 12px;border:1px dashed var(--rule-2);border-radius:8px;background:var(--ground);font-size:.8125rem;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.protobar.app{bottom:16px}
.protobar button{font-size:.8125rem;background:none;border:1px solid var(--rule-2);border-radius:999px;padding:3px 10px;cursor:pointer;color:var(--ink-2)}
.protobar button:hover{color:var(--ink);border-color:var(--signal)}

/* motion: one authored moment per flow (the sign push; the week unfolding) */
.enter{animation:push var(--t-mid) var(--ease)}
@keyframes push{from{opacity:.0;transform:translateX(20px)}}
:root[data-motion="reduced"] *,:root[data-motion="reduced"] *::before{animation:none!important;transition:none!important}
@media (prefers-reduced-motion: reduce){:root:not([data-motion="on"]) *{animation:none!important;transition:none!important}}

/* ---------- week grid (R1, week view) ---------- */
.wk{display:grid;grid-template-columns:40px repeat(7,minmax(0,1fr));column-gap:6px;font-size:.75rem;position:relative}
.wk .dh{padding:0 0 8px;font-size:.9375rem;font-weight:700;border-bottom:1px solid var(--rule);line-height:1.2}
.wk .dh small{display:block;font-weight:400;color:var(--ink-2);font-size:.8125rem}
.wk .load{display:block;height:6px;border-radius:3px;background:var(--rule);margin-top:8px;overflow:hidden}
.wk .load i{display:block;height:100%;background:var(--ink-2);border-radius:3px}
.wk .dh.peak .load i{background:var(--ink)}
.wk .dh .tag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:4px;font-size:.6875rem;font-weight:700;line-height:1.5;vertical-align:2px;background:var(--signal);color:var(--on-signal)}
.wk .dh.is-today{color:var(--signal)}
.wk .col.is-today{background:color-mix(in oklch,var(--signal-soft) 45%,transparent)}
.wk .nowl{position:absolute;left:-1px;right:0;border-top:2px solid var(--signal);z-index:2;pointer-events:none}
.wk .nowl::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--signal)}
.wk .here{grid-column:1/-1;font-size:.875rem;color:var(--ink-2);padding:0 0 8px;display:flex;gap:8px;align-items:center}
.wk .here i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--signal)}
#cl[hidden]{display:none}
.blk.optional .opt{position:absolute;bottom:-8px;right:4px;padding:0 4px;background:var(--ground);color:var(--ink);font-size:.6875rem;font-weight:600;line-height:14px;border-radius:3px}
.wk .dh .lt{display:block;font-weight:600;font-size:.8125rem;margin-top:4px;color:var(--ink-2)}
.wk .dh.peak .lt{color:var(--ink)}
.wk .dues{padding:8px 0;display:grid;align-content:start;gap:6px;border-bottom:1px solid var(--rule)}
.wk .due{display:block;background:none;border:0;padding:0;text-align:left;cursor:pointer;font-size:.8125rem;line-height:1.25;color:var(--ink)}
.wk .due b{font-weight:700;display:block}
.wk .due span{color:var(--ink-2)}
.wk .due:hover b{text-decoration:underline}
.wk .col{position:relative;border-left:1px solid var(--rule)}
.wk .hrs{position:relative}
.wk .hrs span{position:absolute;right:4px;transform:translateY(-50%);color:var(--ink-2);font-size:.75rem;white-space:nowrap}
.wk .hl{position:absolute;left:0;right:0;border-top:1px solid color-mix(in oklch,var(--rule) 70%,transparent)}
.blk{position:absolute;left:3px;right:14px;border-radius:5px;padding:2px 5px;overflow:hidden;line-height:1.2;font-size:.75rem;font-weight:700;
  background:oklch(var(--tint-l) var(--tint-c) var(--h,250));color:oklch(var(--lab-l) var(--lab-c) var(--h,250));border:1px solid transparent;cursor:pointer;text-align:left;white-space:nowrap;text-overflow:ellipsis}
.blk.neutral{background:color-mix(in oklch,var(--ink) 10%,var(--ground));color:var(--ink)}
.blk.optional{background:transparent;border:1.5px dashed oklch(var(--lab-l) var(--lab-c) var(--h,250));overflow:visible;font-weight:600}
.blk.optional.neutral{border-color:var(--ink-2)}
.blk.soft{background-image:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in oklch,var(--ground) 45%,transparent) 6px 8px)}
.blk small{display:block;font-weight:400;opacity:.9;overflow:hidden;text-overflow:ellipsis}
.blk:focus-visible{outline-offset:1px}
.dmk{position:absolute;right:1px;width:11px;height:11px;margin-top:-5.5px;padding:0;border:0;background:var(--signal);transform:rotate(45deg);border-radius:1.5px;cursor:pointer}
.dmk:hover{outline:2px solid var(--signal);outline-offset:2px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:.8125rem;color:var(--ink-2);margin-top:10px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend i.dm{width:9px;height:9px;transform:rotate(45deg);background:var(--signal);border-radius:1px;margin-right:8px}

/* ---------- Your week (K): one confirm list ---------- */
.ktable{margin-top:16px;border-top:1px solid var(--rule);max-width:44rem}
.ktable .r{display:grid;grid-template-columns:7rem 1fr auto;gap:2px 16px;padding:8px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.ktable .r b{font-weight:700}
.ktable .r .m{font-size:1rem}
.ktable .r .m>span{display:block}
.ktable .r .m small{color:var(--ink-2);font-size:.9375rem;margin-left:8px}
.klines{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px;max-width:44rem;font-size:1rem}
.klines li{display:grid;grid-template-columns:22px 1fr;gap:10px}
.klines li svg{color:var(--ink-2);margin-top:3px}

/* ---------- reveal ---------- */
.split{display:grid;grid-template-columns:minmax(0,1fr) 19rem;gap:44px;padding:28px 40px 24px;min-height:100%}
.split h1{font-size:3rem;line-height:1.05;letter-spacing:-0.02em}
.split .sub{color:var(--ink-2);margin-top:8px;font-size:1.0625rem}
.split .sub b{color:var(--ink)}
.reveal .wkwrap{animation:unfold 700ms var(--ease) both}
@keyframes unfold{from{clip-path:inset(0 0 40% 0);opacity:.55}to{clip-path:inset(0 0 0 0);opacity:1}}
.reveal .side{animation:fadein 400ms 300ms var(--ease) backwards}
@keyframes fadein{from{opacity:.4;transform:translateY(8px)}}
.side{display:flex;flex-direction:column;gap:22px;padding-top:6px}
.side h2{font-size:1rem;font-weight:700;color:var(--ink-2)}
.nextbox h2{color:var(--ink-2)}
.nextbox .tt{font-size:1.625rem;font-weight:700;line-height:1.2;margin-top:6px;letter-spacing:-0.01em}
.nextbox .m{color:var(--ink-2);font-size:1rem;margin-top:6px}
.nextbox .y{font-size:1rem;margin-top:10px}
.side .grp p{font-size:1rem}
.side .grp p+p{margin-top:6px}

/* ---------- Today ---------- */
.app{height:100vh;display:grid;grid-template-rows:52px 1fr}
.today{display:grid;grid-template-columns:minmax(0,47rem) 16rem;gap:48px;justify-content:center;padding:32px 32px 56px}
/* round 2: what changed folds under the list, one line each */
.chg{margin-top:var(--gap-group);border-top:1px solid var(--rule);padding-top:4px}
.chg>summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:10px 4px;border-radius:6px;font-size:1rem}
.chg>summary::-webkit-details-marker{display:none}
.chg>summary b{font-size:1.0625rem}
.chg>summary span{color:var(--ink-2)}
.chg>summary .tw{margin-left:auto;color:var(--signal);font-size:.9375rem;white-space:nowrap}
.chg>summary:hover{background:color-mix(in oklch,var(--signal-soft) 60%,transparent)}
.chg>summary:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.chg:not([open])>summary .tw::before{content:"Show"} .chg[open]>summary .tw::before{content:"Hide"}
.chg .lines{margin:2px 0 6px 4px}
.chg .lines li .new{font-size:.75rem;font-weight:700;color:var(--signal);letter-spacing:.02em;margin-right:6px}
.amb .cls{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.amb .cls button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:center;padding:4px;border-radius:6px;cursor:pointer;font-size:.9375rem;line-height:1.25}
.amb .cls button:hover{background:var(--signal-soft)}
.amb .cls button:focus-visible{outline:2px solid var(--signal)}
.amb .cls small{display:block;color:var(--ink-2);font-size:.8125rem}
.amb .cls .ring{width:26px;height:26px}
.amb .exam{font-size:.9375rem;line-height:1.35}
.amb .exam small{display:block;color:var(--ink-2);font-size:.8125rem}
.dateline{color:var(--ink-2);font-size:1rem}
.verdict{font-size:2.25rem;line-height:1.1;font-weight:700;margin-top:6px;letter-spacing:-0.015em}
.verdict-s{font-size:1.1875rem;color:var(--ink-2);margin-top:10px;max-width:36rem;line-height:1.45}
.verdict-s b{color:var(--ink);font-weight:600}
.next{margin-top:28px;padding:20px 0 22px;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule)}
.next h2{font-size:1.625rem;line-height:1.2}
.next .m{color:var(--ink-2);font-size:1rem;margin-top:6px}
.next .late{font-size:1rem;margin-top:6px;color:var(--needs-ink);display:flex;gap:8px;align-items:baseline}
.next .late svg{fill:var(--needs);stroke:none;align-self:center}
.next .acts{display:flex;gap:12px;margin-top:18px;align-items:center;flex-wrap:wrap}
.rows{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:var(--gap-row)}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:12px;align-items:center;min-height:var(--row-h);padding:0 8px 0 4px;border-radius:6px;cursor:pointer}
.row:hover,.row:focus-within,.row.sel{background:color-mix(in oklch,var(--signal-soft) 75%,transparent)}
.row .ti{font-size:1.0625rem;line-height:1.3;padding:6px 0;text-wrap:pretty}
.row .ti .c{color:var(--ink-2);font-size:.875rem;margin-left:8px;white-space:nowrap}
.row .du{color:var(--ink-2);font-size:.9375rem;white-space:nowrap}
.row .es{font-size:.9375rem;min-width:3.6rem;text-align:right;white-space:nowrap;font-weight:600}
.row.after .ti,.row.after .es{color:var(--ink-2);font-weight:400}
.row.done .ti{text-decoration:line-through;color:var(--ink-2)}
.row .avoid{display:block;font-size:.875rem;color:var(--needs-ink);white-space:normal}
.dn{width:22px;height:22px;border-radius:50%;border:1.7px solid var(--ink-2);background:none;display:grid;place-items:center;cursor:pointer;padding:0;color:var(--on-signal)}
.dn:hover{border-color:var(--proof)}
.dn[aria-pressed="true"]{background:var(--proof);border-color:var(--proof)}
.dn svg{width:14px;height:14px;stroke-width:2.4;opacity:0}
.dn[aria-pressed="true"] svg{opacity:1}
.fold{margin:18px 0 6px;display:flex;align-items:center;gap:12px;color:var(--ink-2);font-size:.875rem}
.fold::before,.fold::after{content:"";height:1px;background:var(--rule-2);flex:1}
.fold::before{flex:0 0 20px}
.more{font-size:.9375rem;color:var(--ink-2);margin:8px 4px 0}
.region{margin-top:var(--gap-group)}
.region>h2{font-size:1.1875rem;display:flex;gap:10px;align-items:baseline}
.region>h2 small{font-weight:400;color:var(--ink-2);font-size:.9375rem}
.region .empty{color:var(--ink-2);font-size:1rem;margin-top:6px}
.lines{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px;font-size:1rem}
.lines li{display:flex;gap:10px;align-items:baseline}
.lines li>svg{align-self:flex-start;margin-top:3px;color:var(--ink-2)}
.lines li .src{color:var(--ink-2);font-size:.875rem;white-space:nowrap}
.lines li>.lnk,.lines li>.btn2{margin-left:auto;white-space:nowrap}
.card{margin-top:12px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:16px 0;position:relative}
.card .q{font-size:1.1875rem;font-weight:600;line-height:1.35}
.card .ev{font-size:.9375rem;color:var(--ink-2);margin-top:8px}
.card blockquote{margin:10px 0 0;padding:8px 12px;border-left:1px solid var(--rule-2);color:var(--ink-2);font-size:.9375rem}
.card .acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.pointer{margin-top:var(--gap-group);padding-top:14px;border-top:1px solid var(--rule);font-size:1rem;color:var(--ink-2);display:flex;gap:10px;align-items:baseline}
.pointer b{color:var(--ink)}
.lw{display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:14px 0;border-bottom:1px solid var(--rule);font-size:1.0625rem}
.lw small{color:var(--ink-2);grid-column:1;font-size:.9375rem}
.lw .acts{grid-row:1/3;grid-column:2;display:flex;gap:8px;align-items:center}
details.disc summary{cursor:pointer;color:var(--signal);font-size:.9375rem;list-style:none}
details.disc summary::-webkit-details-marker{display:none}
details.disc summary::before{content:"";display:inline-block;width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);margin-right:8px;vertical-align:2px;transition:transform var(--t-fast)}
details.disc[open] summary::before{transform:rotate(45deg)}
.mini{list-style:none;margin:8px 0 0;padding:0;font-size:.875rem;display:grid;gap:4px;max-height:220px;overflow:auto}
.mini li span{color:var(--ink-2)}

/* where you stand: one ring per course (VISION) */
.ws{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 24px}
.ws li button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;padding:6px;border-radius:6px;cursor:pointer;font-size:1rem}
.ws li button:hover{background:var(--signal-soft)}
.ws li button:focus-visible{outline:2px solid var(--signal)}
.ws .nm small{display:block;color:var(--ink-2);font-size:.875rem}
.ring{width:30px;height:30px}
.ring circle{fill:none;stroke-width:3}
.ring .bg{stroke:var(--rule)}
.ring text{font-size:9.5px;font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:central;font-family:var(--font)}
.ring .nogr{stroke:var(--rule-2);stroke-dasharray:2 3}

/* ambient column: status, then the day */
.amb{display:flex;flex-direction:column;gap:26px}
.amb h2{font-size:1rem;margin-bottom:10px}
.day{position:relative;margin-left:44px}
.day .hl{position:absolute;left:0;right:0;border-top:1px solid var(--rule)}
.day .hl span{position:absolute;right:calc(100% + 8px);top:-9px;font-size:.75rem;color:var(--ink-2);white-space:nowrap}
.day .blk{left:0;right:0;font-size:.75rem;line-height:1.15;padding:1px 7px}
.day .now{position:absolute;left:-6px;right:0;border-top:2px solid var(--signal)}
.day .now::before{content:"";position:absolute;left:0;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--signal)}
.day .free{position:absolute;left:0;right:0;border-radius:4px;background:color-mix(in oklch,var(--proof) 12%,transparent);border:1px dashed color-mix(in oklch,var(--proof) 55%,transparent);display:flex;align-items:center;padding-left:8px;font-size:.8125rem;color:var(--ink)}
.cap{font-size:.9375rem;color:var(--ink-2);margin-top:10px}
.status{font-size:.9375rem;padding-bottom:16px;border-bottom:1px solid var(--rule)}
.status .ok{display:flex;gap:8px;align-items:center;color:var(--ink-2)}
.status .ok svg{color:var(--proof)}
.status .bad{display:grid;grid-template-columns:14px 1fr;gap:8px;margin-top:12px}
.status .bad .dm{width:10px;height:10px;background:var(--needs);transform:rotate(45deg);margin-top:6px}
.status .off .dm{background:none;border:1.5px solid var(--ink-2)}
.status .bad .btn2{margin-top:8px}
.exams{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px;font-size:1rem}
.exams li small{display:block;color:var(--ink-2);font-size:.875rem}

/* popover, dialog */
.pop{position:fixed;z-index:30;width:330px;background:var(--sheet);border:1px solid var(--rule-2);border-radius:10px;box-shadow:var(--shadow);padding:16px;font-size:.9375rem}
.pop h3{font-size:1.0625rem;margin-bottom:6px;padding-right:24px}
.pop .row2{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:var(--ink-2);font-size:.9375rem}
.pop .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.pop .x{position:absolute;top:10px;right:10px}
.scrim{position:fixed;inset:0;z-index:20;background:var(--dim)}
.dialog{position:fixed;z-index:31;left:50%;top:50%;transform:translate(-50%,-50%);width:min(32rem,calc(100vw - 32px));background:var(--sheet);border:1px solid var(--rule-2);border-radius:12px;box-shadow:var(--shadow);padding:30px}
.dialog h2{font-size:1.625rem}
.dialog p{margin-top:12px}

/* R0 transfer */
.xfer{list-style:none;margin:24px 0 0;padding:0;display:grid;gap:9px;max-width:40rem}
.xfer li{display:grid;grid-template-columns:22px 11rem 1fr;gap:12px;font-size:1rem;align-items:start}
.xfer li .src{font-weight:700}
.xfer li .t{color:var(--ink-2)}
.xfer li.done .t{color:var(--ink)}
.count{margin-top:10px;color:var(--ink-2);font-size:1.0625rem}
.bar{height:6px;border-radius:3px;background:var(--rule);margin-top:14px;max-width:40rem;overflow:hidden}
.bar i{display:block;height:100%;background:var(--signal);transition:width var(--t-mid) var(--ease)}

/* drawer (task opened) */
.drawer{position:fixed;top:52px;right:0;bottom:0;width:31rem;background:var(--sheet);border-left:1px solid var(--rule-2);box-shadow:var(--shadow);z-index:15;overflow:auto;padding:26px 30px 40px;animation:slidein var(--t-mid) var(--ease)}
@keyframes slidein{from{transform:translateX(24px);opacity:.4}}
.drawer .c{color:var(--ink-2);font-size:.9375rem}
.drawer h2{font-size:1.625rem;line-height:1.2;margin-top:4px}
.drawer .kv{display:grid;grid-template-columns:9rem 1fr;margin-top:18px;font-size:1rem;border-top:1px solid var(--rule)}
.drawer .kv>*{padding:9px 0;border-bottom:1px solid var(--rule)}
.drawer .kv dt{color:var(--ink-2)}
.drawer .kv dd{margin:0;display:flex;justify-content:space-between;gap:8px}
.drawer .kv dd button{font-size:.875rem}
.drawer h3{font-size:1.0625rem;margin-top:24px}
.stepl{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}
.stepl li{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;min-height:36px;font-size:1rem}
.stepl li span{color:var(--ink-2);font-size:.9375rem}
.hist{list-style:none;margin:8px 0 0;padding:0;font-size:.9375rem;color:var(--ink-2);display:grid;gap:4px}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--ground);border-radius:10px;padding:11px 16px;display:flex;gap:14px;align-items:center;font-size:1rem;box-shadow:var(--shadow);z-index:40;animation:fadein var(--t-mid) var(--ease);max-width:min(44rem,calc(100vw - 32px))}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer}

/* morning pass, focus, capture */
.pass{max-width:42rem;margin:0 auto;padding:64px 24px}
.pass h1{font-size:2.375rem;line-height:1.1}
.pass .lines{font-size:1.0625rem;gap:12px;margin-top:24px}
.pass .lines li{border-bottom:1px solid var(--rule);padding-bottom:12px}
.focus{display:grid;grid-template-columns:1fr 18rem;gap:56px;max-width:64rem;margin:0 auto;padding:64px 32px}
.timer{font-size:6rem;font-weight:300;letter-spacing:-0.04em;line-height:1;color:var(--ink)}
.capture{position:fixed;left:50%;top:84px;transform:translateX(-50%);width:min(38rem,calc(100vw - 32px));background:var(--sheet);border:1px solid var(--rule-2);border-radius:12px;box-shadow:var(--shadow);z-index:31;padding:14px}
.capture input{width:100%;height:48px;border:0;background:none;font-size:1.1875rem;outline:none}
.capture .pv{border-top:1px solid var(--rule);margin-top:8px;padding-top:10px;font-size:1rem}
.page{max-width:44rem;margin:0 auto;padding:48px 24px}
.page h1{font-size:2.25rem;line-height:1.1}

/* jumper (prototype only) */
.jump{position:fixed;top:0;right:0;bottom:0;width:22rem;background:var(--sheet);border-left:1px solid var(--rule-2);box-shadow:var(--shadow);z-index:50;overflow:auto;padding:18px 20px;font-size:.875rem;transform:translateX(100%);transition:transform var(--t-mid) var(--ease);visibility:hidden}
.jump.open{transform:none;visibility:visible}
.jump h2{font-size:1rem;margin:16px 0 6px}
.jump h2:first-child{margin-top:0}
.jump ul{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.jump a{display:grid;grid-template-columns:7.5rem 1fr;gap:8px;padding:3px 6px;border-radius:5px;text-decoration:none;color:var(--ink)}
.jump a code{font-size:.75rem;color:var(--ink-2);font-family:ui-monospace,Consolas,monospace}
.jump a[aria-current="page"]{background:var(--signal-soft)}
.jump a:hover{background:var(--signal-soft)}
.jump label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.jump select{border:1px solid var(--rule-2);border-radius:6px;background:var(--ground);padding:3px 6px}

@media (max-width: 1100px){
  .today{grid-template-columns:minmax(0,40rem) 16rem;gap:40px}
  .split{grid-template-columns:minmax(0,1fr) 17rem;gap:28px;padding:24px}
}
@media (max-width: 860px){
  body{overflow:auto}
  .today,.split,.focus{grid-template-columns:1fr}
  .rail ol{grid-auto-flow:row;grid-template-columns:repeat(4,1fr);row-gap:12px}
  .rail{grid-template-columns:1fr}.rail .bg{grid-column:1}
  .ws{grid-template-columns:1fr}
  .protobar{position:static;margin:24px 16px}
}
</style>

  const at = o.at === 'end' ? list.length : list.findIndex(a => a[0] === o.at);
  let done = 0, left = 0;
  const items = list.map(([k, label], i) => {
    let s = i < at ? 'done' : i === at ? 'now' : 'todo';
    let w = '';
    const ov = o.st?.[k];
    if (ov) { s = ov.s || s; w = ov.w || ''; }
    if (s === 'skipped' && !w) w = 'Skipped';
    if (s === 'done' || s === 'skipped') done++; else left++;
    const word = { done: 'done', now: 'you are here', todo: 'not yet', needs: 'needs you', skipped: 'skipped' }[s];
    const inner = `<span class="dot" aria-hidden="true"><svg viewBox="0 0 20 20">${stIcon(s)}</svg></span><span class="lb">${esc(label)}</span>${w ? `<span class="w">${esc(w)}</span>` : ''}`;
    const proof = ov?.p || PROOF[k] || '';
    return `<li class="${s}" ${s === 'now' ? 'aria-current="step"' : ''}>${s === 'done' ? `<button data-pop="${esc(label)}|${esc(proof)}" aria-label="${esc(label)}: done. ${esc(proof)}. Show what it found">${inner}</button>` : `<span class="sr">${esc(label)}: ${word}. </span><span aria-hidden="true">${inner}</span>`}</li>`;
  }).join('');
  const lead = o.at === 'none' ? `<b>${list.length} steps</b>About 10 minutes` : `<b>${done} of ${list.length} done</b>${o.lead || (left ? 'Your setup' : 'Setup finished')}`;
  const bg = o.bg ? `<p class="bg" role="status">${ic('reading', 'i s')}<span>In the background: ${esc(o.bg)}</span></p>` : '';
  return `<nav class="rail" aria-label="Setup steps"><div class="lead">${lead}</div><ol>${items}</ol>${bg}</nav>`;
}
const railOf = scr => typeof scr?.rail === 'function' ? scr.rail() : scr?.rail;
function stepsLeft(scr) { const r = railOf(scr); if (!r) return 0; const list = ASKS[r.list || 'maya']; const at = r.at === 'end' ? list.length : Math.max(0, list.findIndex(a => a[0] === r.at)); return list.length - at; }

const btnGo = (id, label, o = {}) => `<button class="${o.cls || 'btn'}" data-go="${id}" ${o.attrs || ''}>${label}${o.icon ? ic(o.icon) : ''}</button>`;
const skip = (id, label, cost) => `<div class="skip"><a class="lnk" href="#${id}">${label}</a><span class="cost">${cost}</span></div>`;
const proto = (items, app) => `<div class="protobar${app ? ' app' : ''}" aria-label="Prototype controls"><span>Simulate:</span>${items.map(([l, id]) => `<button data-go="${id}">${l}</button>`).join('')}</div>`;

function toast(text, undoId, undoLabel) {
  $$('.toast').forEach(t => t.remove());

  document.body.appendChild(t);
  setTimeout(() => t.remove(), 6000);
}
function popover(anchor, html) {
  closePop();

  p.innerHTML = html + `<button class="tb x" data-close aria-label="Close">${ic('x', 'i s')}</button>`;
  document.body.appendChild(p);
  const r = anchor.getBoundingClientRect();
  let top = r.bottom + 8, left = Math.min(r.left, innerWidth - 350);
  if (top + p.offsetHeight > innerHeight - 8) top = Math.max(8, r.top - p.offsetHeight - 8);
  p.style.top = top + 'px'; p.style.left = Math.max(8, left) + 'px';
  p._anchor = anchor;
  (p.querySelector('button,a,input,select') || p).focus();
}

}
function appFrame(scr, inner) {

/* ---------- router ---------- */
function route() {
  closePop(); $$('.drawer,.capture,.toast').forEach(x => x.remove());
  const raw = decodeURIComponent(location.hash.slice(1)) || 'W0';
  let [id, ...mods] = raw.split('~');
  if (ALIAS[id]) id = ALIAS[id];
  if (mods.includes('dark')) document.documentElement.dataset.theme = 'dark';
  else if (mods.includes('light')) document.documentElement.dataset.theme = 'light';
  else applySet();
  const scr = SCREENS[id] || SCREENS.W0;
  if (scr.id !== 'X1') LAST = scr.id;
  let html;
  if (scr.overlay) {
    const base = SCREENS[scr.overlay()] || SCREENS.W0;
    html = (base.frame === 'app' ? appFrame : obFrame)(base, base.render()) + scr.render();
  } else html = (scr.frame === 'app' ? appFrame : obFrame)(scr, scr.render());
  $('#root').innerHTML = html;
  document.title = 'Knowlu · ' + (scr.title || scr.id);
  $$('.jump a').forEach(a => a.setAttribute('aria-current', a.getAttribute('href') === '#' + scr.id ? 'page' : 'false'));
  resolveProofs();
  scr.after && scr.after();
  const h = $('.dialog h2') || $('#main h1');
  if (h && !mods.includes('nofocus')) h.focus({ preventScroll: true });
}

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); if (g.dataset.toast) toast(g.dataset.toast, g.dataset.undo); location.hash = g.dataset.go; return; }
  const pp = e.target.closest('[data-pop]');
  if (pp) { const [a, b] = pp.dataset.pop.split('|'); popover(pp, `<h3>${a}</h3><p>${b}</p>`); return; }
  if (e.target.closest('[data-close]')) { closePop(); return; }
  if (e.target.closest('[data-jump]')) { toggleJump(); return; }
  if (e.target.closest('[data-leave]')) { SET.from = LAST; }
  if (e.target.closest('[data-toast]')) { const t = e.target.closest('[data-toast]'); toast(t.dataset.toast, t.dataset.undo, t.dataset.undolabel); }
  if (!e.target.closest('.pop') && !e.target.closest('[data-popper]')) closePop();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('.pop')) closePop(); else if ($('.jump.open')) toggleJump(); else if ($('.drawer')) { $('.drawer').remove(); } else if (SCREENS[LAST]?.esc) location.hash = SCREENS[LAST].esc; }
});

const GOOGLE_TITLES = ['Marsh Library circulation desk', 'Pre-Health Society meeting', 'Intramural soccer', 'Haircut', 'Family video call', 'Halloween party at Jordan\'s', 'Dentist'];
const SHORT = { 'Marsh Library circulation desk': 'Library desk', 'Pre-Health Society meeting': 'Pre-Health', 'Intramural soccer': 'Soccer', 'Family video call': 'Family call', 'Halloween party at Jordan\'s': 'Halloween party' };
const baseTitle = t => t.replace(/ \(.*\)$/, '');
const hm = s => { const [h, m] = s.split(':').map(Number); return h + m / 60; };
const fmt = s => { let [h, m] = s.split(':').map(Number); const ap = h >= 12 && h < 24 ? 'pm' : 'am'; h = h % 12 || 12; return `${h}:${String(m).padStart(2, '0')} ${ap}`; };
const fmtH = h => fmt(h + ':00').replace(':00', '');
const parseDue = t => { const m = t.match(/(\d+):(\d+) (am|pm)/); if (!m) return null; let h = +m[1] % 12 + (m[3] === 'pm' ? 12 : 0); return h + +m[2] / 60; };
const est = h => h >= 1 ? (Number.isInteger(h) ? h + 'h' : h.toFixed(1).replace('.0', '') + 'h') : Math.round(h * 60) + 'm';
const isGoogle = b => GOOGLE_TITLES.includes(baseTitle(b.title));
const LEVEL_WORD = { hard: 'Firm', soft: 'Flexible', optional: 'Optional' };
const liveDues = d => (d.due || []).filter(x => !(x.state_now || '').startsWith('done')).slice().sort((a, b) => parseDue(a.due_time) - parseDue(b.due_time));
const courseOfDue = x => x.course || (D.assignments.find(a => a.title === x.title) || {}).course || '';

function weekGrid(days, o = {}) {
  const S = 8, E = 24, px = o.pxh ?? 24, H = (E - S) * px;
  const left = x => (typeof TASKS !== 'undefined' && TASKS[x.id]?.remaining_hours) ?? x.estimate_hours;
  const loads = days.map(d => liveDues(d).reduce((a, x) => a + left(x), 0));
  const peak = Math.max(...loads);
  const hrs = []; for (let h = S; h <= E; h += 2) hrs.push(h);
  const hourCol = `<div class="hrs" style="height:${H}px">${hrs.map(h => `<span style="top:${(h - S) * px}px">${fmtH(h)}</span>`).join('')}</div>`;
  const head = `<div></div>` + days.map((d, i) => { const dt = new Date(d.date + 'T12:00'); const L = loads[i];
    const tg = d.date === o.today ? 'Today' : d.date === o.tomorrow ? 'Tomorrow' : '';
    return `<div class="dh${L && L === peak ? ' peak' : ''}${d.date === o.today ? ' is-today' : ''}">${d.weekday.slice(0, 3)}${tg ? `<span class="tag">${tg}</span>` : ''}<small>${dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</small><span class="load" role="img" aria-label="${L ? 'About ' + est(L) + ' of work due' : 'Nothing due'}"><i style="width:${Math.round(L / Math.max(peak, 4) * 100)}%"></i></span><span class="lt">${L ? est(L) + ' due' : 'Nothing due'}</span></div>`; }).join('');
  const dues = o.list ? `<div></div>` + days.map(d => { const live = liveDues(d); const shown = live.length > 4 ? live.slice(0, 3) : live; const more = live.slice(shown.length);
    return `<div class="dues">${shown.map(x => `<button class="due" data-popper data-pop="${esc(x.title)}|${esc(courseOfDue(x))} · due ${esc(x.due_time)} · about ${est(x.estimate_hours)}"><b>${esc(x.title)}</b><span>${esc(x.due_time)} · ${esc(courseOfDue(x))}</span></button>`).join('') || '<span style="color:var(--ink-2)">Nothing due</span>'}${more.length ? `<span style="color:var(--ink-2)">+${more.length} more, about ${est(more.reduce((a, x) => a + x.estimate_hours, 0))}</span>` : ''}</div>`; }).join('') : '';
  const lines = hrs.map(h => `<div class="hl" style="top:${(h - S) * px}px"></div>`).join('');
  const cols = days.map((d, di) => {
    const bl = d.blocks.map((b, bi) => {
      if (o.noGoogle && isGoogle(b)) return '';
      const s = Math.max(S, hm(b.start)), e = Math.min(E, hm(b.end));
      const top = (s - S) * px, h = Math.max(15, (e - s) * px - 2);
      const code = codeOf(b.title), t = baseTitle(b.title);
      const cls = ['blk', code ? '' : 'neutral', b.level === 'optional' ? 'optional' : '', b.level === 'soft' ? 'soft' : ''].join(' ');
      const kind = code ? t.replace(code + ' ', '') : fmt(b.start);
      return `<button class="${cls}" style="top:${top}px;height:${h}px;${code ? `--h:${HUE[code]}` : ''}" data-blk="${di}:${bi}" aria-label="${esc(t)}, ${fmt(b.start)} to ${fmt(b.end)}, ${LEVEL_WORD[b.level]}">${esc(code || SHORT[t] || t)}${h > 30 ? `<small>${esc(kind)}</small>` : ''}${b.level === 'optional' ? '<span class="opt" aria-hidden="true">optional</span>' : ''}</button>`;
    }).join('');
    const dm = liveDues(d).map(x => { const t = parseDue(x.due_time); if (t == null) return ''; const y = (Math.min(E - 0.1, Math.max(S, t)) - S) * px;
      return `<button class="dmk" style="top:${y}px" data-popper data-pop="${esc(x.title)}|${esc(courseOfDue(x))} · due ${esc(x.due_time)} · about ${est(x.estimate_hours)}" aria-label="Due ${esc(x.due_time)}: ${esc(x.title)}"></button>`; }).join('');
    const nowl = d.date === o.today && o.nowH != null ? `<div class="nowl" style="top:${(o.nowH - S) * px}px" title="Now"></div>` : '';
    return `<div class="col${d.date === o.today ? ' is-today' : ''}" style="height:${H}px">${lines}${bl}${dm}${nowl}</div>`;
  }).join('');
  const here = o.here ? `<p class="here"><i aria-hidden="true"></i>${o.here}</p>` : '';
  return `<div class="wk" data-week>${here}${head}${dues}${hourCol}${cols}</div>
    <div class="legend"><span><i style="background:oklch(var(--tint-l) var(--tint-c) 160)"></i>Class</span><span><i style="background:color-mix(in oklch,var(--ink) 10%,var(--ground))"></i>Job, club, your own</span><span><i style="background:repeating-linear-gradient(135deg,var(--rule-2) 0 3px,transparent 3px 6px)"></i>Flexible</span><span><i style="border:1.5px dashed var(--ink-2)"></i>Optional: never counted as busy</span><span><i style="background:var(--ink);height:4px;border-radius:2px"></i>Bar: most due that week</span><span><i class="dm"></i>Due (select one)</span></div>`;
}
function blockPopover(days, btn) {
  const [di, bi] = btn.dataset.blk.split(':').map(Number);
  const b = days[di].blocks[bi], t = baseTitle(b.title);
  const where = b.room ? `<p class="row2"><span>${esc(b.room)}</span></p>` : '';
  let body;
  if (isGoogle(b)) body = `<p class="row2"><span>From Google Calendar</span><span>${LEVEL_WORD[b.level]}</span></p>${where}<p style="margin-top:8px">Times are read-only here; change them in Google Calendar. How firm it is can change in Settings, under Your week.</p>`;
  else if (b.kind === 'office hours' || /office hours/.test(t)) body = `<p class="row2"><span>From ${esc(codeOf(t))}’s syllabus</span><span>Optional</span></p>${where}<p style="margin-top:8px">Optional: never counts as busy time.</p>`;
  else body = `<p class="row2"><span>From the ${C.short} registrar</span><span>Firm</span></p>${where}`;
  popover(btn, `<h3>${esc(t)}</h3><p class="row2"><span>${days[di].weekday}, ${fmt(b.start)} to ${fmt(b.end)}</span></p>${body}`);
}
function wireWeek(days) {
  $$('[data-blk]').forEach(b => { b.setAttribute('data-popper', ''); b.addEventListener('click', e => { e.stopPropagation(); blockPopover(days, b); }); });
}
const REV = D.reveal.week;

/* K: Your week, one confirm list (the grid is kept for the reveal) */
const DAYS3 = ds => ds.join(', ');
def('K', {
  title: 'Your week', group: 'Your week', back: 'Y1-cs110', left: 1,
  rail: { list: 'maya', at: 'week', bg: 'reading CS 110’s syllabus; its exams and late rule join your week on their own' },
  render: () => sheet({
    wide: true, h: 'Your week', body:
      why('These came from the registrar. Check them once; anything can change later.') +
      `<div class="ktable" role="list" aria-label="Your classes">${D.courses.map(c => `<div class="r" role="listitem"><b>${c.code}</b><span class="m">${c.meetings.map(m => `<span>${DAYS3(m.days)} · ${fmt(m.start)} to ${fmt(m.end)}<small>${m.kind}, ${esc(m.room)}</small></span>`).join('')}</span><button class="lnk" data-toast="${c.code}’s times open for editing.">Change</button></div>`).join('')}</div>` +
      `<ul class="klines">
        <li>${ic('cal', 'i s')}<span>From your calendar: <b>Library desk</b> counts as firm, <b>Pre-Health Society</b> as flexible, <b>soccer</b> as optional.</span></li>
        <li>${ic('clock', 'i s')}<span>Office hours from your syllabi are optional, never busy. Free time is counted from 7:30 am to 11:30 pm. <button class="lnk" data-toast="Your day opens for editing.">Change</button></span></li>
      </ul>` +
      `<div class="act">${go('R0', 'These are right')}</div>`
  })
});

/* R0: building your week (transfer screen, countable, no spinner) */
function r0(cap) {

  const lis = rows.map(r => {
    const rd = reading[r.src];
    if (rd && !(cap && r.src !== 'Syllabi')) return `<li class="reading" ${cap ? '' : `data-delay="${rd.t}" data-done="${esc(rd.d)}" data-ds="done"`}><span class="st reading"><svg viewBox="0 0 20 20" aria-hidden="true">${P.reading}</svg></span><span class="src">${esc(r.src)}</span><span class="t">${esc(rd.r)}</span></li>`;
    return `<li class="done"><span class="st done"><svg viewBox="0 0 20 20" aria-hidden="true">${P.check}</svg></span><span class="src">${esc(r.src)}</span><span class="t">${esc(r.proof)}</span></li>`;

  return sheet({

      (cap ? note('CS 110’s syllabus is still being read. Your week opens now, and its exams and late rule appear on your page when they’re ready.') + `<div class="act">${go('R1-cap', 'See your week')}</div>` : proto([['3 minutes pass', 'R0-cap']]))
  });
}
def('R0', {
  title: 'Building your week', group: 'Reveal', noLeave: true, waiting: 'Up to 3 minutes',
  rail: { list: 'maya', at: 'end' },
  render: () => r0(false),
  after: () => {
    const fix = () => { const n = 12 - $$('.xfer li.reading').length; const c = $('#r0c'); if (!c) return; c.textContent = `${n} of 12 done · usually under 3 minutes`; $('#r0b').style.width = (n / 12 * 100) + '%'; };
    const mo = new MutationObserver(() => { fix(); if (!$$('.xfer li.reading').length) { mo.disconnect(); setTimeout(() => { if (location.hash === '#R0') location.hash = 'R1'; }, 1400); } });
    mo.observe($('.xfer'), { subtree: true, attributes: true, attributeFilter: ['class'] });

});

def('R1', { title: 'Here’s your week', group: 'Reveal', noLeave: true, render: () => reveal(), after: () => wireWeek(REV) });

/* ===== the main page: Today, task drawer, late window closed, states ===== */
const TD = D.today;
const TASKS = {}; [...TD.list, ...TD.later].forEach(t => { if (!TASKS[t.id]) TASKS[t.id] = t; });
const hrs = h => h >= 1 ? `${Math.floor(h)}h${Math.round((h % 1) * 60) ? ' ' + Math.round((h % 1) * 60) + 'm' : ''}` : `${Math.round(h * 60)}m`;
const emailById = id => D.emails.find(e => e.id === id);
const STATUS_WORD = { ahead: 'ahead', 'on track': 'on track', behind: 'behind' };
const LETTER_HUE = { A: 165, B: 250, C: 85, D: 300, F: 300 };
const FREE = D.today.free_time.hours;

function ring(g) {
  if (!g || SET.grades === 'hidden') return `<svg class="ring" viewBox="0 0 26 26" aria-hidden="true"><circle class="nogr" cx="13" cy="13" r="10"/></svg>`;
  const c = 2 * Math.PI * 10, f = c * g.pct / 100, hue = LETTER_HUE[g.letter[0]];
  return `<svg class="ring" viewBox="0 0 26 26" role="img" aria-label="${g.course} grade ${g.letter}, ${g.pct}%"><circle class="bg" cx="13" cy="13" r="10"/><circle cx="13" cy="13" r="10" stroke="oklch(0.62 0.12 ${hue})" stroke-dasharray="${f} ${c}" transform="rotate(-90 13 13)" stroke-linecap="round"/><text x="13" y="13.5">${g.letter}</text></svg>`;
}
function taskRow(t, o = {}) {
  const code = t.course && HUE[t.course] ? t.course : (t.domain || 'Personal');
  return `<li class="row${o.after ? ' after' : ''}${o.done ? ' done' : ''}" data-task="${t.id}" tabindex="-1">

    <span class="ti">${esc(t.title)}<span class="c">${esc(code)}</span>${o.avoid ? `<span class="avoid">${o.avoid}</span>` : ''}</span>
    <span class="du">${o.done ? `done ${o.done}` : esc(t.due_text)}</span>
    <span class="es">${esc(o.est || t.estimate_text)}</span></li>`;
}
function dayStrip(v) {
  const S = 7.5, E = 23.5, px = 23, H = (E - S) * px;
  const blocks = v.allclear ? [{ title: 'Intramural soccer', start: '16:00', end: '17:00', level: 'optional' }, { title: 'Family video call', start: '19:00', end: '20:00', level: 'soft' }] : v.empty ? [] : TD.schedule;
  const ticks = [8, 10, 12, 14, 16, 18, 20, 22].map(h => `<div class="hl" style="top:${(h - S) * px}px"><span>${fmtH(h)}</span></div>`).join('');

  const free = v.empty || v.allclear ? '' : `<div class="free" style="top:${(18 - S) * px}px;height:${5.5 * px}px">free</div>`;

  return `<div class="day" style="height:${H}px">${ticks}${free}${bl}${now}</div>

function whereYouStand() {
  const G = {}; D.grades.forEach(g => G[g.course] = g);

    const g = G[d.code];

function gradePop(anchor, code) {

  popover(anchor, `<h3>${code}: ${g.letter}, ${g.pct}%</h3><p class="row2"><span>${g.earned} of ${g.possible} points · ${g.graded} graded</span><span>Blackboard, 6:02 am</span></p>
    <ul class="mini" style="max-height:220px">${Object.entries(cats).map(([c, es]) => `<li><b>${esc(c)}</b> <span>· ${w[c] ?? '?'}% of the grade</span>${es.map(e => `<div style="display:flex;justify-content:space-between"><span>${esc(e.title)}</span><span>${e.score}/${e.possible}</span></div>`).join('')}</li>`).join('')}</ul>
    ${g.pending.length ? `<p class="row2"><span>Waiting to be graded: ${esc(g.pending.join(', '))}</span></p>` : ''}`);
}
function statusBlock(v) {
  if (v.offline) return `<div class="status" role="status"><div class="bad off" style="margin-top:0"><span class="dm"></span><div><b>Offline since 7:40 am.</b> Everything here is from the 6:04 am check. Changes you make stay on this computer and sync when you’re back.</div></div></div>`;
  if (v.empty) return `<div class="status"><p class="ok">${ic('check', 'i s')}Up to date, 6:04 am. Nothing needs you.</p></div>`;
  const vhl = `<div class="bad"><span class="dm" aria-hidden="true"></span><div><span class="sr">Needs you: </span>VHL signed you out. Sign in again to bring in new VHL work; what Knowlu already has is still here.<br><button class="btn2 sm" data-toast="VHL’s sign-in opens.">Sign in to VHL</button></div></div>`;
  const bb = v.broken ? `<div class="bad"><span class="dm" aria-hidden="true"></span><div><span class="sr">Problem: </span>Blackboard stopped answering at 6:02 am. Knowlu tries again at 12:00 pm; what it has is still here. <span class="fine" style="display:block;margin:2px 0 0">Code: BB-TIMEOUT</span></div></div>` : '';
  return `<div class="status"><p class="ok">${ic('check', 'i s')}${v.broken ? 'Checked 6:04 am, with one problem.' : 'Up to date, 6:04 am. Next check 12:00 pm.'}</p>${bb}${v.allclear ? '' : vhl}</div>`;
}
function region(id, title, meta, body, emptyText, isEmpty) {
  if (isEmpty && SET.regions === 'hide') return '';
  return `<section class="region" id="${id}" aria-labelledby="${id}-h"><h2 id="${id}-h">${title}${meta ? ` <small>${meta}</small>` : ''}</h2>${isEmpty ? `<p class="empty">${emptyText}</p>` : body}</section>`;
}
function deckCard(i = 0) {
  const order = ['d-surf', 'd-panel', 'd-ext', 'd-lab8'];
  const d = D.decisions.find(x => x.id === order[i]); const em = emailById(d.evidence_email);
  return `<div class="card" role="group" aria-label="Question ${i + 1} of 4"><p class="q">${esc(d.question)}</p>${d.detail ? `<p class="ev">${esc(d.detail)}</p>` : ''}
    <p class="ev">From an email, ${new Date(em.received).toLocaleDateString('en-US', { month: 'long', day: 'numeric' })}, ${esc(em.from.split(' <')[0])} · waited ${d.waiting_days_now} day${d.waiting_days_now === 1 ? '' : 's'}</p>
    <details class="disc" style="margin-top:6px"><summary>Show the email</summary><blockquote><span class="sr">Quoted email text: </span>“${esc(em.quote)}”</blockquote></details>
    <div class="acts"><button class="btn" style="min-height:40px" data-answer>${esc(d.answers[0])}</button><button class="btn2" data-answer>${esc(d.answers[1])}</button><button class="lnk" data-answer data-notnow>Not now</button>${i < 3 ? `<span class="fine" style="margin:0 0 0 auto">${3 - i} more after this one</span>` : ''}</div></div>`;
}
const GTK_ICON = n => n.source_email ? 'mail' : /grade/i.test(n.source || '') ? 'grade' : /calendar/i.test(n.source || '') ? 'cal' : 'book';

function renderToday(v = {}) {
  const L = TD.list, E = v.empty;
  let verdict, next = '', rows, after = '';
  if (v.allclear || E) {
    verdict = E ? `<h1 class="verdict" tabindex="-1">Nothing active.</h1><p class="verdict-s">When Knowlu finds work in your sources, it appears here in order.</p>` :
      `<h1 class="verdict" tabindex="-1">Nothing is due today. The day is yours.</h1><p class="verdict-s">Next up tomorrow: Reading: Ch. 11, Cell signaling, due Monday at 9:00 am, about 30 minutes.</p>`;
    rows = `<p class="empty" style="color:var(--ink-2);margin-top:18px">${E ? 'Nothing is at risk today.' : 'You’re ahead for the week. Stopping here is fine.'}</p>`;
  } else {
    const n = L[0];
    verdict = `<h1 class="verdict" tabindex="-1">Lab 6 is next.</h1><p class="verdict-s">It’s past due: finishing it today keeps it at −30%. Everything due by tomorrow fits today, with <b>about ${FREE}h free</b> after it.</p>`;
    next = `<div class="next" data-task="${n.id}"><h2>${esc(n.title)}</h2>
      <p class="m">CS 110 · zyBooks · 40% done · about ${n.estimate_text} left</p>
      <p class="late">${ic('diamond', 'i s')}<span>Was due Friday at 11:59 pm. ${esc(n.late_label)}.</span></p>
      <div class="acts"><button class="btn" data-toast="zyBooks opens Lab 6 in your browser.">Open in zyBooks</button><button class="btn2" data-done-next>${ic('check', 'i s')}Mark done</button><button class="lnk" data-open="${n.id}">Details</button></div></div>`;
    const rest = L.slice(1);
    if (v.avoided) rest.splice(0, 0, { ...(TASKS['t-cs-p2'] || TD.later.find(t => t.title.startsWith('Project 2'))), estimate_text: '25m today' });
    rows = `<ul class="rows" aria-label="The rest of today">${rest.map((t, i) => taskRow(t, { avoid: v.avoided && i === 0 ? 'Passed over 4 days running. 25 minutes today makes the rest easier.' : '' })).join('')}
      ${TD.done_today.map(t => taskRow({ ...t, due_text: '', estimate_text: '' }, { done: '7:55 am' })).join('')}</ul>`;
    const lat = TD.later.slice(1, 4), restL = TD.later.slice(4), rh = restL.reduce((a, t) => a + t.remaining_hours, 0);
    after = `<div class="fold" role="separator">Today’s free time ends here</div><ul class="rows" aria-label="After today’s free time">${lat.map(t => taskRow(t, { after: 1 })).join('')}</ul>
      <p class="more">${restL.length} more this term, about ${Math.round(rh)}h · <a href="#T-week">See the week</a></p>`;
  }
  /* round 2: "what changed" folds under the list (no morning gate); Good to know merges into it */
  const gtkN = TD.good_to_know.map(id => D.notices.find(n => n.id === id)).filter(n => n && !/Lab 4/.test(n.text));
  const chgItems = [
    `<li>${ic('check', 'i s')}<span><b>Pre-lecture quiz: Ch. 7</b> marked done by Knowlu. Blackboard shows it turned in.</span><button class="lnk" data-go="T-undo">Undo</button></li>`,
    `<li>${ic('grade', 'i s')}<span>BIO 201 Lab 4 report graded: 44/50.</span><span class="src">Blackboard grades</span></li>`,
    ...gtkN.map(n => `<li>${ic(GTK_ICON(n), 'i s')}<span>${esc(n.text)}</span><span class="src">${n.source_email ? 'from an email' : esc(n.source)}</span></li>`),
    `<li>${ic('ask', 'i s')}<span>1 new question: move Lab 8 to Friday, November 6? It’s in Needs you, below.</span></li>`];
  const delta = E || v.allclear ? '' : `<details class="chg" id="chg"${v.morning ? ' open' : ''}><summary><b>What changed</b><span>since 6:00 pm yesterday · ${chgItems.length} things, 1 you can undo</span><span class="tw"></span></summary><ul class="lines">${chgItems.join('')}</ul></details>`;
  const needs = region('needs', 'Needs you', E ? '' : '4 questions, oldest 7 days', `<div id="deck">${deckCard(0)}</div>`, 'Queue clear: nothing waiting on you.', E);
  const closed = TD.closed_this_week;
  const closedList = `<ul class="lines" id="cl" ${v.undo ? '' : 'hidden'}>${closed.map((c, i) => `<li>${ic('check', 'i s')}<span>${v.undo && i === 1 ? `<b>${esc(c.title)}</b> is back on your list. Knowlu won’t mark it done again on its own.` : `${esc(c.title)} <span class="src">· ${c.by === 'Maya' ? 'you' : 'Knowlu: ' + esc(c.how)} · ${new Date(c.closed_at).toLocaleDateString('en-US', { weekday: 'short' })}</span>`}</span>${c.undo ? (v.undo && i === 1 ? `<button class="lnk" data-toast="Pre-lecture quiz: Ch. 7 marked done again.">Mark done again</button>` : `<button class="lnk" data-go="T-undo">Undo</button>`) : ''}</li>`).join('')}</ul>`;
  const lateN = TD.late_window_closed.length;
  const cl = E ? `<p class="pointer" id="closed">Nothing closed in the last 7 days. Nothing has passed its late window.</p>` :
    `<div class="pointer" id="closed" style="display:block"><p><b>${closed.length} closed this week</b>, ${closed.filter(c => c.by === 'Knowlu').length} by Knowlu because the site shows them turned in. <button class="lnk" data-expand="cl" aria-expanded="${!!v.undo}">Review or undo</button></p>${closedList}
      <p id="late" style="margin-top:6px"><b>${lateN} items left Today</b> because their late windows closed. <a href="#T-late">See them</a></p></div>`;
  const G = {}; D.grades.forEach(g => G[g.course] = g);
  const classes = E ? '' : `<section><h2>Your classes</h2><ul class="cls">${TD.domains.filter(d => d.code).map(d => { const g = G[d.code];
    return `<li><button data-grade="${d.code}" data-popper title="${esc(d.sentence)}">${ring(g)}<span>${esc(d.domain)}${SET.grades === 'hidden' || !g ? '' : ' · ' + g.letter}<small>${d.code} · ${STATUS_WORD[d.status]}${d.hours >= 1 ? ', about ' + Math.round(d.hours) + 'h' : ''}</small></span></button></li>`; }).join('')}</ul></section>`;
  const x0 = TD.upcoming_exams[0];
  const coming = E ? '' : `<section><h2>Coming up</h2><p class="exam">${x0.course} ${esc(x0.title)} · ${new Date(x0.date + 'T12:00').toLocaleDateString('en-US', { weekday: 'long' })} ${fmt(x0.start)}<small>${esc(x0.room)}</small></p><p class="exam" style="margin-top:8px"><small>${TD.upcoming_exams.length - 1} more exams in 14 days. ${esc(TD.ahead_takeaway)} <a href="#T-week">The week</a></small></p></section>`;
  const amb = `<aside class="amb" aria-label="Status and your day">${statusBlock(v)}<section><h2>Your day</h2>${dayStrip(v)}</section>${coming}${classes}</aside>`;
  const date = v.allclear ? 'Sunday, November 1 · week 10 of 16' : 'Monday, October 26 · week 10 of 16';
  return `<div class="today"><div class="doc"><p class="dateline">${date}</p>${verdict}${next}${rows}${after}${delta}${needs}${cl}</div>${amb}</div>`;
}

function openDrawer(id) {
  const t = TASKS[id] || TD.list.find(x => x.id === id); if (!t) return;
  $$('.drawer').forEach(d => d.remove());
  const steps = t.steps || [];
  const d = document.createElement('aside'); d.className = 'drawer'; d.setAttribute('aria-label', t.title);
  d.innerHTML = `<button class="tb x" style="position:absolute;top:14px;right:14px" data-shut aria-label="Close">${ic('x', 'i s')}</button>
    <p class="c">${esc(t.course)} · ${esc(t.domain)}</p><h2 tabindex="-1">${esc(t.title)}</h2>
    <p class="why" style="font-size:1rem">${esc(t.why || 'Placed by its due date and how long it takes.')}</p>
    <dl class="kv"><dt>Due</dt><dd>${esc(t.due_text)} <button class="lnk">Change</button></dd>
      <dt>Estimate</dt><dd>about ${hrs(t.remaining_hours)} left of ${hrs(t.estimate_hours)} <button class="lnk">Change</button></dd>
      <dt>Course</dt><dd>${esc(t.domain)} (${esc(t.course)}) <button class="lnk">Change</button></dd>
      <dt>Importance</dt><dd>Normal <button class="lnk">Change</button></dd>
      <dt>Source</dt><dd>${esc(t.source)}</dd>
      <dt>First guess</dt><dd>${hrs(t.estimate_hours)}, from how long exam study usually takes you</dd></dl>
    ${steps.length ? `<h3>Steps</h3><ul class="stepl">${steps.map(s => `<li><button class="dn" aria-pressed="${s.done}" data-done aria-label="Step: ${esc(s.title)}">${ic('check', 'i')}</button>${esc(s.title)}<span>${hrs(s.hours)}</span></li>`).join('')}</ul><p class="fine">Checking every step doesn’t finish the task; Knowlu asks you instead.</p>` : ''}
    <h3>Notes</h3><p class="fine" style="margin-top:6px"><button class="lnk">Add a note</button></p>
    <h3>History</h3><ul class="hist"><li>Oct 18 · created by Knowlu from CHEM 231’s syllabus (Exam 2, Thursday 9:30 am)</li><li>Oct 26 · 1h 48m recommended for today</li></ul>
    <div class="act" style="margin-top:24px"><a class="btn" href="#T-focus">${ic('play', 'i s')}Start a focus session</a><button class="btn2" data-toast="Pinned to the top until it’s done.">${ic('pin', 'i s')}Pin</button></div>
    <div class="links"><button class="lnk" data-toast="Report a problem: time estimate off, wrong due date, wrong course, duplicate, shouldn’t be a task…">Report a problem</button><button class="lnk" data-toast="Delete asks first, with an optional reason.">Delete</button></div>`;
  document.body.appendChild(d); d.querySelector('h2').focus();
  d.querySelector('[data-shut]').onclick = () => { d.remove(); if (location.hash === '#T-task') history.replaceState(null, '', '#T'); };
}

function wireToday() {
  SEL = -1;
  $('#main').addEventListener('click', e => {
    const dn = e.target.closest('[data-done]');
    if (dn) { e.stopPropagation(); const on = dn.getAttribute('aria-pressed') !== 'true'; dn.setAttribute('aria-pressed', on); dn.closest('.row')?.classList.toggle('done', on); if (dn.closest('.row') && on) toast('Done.', 'T'); return; }
    if (e.target.closest('[data-done-next]')) { toast('Lab 6: Functions marked done. Next: zyBooks 7.1-7.4 participation.', 'T'); return; }
    const ex = e.target.closest('[data-expand]'); if (ex) { const el = $('#' + ex.dataset.expand); el.hidden = !el.hidden; ex.setAttribute('aria-expanded', !el.hidden); return; }
    const ans = e.target.closest('[data-answer]'); if (ans) { const deck = $('#deck'); const i = (+deck.dataset.i || 0) + 1; toast(ans.dataset.notnow ? 'Moved to the back of the queue.' : 'Done.', 'T'); if (i < 4) { deck.dataset.i = i; deck.innerHTML = deckCard(i); } else deck.innerHTML = '<p class="empty">Queue clear: nothing waiting on you.</p>'; return; }
    const gr = e.target.closest('[data-grade]'); if (gr) { e.stopPropagation(); gradePop(gr, gr.dataset.grade); return; }
    const op = e.target.closest('[data-open]'); if (op) { openDrawer(op.dataset.open); return; }
    const r = e.target.closest('.row[data-task]'); if (r && !e.target.closest('button,a')) openDrawer(r.dataset.task);
  });
}
let SEL = -1;
window.addEventListener('keydown', e => {
  const id = location.hash.slice(1).split('~')[0];
  if (!SCREENS[id] || SCREENS[id].group !== 'Today' || ['T-focus', 'T-week', 'T-late'].includes(id) || e.target.matches('input,textarea,select')) return;
  if (e.ctrlKey && e.code === 'Space') { e.preventDefault(); location.hash = 'T-capture'; return; }
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  const rs = $$('.next[data-task], .row[data-task]'); if (!rs.length) return;
  if (e.key === 'j' || e.key === 'k') { SEL = Math.max(0, Math.min(rs.length - 1, SEL + (e.key === 'j' ? 1 : -1))); rs.forEach(x => x.classList.remove('sel')); rs[SEL].classList.add('sel'); rs[SEL].scrollIntoView({ block: 'nearest' }); (rs[SEL].querySelector('[data-done],[data-done-next]') || rs[SEL]).focus(); }
  else if (e.key === 'x' && SEL >= 0) (rs[SEL].querySelector('[data-done]') || rs[SEL].querySelector('[data-done-next]'))?.click();
  else if (e.key === 'Enter' && SEL >= 0 && !e.target.closest('a,button')) { e.preventDefault(); openDrawer(rs[SEL].dataset.task); }
  else if (e.key === 'p' && SEL >= 0) toast('Pinned to the top until it’s done.', 'T');
  else if (e.key === 's') location.hash = 'T-focus';
  else if (e.key === '?') toast('j and k move · x done · p pin · Enter opens · s starts a focus session · Ctrl+Space adds or asks');
});

const T = (id, title, v, extra) => def(id, { title, group: 'Today', frame: 'app', render: () => renderToday(v), after: () => { wireToday(); extra && extra(); } });
T('T', 'Today', {});
T('T-task', 'Today: a task opened', {}, () => openDrawer('t-chem-ex2'));
T('T-undo', 'Today: Undo on a Knowlu close', { undo: 1 }, () => { $('#closed').scrollIntoView({ block: 'center' }); toast('Pre-lecture quiz: Ch. 7 is back on your list. Knowlu won’t mark it done again on its own.', 'T-undo', 'Mark done again'); });
T('T-grades', 'Today: grade breakdown', {}, () => { const b = $('[data-grade="CHEM 231"]'); b.scrollIntoView({ block: 'center' }); setTimeout(() => gradePop(b, 'CHEM 231'), 60); });
T('T-avoided', 'Today: a task being avoided', { avoided: 1 });
T('T-offline', 'Today: offline', { offline: 1 });
T('T-broken', 'Today: a source broken', { broken: 1 });
T('T-allclear', 'Today: all clear', { allclear: 1 });
T('T-empty', 'Today: every empty state', { empty: 1 });
T('T-capture', 'Today: add or ask', {}, () => {
  const box = document.createElement('div'); box.className = 'capture'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-label', 'Add or ask');
  box.innerHTML = `<input value="renew bus pass by saturday noon" aria-label="Add a task or ask Knowlu"><div class="pv">${ic('check', 'i s')} Added <b>Renew bus pass</b> to Personal, due Saturday at 12:00 pm, about 15m. <button class="lnk" data-toast="Removed.">Undo</button><p class="fine" style="margin-top:6px">Ask too: “why is Lab 6 first?” or “how much free time do I have Thursday?”</p></div>`;
  document.body.appendChild(box); box.querySelector('input').focus();
});

/* Late window closed: its own place, off Today (the ruling) */
def('T-late', {
  title: 'Late window closed', group: 'Today', frame: 'app',
  render: () => `<div class="page enter"><p class="dateline"><a href="#T">${ic('back', 'i s')}Today</a></p><h1 tabindex="-1" style="margin-top:10px">Late window closed</h1>
    <p class="why">These passed what their syllabus accepts, so they left Today and count toward nothing on it. Archive them, or say you’re still doing one.</p>
    <div style="margin-top:22px;border-top:1px solid var(--rule)">${TD.late_window_closed.map(t => `<div class="lw"><span>${esc(t.title)} <span style="color:var(--ink-2);font-size:.9375rem">· ${esc(t.course)}</span></span><small>Was due ${esc(t.due_text)}. ${esc(t.rule)}</small><span class="acts"><button class="btn2 sm" data-toast="${esc(t.title)} archived. It stays in your plan folder." data-undo="T-late">Archive</button><button class="btn2 sm" data-toast="${esc(t.title)} is back on Today, at the end of the list." data-undo="T-late">Still doing it</button></span></div>`).join('')}</div>
    <p class="fine">Nothing here is ever deleted. Archived items stay in your plan folder.</p></div>`
});

/* round 2: no morning gate. T0 is Today on the first open of a morning, with What changed unfolded under the list; T0-q is Needs you on Today */
T('T0', 'Today: first open of the morning', { morning: 1 });
T('T0-q', 'Today: Needs you', {}, () => $('#needs').scrollIntoView({ block: 'center' }));

/* Focus session */
def('T-focus', {
  title: 'Focus session', group: 'Today', frame: 'app',
  render: () => { const q = D.today.focus_session_example.serves.map(id => TASKS[id]); return `<div class="focus enter"><section><p class="dateline">Focus 1 of 4 · 25 minutes</p><h1 tabindex="-1" style="font-size:2.25rem;margin-top:8px">${esc(q[0].title)}</h1><p class="note">CS 110 · about ${q[0].estimate_text} left · ${esc(q[0].late_label)}</p>
      <p class="timer" style="margin-top:28px" aria-label="24 minutes 12 seconds left in this focus block">24:12</p>
      <div class="act"><button class="btn" data-toast="Done. Next: zyBooks 7.1-7.4 participation.">Done</button><button class="btn2" data-toast="Lab 6 is back on your list.">Skip</button><button class="btn2">Pause</button><a class="lnk" href="#T">Exit</a><button class="lnk" data-toast="Timer hidden. Timing still records.">Hide timer</button></div></section>
      <aside class="amb"><section><h2>Next in this session</h2><ul class="exams">${q.slice(1).map(t => `<li>${esc(t.title)}<small>${t.course} · ${esc(t.estimate_text)}</small></li>`).join('')}</ul></section><section><h2>Done this session</h2><p class="cap" style="margin:0">Nothing yet.</p></section></aside></div>`; }
});

/* ===== state jumper + controls (prototype only) ===== */
function buildJump() {
  const groups = {};
  Object.values(SCREENS).forEach(s => (groups[s.group || 'Other'] = groups[s.group || 'Other'] || []).push(s));
  const j = document.createElement('aside');
  j.className = 'jump'; j.id = 'jump'; j.setAttribute('aria-label', 'Prototype: screens and settings');
  const sel = (k, opts) => `<label>${k}<select data-set="${k}">${opts.map(o => `<option ${SET[k] === o ? 'selected' : ''}>${o}</option>`).join('')}</select></label>`;
  j.innerHTML = `<h2>Settings</h2>
    ${sel('theme', ['system', 'light', 'dark'])}${sel('motion', ['system', 'on', 'reduced'])}${sel('density', ['compact', 'normal', 'roomy'])}
    ${sel('regions', ['always', 'hide'])}${sel('grades', ['shown', 'hidden'])}
    <p class="fine" style="margin-top:6px">regions: “always” renders every Today region with its named empty state (the default). “hide” is hide-until-relevant, for comparison on T-empty.</p>
    <div style="margin-top:10px;display:flex;gap:8px"><button class="btn2 sm" data-copy>Copy my settings</button><button class="btn2 sm" data-jump>Close</button></div>
    ${Object.entries(groups).map(([g, list]) => `<h2>${g}</h2><ul>${list.map(s => `<li><a href="#${s.id}"><code>${s.id}</code><span>${esc(s.title)}</span></a></li>`).join('')}</ul>`).join('')}`;
  document.body.appendChild(j);
  j.addEventListener('change', e => { const k = e.target.dataset.set; if (k) { SET[k] = e.target.value; saveSet(); route(); } });
  j.addEventListener('click', e => {
    if (e.target.closest('[data-copy]')) {
      const txt = Object.entries(SET).filter(([k]) => k !== 'from').map(([k, v]) => `${k}: ${v}`).join('\n') + `\nscreen: ${location.hash.slice(1) || 'W0'}`;
      (navigator.clipboard?.writeText(txt) || Promise.reject()).then(() => toast('Settings copied.'), () => toast(txt.replace(/\n/g, ' · ')));
    }
  });
}
function toggleJump() {
  const j = $('#jump'); const open = !j.classList.contains('open');
  j.classList.toggle('open', open);
  $$('[data-jump][aria-expanded]').forEach(b => b.setAttribute('aria-expanded', open));
  if (open) (j.querySelector('a[aria-current="page"]') || j.querySelector('select')).focus();
}
document.addEventListener('keydown', e => { if (e.key === '\\' && !e.target.matches('input,textarea,select')) toggleJump(); });

applySet();
buildJump();
window.addEventListener('hashchange', route);
route();
