/* ---------- router and interactions ---------- */
const FIRST = 'o0-welcome';
function render() {
  applyPrefs();
  const id = decodeURIComponent(location.hash.slice(1)) || FIRST;
  const s = S[id] || S[FIRST];
  $('#app').innerHTML = s.fn();
  document.title = `${s.label} · Knowlu (direction 5b)`;
  renderProto(s.id);
  const h = $('#h1'); if (h && !P.has('shot')) h.focus({ preventScroll: true });
  const open = $('.row.open'); if (open) open.scrollIntoView({ block: 'start' });
  const sc = $('[data-scroll]'); if (sc) sc.scrollIntoView({ block: 'start' });
  const se = $('[data-scroll-end]'); if (se) se.scrollIntoView({ block: 'end' });
}
function renderProto(cur) {
  let el = $('.proto');
  if (!el) { el = document.createElement('div'); el.className = 'proto'; document.body.appendChild(el); }
  const groups = {};
  Object.values(S).forEach(s => (groups[s.group] = groups[s.group] || []).push(s));
  const wasOpen = el.dataset.open === '1';
  el.innerHTML = `<button type="button" aria-expanded="${wasOpen}" data-proto>Screens (${Object.keys(S).length}) and settings</button>
    <div class="panel" ${wasOpen ? '' : 'hidden'}><div class="tg">
      <button class="btn sm" type="button" data-pref="theme:${document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'}">${document.documentElement.dataset.theme === 'dark' ? 'Light (day board)' : 'Dark (night sign)'}</button>
      <button class="btn sm" type="button" data-pref="motion:${document.documentElement.dataset.motion === 'reduce' ? 'full' : 'reduce'}">Reduced motion: ${document.documentElement.dataset.motion === 'reduce' ? 'on' : 'off'}</button>
      <button class="btn sm" type="button" data-pref="density:${document.documentElement.dataset.density === 'compact' ? 'default' : 'compact'}">Rows: ${document.documentElement.dataset.density === 'compact' ? '36' : '44'} px</button>
      <button class="btn sm" type="button" data-copy>Copy my settings</button></div>
      ${Object.entries(groups).map(([g, ss]) => `<h4>${g}</h4>${ss.map(s => `<a href="#${s.id}" ${s.id === cur ? 'aria-current="page"' : ''}>${esc(s.label)}</a>`).join('')}`).join('')}</div>`;
}
const DOMCODE = Object.fromEntries(D.today.domains.map(d => [d.domain, d.code]));
document.addEventListener('click', e => {
  const t = e.target.closest('button, a'); if (!t) return;
  if (t.dataset.go) { e.preventDefault(); location.hash = t.dataset.go; return; }
  if (t.hasAttribute('data-proto')) { const p = $('.proto'); p.dataset.open = p.dataset.open === '1' ? '0' : '1'; renderProto((location.hash || '#' + FIRST).slice(1)); return; }
  if (t.dataset.pref) { const [k, v] = t.dataset.pref.split(':'); setPref(k, v); if (k === 'theme' && P.has('theme')) { history.replaceState(null, '', location.pathname + location.hash); P.delete('theme'); } render(); return; }
  if (t.hasAttribute('data-copy')) { const r = document.documentElement.dataset; const txt = `Direction 5b settings: screen ${location.hash || '#' + FIRST}, theme ${r.theme}, motion ${r.motion}, density ${r.density}, grades ${pref('grades', 'show')}`; try { navigator.clipboard.writeText(txt); t.textContent = 'Copied'; } catch (err) { t.textContent = txt; } return; }
  if (t.dataset.fold || t.dataset.foldOpen) { const key = t.dataset.fold || t.dataset.foldOpen; const b = $(`[data-fold="${key}"]`); const inner = b.nextElementSibling; const open = inner.hidden; inner.hidden = !open; b.setAttribute('aria-expanded', open); if (t.dataset.foldOpen) b.scrollIntoView({ block: 'start' }); return; }
  if (t.dataset.moreBtn) { document.querySelectorAll(`[data-more="${t.dataset.moreBtn}"]`).forEach(x => x.hidden = false); if (t.parentElement.tagName === 'LI') t.parentElement.remove(); else t.remove(); return; }
  if (t.dataset.toggle) { const el = document.getElementById(t.dataset.toggle); el.hidden = !el.hidden; t.setAttribute('aria-expanded', !el.hidden); return; }
  if (t.dataset.done) { const row = t.closest('.row'); row.classList.toggle('done'); const sub = row.querySelector('.sub'); if (row.classList.contains('done')) { sub.dataset.was = sub.innerHTML; sub.innerHTML = 'Done. <button class="link small" type="button" data-done="' + t.dataset.done + '">Undo</button>'; } else if (sub.dataset.was) sub.innerHTML = sub.dataset.was; return; }
  if (t.dataset.dom) { const on = t.getAttribute('aria-pressed') !== 'true'; document.querySelectorAll('[data-dom]').forEach(b => b.setAttribute('aria-pressed', 'false')); t.setAttribute('aria-pressed', on); const code = DOMCODE[t.dataset.dom]; document.querySelectorAll('.leftcol .rows .row').forEach(r => { const c = r.querySelector('.cc'); r.hidden = on && !(c && (c.textContent === code || c.textContent === t.dataset.dom)); }); return; }
  if (t.closest('.seg')) { t.closest('.seg').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === t)); return; }
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  const rows = [...document.querySelectorAll('.leftcol .rows .row:not([hidden])')].filter(r => r.offsetParent);
  const cur = document.activeElement.closest && document.activeElement.closest('.row');
  const i = rows.indexOf(cur);
  if (e.key === 'j' || e.key === 'k') { const n = rows[Math.max(0, Math.min(rows.length - 1, i + (e.key === 'j' ? 1 : -1)))]; if (n) n.querySelector('.ttl button').focus(); e.preventDefault(); }
  else if (e.key === 'x' && cur) cur.querySelector('[data-done]').click();
  else if (e.key === 'Escape' && $('.drawer')) location.hash = 'm1-today';
  else if (e.key === 'Enter' && document.activeElement === document.body) { const p = $('.btn.primary:not([disabled])'); if (p) p.click(); }
  else if (e.key === '?') { const k = $('.kbd'); if (k) { k.parentElement.scrollIntoView({ block: 'center' }); k.parentElement.style.color = 'var(--ink)'; } }
});
window.addEventListener('hashchange', render);
render();
