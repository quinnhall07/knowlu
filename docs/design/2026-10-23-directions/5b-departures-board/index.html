* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--ground); color: var(--ink);
  font-family: "Public Sans", system-ui, sans-serif;
  font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  /* Read face: Public Sans (civic signage lineage, plain zero). Atkinson Next was dropped in pass 2: its slashed zero made every course code read as terminal text. */
  font-variant-numeric: normal;
}
.tnum, .row .left, .sched li .fig, .rv-day .dh .v { font-variant-numeric: tabular-nums; }
.noproto .demo { display: none; }
[hidden] { display: none !important; }
::selection { background: var(--sel); color: var(--ink); }
* { scrollbar-width: thin; scrollbar-color: var(--rule-2) transparent; }
a { color: inherit; text-underline-offset: 3px; text-decoration-thickness: 1px; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; }

.fig { font-family: "Big Shoulders Text", "Big Shoulders", "Atkinson Hyperlegible Mono", sans-serif; font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; letter-spacing: 0.01em; font-weight: 600; }
.lab { font-family: "Big Shoulders Text", "Big Shoulders", sans-serif; font-weight: 700; letter-spacing: 0.01em; font-size: 19px; line-height: 1.1; }
.mono { font-family: "Atkinson Hyperlegible Mono", ui-monospace, monospace; font-size: 12.5px; }
.small { font-size: 13px; line-height: 1.4; }
.dim { color: var(--ink-2); }
.measure { max-width: 64ch; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--rule-2); background: transparent; color: var(--ink); cursor: pointer; font-weight: 600; font-size: 15px; text-decoration: none; transition: background-color .12s, border-color .12s; }
.btn:hover { background: var(--board-2); border-color: var(--ink-3); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.btn.primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); }
.btn[disabled] { opacity: 1; color: var(--ink-3); background: transparent; border-style: dashed; cursor: not-allowed; }
.btn.primary[disabled] { background: transparent; border-color: var(--rule-2); color: var(--ink-3); }
.btn.sm { min-height: 32px; padding: 0 12px; font-size: 13.5px; }
.link { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-weight: 500; min-height: 32px; }
.link:hover { color: var(--ink-2); }
.actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

/* Shapes */
.shape { width: 12px; height: 12px; flex: none; display: inline-block; vertical-align: -1px; }
.word { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.word.amber { color: var(--amber); }
.word.pill { padding: 2px 8px; border-radius: 999px; }
.word.amber.pill { background: var(--amber-fill); }
.word.needs .shape { color: var(--needs); }
.word.needs.pill { background: var(--needs-fill); }

/* Course chips */
.cc { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 4px; background: var(--c, var(--t-other)); color: var(--t-ink); font-size: 12px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; }

/* ---------- Onboarding shell ---------- */
.ob { display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
.rail { background: var(--board); border-right: 1px solid var(--rule); display: flex; flex-direction: column; min-height: 0; }
.rail-head { padding: 20px 20px 12px; display: flex; align-items: center; justify-content: space-between; }
.rail-head img { height: 22px; display: block; }
.rail-title { padding: 4px 20px 10px; display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--rule); }
.rail-list { list-style: none; margin: 0; padding: 6px 0; overflow: auto; flex: 1; }
.rail-row { display: grid; grid-template-columns: 18px 1fr auto; column-gap: 10px; padding: 5px 20px; align-items: start; }
.rail-row .nm { font-weight: 600; font-size: 14.5px; }
.rail-row .st { font-size: 12.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; padding-top: 1px; }
.rail-row .pf { grid-column: 2 / 4; font-size: 13px; color: var(--ink-2); line-height: 1.35; }
.rail-row.now { background: var(--board-2); }
.rail-row.now .st { color: var(--ink); }
.rail-row.ahead .nm { color: var(--ink-2); font-weight: 500; }
.rail-row.ahead .pf { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail-row.ahead .pf:has(.fnd) { white-space: normal; }
.rail-row.sub { padding-top: 2px; padding-bottom: 3px; padding-left: 48px; grid-template-columns: 14px 1fr auto; }
.rail-row.sub .nm { font-weight: 500; font-size: 13px; }
.rail-row.sub .st { font-weight: 500; }
.rail-row .shape { margin-top: 3px; }
.rail-row.needs .st { color: var(--ink); }
.rail-foot { border-top: 1px solid var(--rule); padding: 12px 20px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }

.obmain { display: grid; grid-template-rows: 1fr auto; min-height: 0; min-width: 0; }
.step { padding: 30px 56px 16px; overflow: auto; min-height: 0; }
.step-top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 12px; }
.step h1 { font-family: "Big Shoulders Text", "Big Shoulders", sans-serif; font-weight: 700; font-size: 40px; line-height: 1; letter-spacing: 0.005em; }
.step .why { font-size: 19px; line-height: 1.35; max-width: 62ch; margin-bottom: 16px; text-wrap: pretty; }
.step .body { max-width: 64ch; }
.step .body:has(.wyrows) { max-width: 820px; }
.step .body p + p { margin-top: 10px; }
.privacy { display: flex; gap: 10px; align-items: flex-start; color: var(--ink-2); font-size: 13.5px; max-width: 64ch; margin-top: 14px; }
.privacy svg { flex: none; margin-top: 2px; }
.cost { margin-top: 14px; font-size: 13.5px; color: var(--ink-2); max-width: 64ch; }
.cost b { color: var(--ink); font-weight: 600; }
.returnline { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border: 1px solid var(--rule-2); border-radius: 6px; margin-bottom: 18px; font-size: 14px; max-width: 72ch; }
.needsline { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border: 1px solid var(--rule-2); border-radius: 6px; margin-bottom: 18px; font-size: 14px; max-width: 72ch; }
.proof { display: flex; gap: 14px; align-items: flex-start; margin: 4px 0 18px; }
.proof .txt { font-size: 18px; line-height: 1.4; max-width: 56ch; }
.proof .txt .fig { font-size: 22px; }
.check { width: 28px; height: 28px; flex: none; }
.check circle { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.check path { fill: none; stroke: var(--ink); stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 0; animation: draw .24s cubic-bezier(.16,1,.3,1) both; }
@keyframes draw { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
[data-motion="reduce"] .check path { animation: none; }
@media (prefers-reduced-motion: reduce) { .check path { animation: none; } }

.tally { display: grid; grid-template-columns: repeat(5, auto); gap: 4px 28px; justify-content: start; margin: 8px 0 16px; }
.tally .n { font-size: 34px; line-height: 1; }
.tally .l { font-size: 13px; color: var(--ink-2); }
.facts { list-style: none; padding: 0; margin: 0 0 12px; max-width: 66ch; }
.facts li { display: grid; grid-template-columns: 160px 1fr; gap: 12px; padding: 5px 0; border-top: 1px solid var(--rule); font-size: 14.5px; }
.facts li:last-child { border-bottom: 1px solid var(--rule); }
.facts li .k { color: var(--ink-2); }

.field { display: flex; flex-direction: column; gap: 6px; max-width: 420px; margin: 4px 0 14px; }
.field label { font-size: 13.5px; font-weight: 600; }
.input { height: 40px; border-radius: 6px; border: 1px solid var(--rule-2); background: var(--board); color: var(--ink); padding: 0 12px; font: inherit; caret-color: var(--focus); }
.input::placeholder { color: var(--ink-3); }
.input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.err { color: var(--ink); font-size: 13.5px; display: flex; gap: 8px; align-items: center; }
.code { color: var(--ink-3); }
.opt { display: flex; gap: 10px; align-items: center; font-size: 14px; margin: 6px 0; }
.opt input { width: 18px; height: 18px; accent-color: var(--brand); }

/* Secure surfaces: two kinds */
.ext { border: 1px solid var(--rule-2); border-radius: 8px; padding: 14px 16px; max-width: 64ch; margin: 6px 0 16px; display: grid; grid-template-columns: 22px 1fr; gap: 4px 12px; }
.ext .host { font-family: "Atkinson Hyperlegible Mono", monospace; font-size: 12.5px; color: var(--ink-2); }
.kept { border: 1px solid var(--rule-2); border-radius: 8px; padding: 16px; max-width: 460px; margin: 6px 0 14px; background: var(--board); }
.kept .kh { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }

/* School list */
.schools { list-style: none; padding: 0; margin: 0 0 10px; max-width: 520px; border-top: 1px solid var(--rule); }
.schools li { border-bottom: 1px solid var(--rule); }
.schools button { width: 100%; text-align: left; background: none; border: 0; padding: 10px 4px; display: flex; justify-content: space-between; cursor: pointer; font-size: 15px; }
.schools button:hover { background: var(--board-2); }
.schools button[aria-pressed="true"] { font-weight: 700; }

/* ---------- The board during onboarding: one row per day, like a departures sign ---------- */
.bd { padding: 14px 56px 14px; border-top: 1px solid var(--rule); background: var(--board); }
.bd-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 8px; }
.bd-head .lab { font-size: 22px; }
.bd.mini { padding: 10px 56px; }
.bd.mini .bd-head { margin: 0; align-items: center; }
.bd.mini .lab { font-size: 18px; white-space: nowrap; }
.bd.mini .bd-head > .small { white-space: nowrap; }
.mcs { display: flex; gap: 2px; flex: 1; justify-content: center; }
.mc { display: inline-flex; align-items: baseline; gap: 6px; padding: 3px 9px; border-left: 1px solid var(--rule); font-size: 12.5px; color: var(--ink-2); }
.mc .fig { font-size: 18px; color: var(--ink); }
.mc .fig.zero { color: var(--ink-3); }
.mc.later { background: var(--board-2); border-radius: 4px; border-left: 0; margin-left: 6px; }
.bd-delta { font-size: 13.5px; font-weight: 600; color: var(--ink); display: inline-flex; gap: 8px; align-items: center; }
.bd-delta .sw { width: 14px; height: 10px; border-radius: 2px; background: var(--amber-fill); box-shadow: inset 0 0 0 1px var(--amber); }
.bd-rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.bd-row { display: grid; grid-template-columns: 74px 30px minmax(0, 1fr) 150px; align-items: center; column-gap: 12px; min-height: 30px; border-bottom: 1px solid var(--rule); }
.bd-row .d { font-size: 13.5px; font-weight: 600; }
.bd-row .n { font-size: 22px; line-height: 1; text-align: right; }
.bd-row .n.zero { color: var(--ink-3); }
.bd-row .it { display: flex; gap: 6px; flex-wrap: nowrap; min-width: 0; overflow: hidden; }
.bd-row .fix { display: flex; justify-content: flex-end; gap: 6px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.bd-row.later .d { color: var(--ink); }
.bd-row.later .it { font-size: 13px; color: var(--ink-2); gap: 14px; }
.dep2 { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px 0 3px; border-radius: 5px; border: 1px solid var(--rule); white-space: nowrap; font-size: 13px; }
.dep2 .fig { font-size: 15px; font-weight: 600; }
.dep2.new, .fix .new { background: var(--amber-fill); border-color: var(--amber); }
.fix .new { border: 1px solid var(--amber); border-radius: 4px; padding: 0 5px; color: var(--ink); }
[data-motion="full"] .dep2.new, [data-motion="full"] .fix .new { animation: landed 1.4s cubic-bezier(.16,1,.3,1) both; }
@keyframes landed { from { box-shadow: 0 0 0 4px var(--amber-fill); transform: translateY(-3px); } to { box-shadow: 0 0 0 0 transparent; transform: none; } }
@media (prefers-reduced-motion: reduce) { .dep2.new, .fix .new { animation: none !important; } }
.ghost { display: block; height: 8px; width: 46%; border-radius: 4px; background: var(--rule); }
.ghost.reading { background: repeating-linear-gradient(90deg, var(--rule-2) 0 10px, transparent 10px 16px); }
.bd-foot { display: flex; flex-wrap: wrap; gap: 4px 22px; margin-top: 8px; font-size: 13px; color: var(--ink-2); }
.bd-foot .fr { display: flex; gap: 8px; align-items: center; }
.stickyfoot { position: sticky; bottom: -16px; margin: 18px -56px -16px; padding: 12px 56px 14px; background: var(--ground); border-top: 1px solid var(--rule-2); display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.price { display: flex; align-items: baseline; gap: 10px; margin: 2px 0 4px; }
.price .fig { font-size: 44px; line-height: 1; }
.price span:last-child { font-size: 17px; }
.proofline { list-style: none; padding: 0; margin: 0 0 14px; display: flex; flex-wrap: wrap; gap: 4px 22px; font-size: 14px; color: var(--ink-2); }
.proofline li { display: flex; gap: 6px; align-items: center; }
.proofline b { color: var(--ink); font-weight: 600; }

/* ---------- The week strip (main page, not pinned) ---------- */
.wk { padding: 10px 56px 12px; border-top: 1px solid var(--rule); background: var(--ground); }
.wk-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; gap: 16px; }
.wk-grid { display: grid; grid-template-columns: repeat(7, 1fr) 0.8fr; border-left: 1px solid var(--rule); }
.wk-col { border-right: 1px solid var(--rule); padding: 6px 8px 8px; min-height: 84px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.wk-col.later { background: var(--board); }
.wk-dh { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; }
.wk-dh .d { font-size: 13px; font-weight: 600; }
.wk-dh .n { font-size: 26px; line-height: 0.9; }
.wk-dh .n.zero { color: var(--ink-3); }
.wk-chips { display: flex; flex-wrap: wrap; gap: 3px; min-height: 20px; }
.wk-chips .cc { font-size: 11px; height: 18px; padding: 0 5px; }
.dbar { position: relative; height: 10px; margin-top: auto; border-top: 1px solid var(--rule); }
.dbar i { position: absolute; top: 3px; height: 6px; border-radius: 2px; background: var(--mark-time); }
.dbar i.dot { background: transparent; border: 1px dashed var(--mark-time); }
.dbar i.exam { background: var(--ink); }
.wk-foot { display: flex; flex-wrap: wrap; gap: 3px 20px; margin-top: 6px; font-size: 13px; color: var(--ink-2); }
.wk-foot .row { display: flex; gap: 8px; align-items: center; }
.wk-empty { color: var(--ink-3); font-size: 13px; }

/* ---------- Main page ---------- */
.mp { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
.top { display: flex; align-items: center; justify-content: space-between; padding: 0 24px; height: 48px; border-bottom: 1px solid var(--rule); gap: 16px; }
.top .l { display: flex; align-items: center; gap: 16px; }
.top img { height: 20px; display: block; }
.top .date { font-size: 14px; }
.top .health { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--ink-2); }
.top .health .needs { color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)) 1.25fr; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); max-width: 820px; }
.sd { padding: 8px 10px 8px; border-right: 1px solid var(--rule); display: flex; flex-direction: column; gap: 4px; background: none; border-top: 0; border-bottom: 0; border-left: 0; text-align: left; cursor: pointer; color: var(--ink); min-width: 0; }
.sd:first-child { border-left: 1px solid var(--rule); }
.sd:hover { background: var(--board-2); }
.sd .h { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.sd .v { font-size: 19px; line-height: 1; }
.sd .bar { height: 4px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.sd .bar b { display: block; height: 100%; background: var(--ink-2); }
.sd.today { background: var(--board); }
.sd.today .h { color: var(--ink); }
.sd .ex { font-size: 11.5px; font-weight: 700; color: var(--ink); line-height: 1.25; }
.sd.lt { cursor: default; }
.sd.lt:hover { background: none; }
.sd .tk { font-size: 12px; color: var(--ink-2); line-height: 1.3; }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) 392px; min-height: 0; }
.leftcol { overflow: auto; padding: 20px 24px 40px; border-right: 1px solid var(--rule); }
.rightcol { overflow: auto; padding: 20px 24px 40px; }

.live { background: var(--board); border: 1px solid var(--rule-2); border-radius: 10px; padding: 16px 20px 14px; box-shadow: var(--shadow); max-width: 820px; }
.live .t1 { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.live h2 { font-size: 26px; line-height: 1.15; font-weight: 700; letter-spacing: -0.005em; }
.live .meta { display: flex; gap: 10px; align-items: center; margin-top: 6px; color: var(--ink-2); font-size: 14px; flex-wrap: wrap; }
.live .figs { display: flex; gap: 32px; margin: 16px 0 10px; align-items: flex-end; flex-wrap: wrap; }
.live .figs .k { font-size: 12.5px; color: var(--ink-2); font-weight: 600; margin-bottom: 2px; }
.live .figs .v { font-size: 28px; line-height: 1; }
.live .why { font-size: 15px; max-width: 70ch; margin-bottom: 14px; }
.prog { height: 4px; border-radius: 2px; background: var(--rule); width: 120px; overflow: hidden; display: inline-block; vertical-align: middle; }
.prog b { display: block; height: 100%; background: var(--ink-2); }

.todayhead { display: flex; justify-content: space-between; align-items: baseline; margin: 26px 0 6px; gap: 12px; max-width: 820px; }
.verdict { font-size: 15px; max-width: 820px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
.meter { display: inline-flex; gap: 2px; }
.meter i { width: 8px; height: 12px; border-radius: 2px; background: var(--ink-2); display: block; }
.meter i.cap { background: transparent; border: 1px solid var(--rule-2); }
.meter i.spill { background: transparent; border: 1px solid var(--ink); }
.domband { padding: 8px 24px 8px; border-bottom: 1px solid var(--rule); }
.domains { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; margin: 0; }
.dom { display: grid; grid-template-columns: 20px 1fr; grid-template-rows: auto auto; column-gap: 6px; align-items: center; min-height: 40px; padding: 3px 8px 3px 6px; border-radius: 6px; text-align: left; min-width: 0; border: 1px solid var(--rule-2); background: none; cursor: pointer; font-size: 12.5px; color: var(--ink); }
.dom:hover { background: var(--board-2); }
.dom[aria-pressed="true"] { background: var(--board-2); border-color: var(--ink-2); }
.dom .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dom .pace { color: var(--ink-2); grid-column: 2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dom .ring { grid-row: 1 / 3; }
.ring { width: 20px; height: 20px; flex: none; }
.ring .bg { fill: none; stroke: var(--rule-2); stroke-width: 3; }
.ring .fg { fill: none; stroke-width: 3; stroke-linecap: butt; transform: rotate(-90deg); transform-origin: 50% 50%; }
.domsentence { font-size: 13px; color: var(--ink-2); margin: 6px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }

.rows { list-style: none; margin: 0; padding: 0; max-width: 820px; }
.row { display: grid; grid-template-columns: 96px 82px minmax(0,1fr) 88px auto; align-items: center; column-gap: 12px; min-height: 44px; border-top: 1px solid var(--rule); padding: 4px 4px; position: relative; }
[data-density="compact"] .row { min-height: 36px; padding: 2px 4px; }
.rows .row:last-child { border-bottom: 1px solid var(--rule); }
.row .ord { font-size: 13px; color: var(--ink-3); text-align: right; }
.row .due { line-height: 1; }
.row .due .fig { font-size: 20px; display: block; white-space: nowrap; }
.row .due .dw { font-size: 11.5px; color: var(--ink-2); }
.row .ttl { min-width: 0; display: flex; flex-direction: column; }
.row .ttl > button { all: unset; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.row .ttl > button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
.row .ttl .sub { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .left { font-size: 13.5px; color: var(--ink-2); text-align: right; }
.row .ra { display: flex; gap: 4px; opacity: 0; transition: opacity .12s; }
.row:hover .ra, .row:focus-within .ra, .row.open .ra { opacity: 1; }
.ib { width: 32px; height: 32px; display: inline-grid; place-items: center; border-radius: 6px; border: 1px solid transparent; background: none; cursor: pointer; color: var(--ink-2); }
.ib:hover { border-color: var(--rule-2); color: var(--ink); }
.row.done .ttl button { text-decoration: line-through; color: var(--ink-2); }
.grouplabel { font-size: 13px; color: var(--ink-2); font-weight: 600; margin: 24px 0 6px; max-width: 820px; display: flex; justify-content: space-between; }
.fold { max-width: 820px; border-top: 1px solid var(--rule); }
.fold:last-of-type { border-bottom: 1px solid var(--rule); }
.fold > button { width: 100%; background: none; border: 0; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 4px; cursor: pointer; font-size: 14.5px; min-height: 44px; }
.fold > button:hover { background: var(--board-2); }
.fold > button .c { color: var(--ink-2); font-size: 13.5px; }
.fold .inner { padding: 4px 4px 14px; }
.foldgap { height: 22px; }
.line { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 10px 0; border-top: 1px solid var(--rule); align-items: start; }
.line:first-child { border-top: 0; }
.line .a { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

.drawer { grid-column: 1 / -1; margin: 6px 0 12px 0; padding: 16px 18px; border: 1px solid var(--rule-2); border-radius: 8px; background: var(--board); }
.drawer .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 28px; }
.drawer h3 { font-size: 13px; color: var(--ink-2); font-weight: 600; margin-bottom: 6px; }
.kv { display: grid; grid-template-columns: 112px 1fr; gap: 4px 10px; font-size: 14px; }
.kv .k { color: var(--ink-2); }
.kv .e { border-bottom: 1px dashed var(--rule-2); cursor: text; }
.steps { list-style: none; padding: 0; margin: 0; font-size: 14px; }
.steps li { display: flex; gap: 10px; align-items: center; padding: 4px 0; }
.steps input { width: 18px; height: 18px; accent-color: var(--ink-2); }
.hist { list-style: none; margin: 0; padding: 0; font-size: 13px; color: var(--ink-2); }
.hist li { padding: 3px 0; }
.drawer .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule); gap: 12px; flex-wrap: wrap; }

.cls { list-style: none; margin: 0; padding: 0; }
.cls li { border-top: 1px solid var(--rule); }
.cls button { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 22px 1fr auto; column-gap: 10px; align-items: center; padding: 7px 4px; cursor: pointer; font-size: 14px; }
.cls button:hover { background: var(--board-2); }
.cls button:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; border-radius: 4px; }
.cls button[aria-pressed="true"] { background: var(--board-2); }
.cls .pace { color: var(--ink-2); font-size: 13px; white-space: nowrap; }
.cls .pace b { color: var(--ink); font-weight: 700; margin-right: 6px; }
.cls .say { grid-column: 2 / 4; font-size: 13px; color: var(--ink-2); margin-top: 2px; line-height: 1.4; }
.rh { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 8px; gap: 8px; }
.rsec + .rsec { margin-top: 28px; }
.sched { list-style: none; margin: 0; padding: 0; }
.sched li { display: grid; grid-template-columns: 62px 1fr; gap: 10px; padding: 6px 0; border-top: 1px solid var(--rule); font-size: 14px; }
.sched li .fig { font-size: 17px; }
.sched li .r { color: var(--ink-2); font-size: 12.5px; }
.daybar { position: relative; height: 14px; margin: 12px 0 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
.daybar i { position: absolute; top: 0; bottom: 0; background: var(--ink-2); }
.daybar i.opt { background: transparent; border: 1px dashed var(--ink-3); }
.daybar i.free { background: transparent; }
.dayticks { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-3); }
.card { border: 1px solid var(--rule-2); border-radius: 8px; padding: 14px 16px; }
.card .q { font-weight: 700; font-size: 15.5px; line-height: 1.35; }
.quote { margin: 8px 0 10px; padding: 8px 10px; border-left: 1px solid var(--rule-2); color: var(--ink-2); font-size: 13.5px; background: var(--board); border-radius: 0 4px 4px 0; }
.quote .qh { font-size: 11.5px; color: var(--ink-3); display: block; margin-bottom: 2px; }
.chg { list-style: none; margin: 0; padding: 0; }
.chg li { padding: 10px 0; border-top: 1px solid var(--rule); font-size: 14px; }
.chg li .src { display: block; font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
.chg li .actions { margin-top: 8px; }
.toast { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border: 1px solid var(--rule-2); border-radius: 6px; background: var(--board); font-size: 14px; max-width: 820px; margin: 0 0 14px; }

/* External windows (schematic: not Knowlu's pages) */
.over { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; z-index: 5; }
.win { width: 560px; background: var(--win); color: var(--win-ink); border-radius: 8px; box-shadow: 0 18px 50px oklch(0.1 0.02 258 / .45), 0 2px 6px oklch(0.1 0.02 258 / .3); overflow: hidden; font-family: system-ui, "Segoe UI", sans-serif; }
.win .bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: oklch(0.92 0.006 258); border-bottom: 1px solid var(--win-rule); font-size: 12.5px; color: var(--win-ink-2); }
.win .bar .h { flex: 1; font-family: "Atkinson Hyperlegible Mono", monospace; background: #fff; border: 1px solid var(--win-rule); border-radius: 4px; padding: 3px 8px; color: var(--win-ink); }
.win .pg { padding: 26px 32px 30px; }
.win .ttl { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
.win .ln { height: 36px; border: 1px solid var(--win-rule); border-radius: 4px; margin: 8px 0; background: #fff; display: flex; align-items: center; padding: 0 10px; color: var(--win-ink-2); font-size: 13px; }
.win .wb { display: inline-block; padding: 8px 16px; border-radius: 4px; background: oklch(0.42 0.06 258); color: #fff; font-size: 13.5px; margin-top: 8px; }
.win .wb.alt { background: none; color: oklch(0.42 0.06 258); border: 1px solid var(--win-rule); }
.win .note { font-size: 12.5px; color: var(--win-ink-2); margin-top: 14px; }
.win .tag { position: absolute; }
.winlabel { margin-top: 10px; color: var(--ink); font-size: 13px; text-align: center; background: var(--board); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--rule-2); }
.phone { display: flex; gap: 14px; align-items: center; margin-top: 12px; padding: 12px; border: 1px solid var(--win-rule); border-radius: 6px; background: #fff; }

/* Reveal */
.rv { height: 100vh; overflow: auto; }
.rv-in { max-width: 1200px; margin: 0 auto; padding: 28px 40px 36px; }
.rv-head h1 { font-family: "Big Shoulders Text", "Big Shoulders", sans-serif; font-size: 64px; line-height: 0.95; font-weight: 700; letter-spacing: -0.005em; }
.rv-top { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; margin: 18px 0 22px; align-items: stretch; }
.rv-top .live { max-width: none; padding: 20px 24px 18px; }
.rv-top .live h2 { font-size: 30px; }
.tonight { padding: 4px 0 0; }
.tonight .big { font-size: 19px; line-height: 1.3; margin-bottom: 10px; }
.tonight ul { list-style: none; margin: 0; padding: 0; }
.tonight li { padding: 7px 0; border-top: 1px solid var(--rule); font-size: 14px; }
.tonight li .dim { display: block; font-size: 13px; }
.rv-week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-left: 1px solid var(--rule); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.rv-day { border-right: 1px solid var(--rule); padding: 8px 10px 10px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.rv-day .dh { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 4px; }
.rv-day .dh .d { font-family: "Big Shoulders Text", sans-serif; font-weight: 700; font-size: 19px; }
.rv-day .dh .v { font-size: 12.5px; color: var(--ink-2); }
.dep { display: grid; gap: 2px; padding: 6px 0; border-top: 1px solid var(--rule); font-size: 13px; line-height: 1.3; }
.dep .tm { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
.dep .tm .fig { font-size: 16px; }
.dep .t { color: var(--ink); text-wrap: pretty; }
.rv-day .fixed { margin-top: auto; padding-top: 6px; border-top: 1px dashed var(--rule-2); }
.fx { font-size: 12px; color: var(--ink-2); padding: 1px 0; line-height: 1.3; }
.fx .tm { font-variant-numeric: tabular-nums; color: var(--ink-2); margin-right: 4px; }
.rv-note { font-size: 13px; color: var(--ink-2); margin-top: 8px; }
.rv-band { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 28px; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--rule-2); }
.rv-band h2 { font-family: "Big Shoulders Text", sans-serif; font-weight: 700; font-size: 19px; margin-bottom: 6px; }
.rv-band p { font-size: 14px; line-height: 1.45; }
.rv-band p + p { margin-top: 6px; }
.rvsec { padding: 10px 0 12px; border-top: 1px solid var(--rule); }
.rvsec h2 { font-size: 13px; color: var(--ink-2); font-weight: 600; margin-bottom: 6px; }

/* Tray */
.desk { height: 100vh; background: linear-gradient(160deg, oklch(0.42 0.04 240), oklch(0.30 0.04 250)); position: relative; }
.taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: oklch(0.2 0.02 258 / 0.92); display: flex; justify-content: flex-end; align-items: center; padding: 0 16px; gap: 14px; color: #eee; font-size: 12px; font-family: system-ui, sans-serif; }
.tray { position: absolute; right: 12px; bottom: 60px; width: 360px; background: var(--board); border: 1px solid var(--rule-2); border-radius: 10px; padding: 14px 16px; box-shadow: 0 18px 40px oklch(0.1 0.02 258 / .4); }

/* Prototype bar */
.proto { position: fixed; right: 12px; bottom: 12px; z-index: 20; font-size: 12.5px; }
.proto > button { background: var(--board); border: 1px solid var(--rule-2); color: var(--ink-2); border-radius: 6px; padding: 4px 10px; cursor: pointer; min-height: 28px; }
.proto .panel { position: absolute; right: 0; bottom: 36px; width: 360px; max-height: 70vh; overflow: auto; background: var(--board); border: 1px solid var(--rule-2); border-radius: 8px; padding: 12px; box-shadow: 0 10px 30px oklch(0.1 0.02 258 / .35); }
.proto .panel h4 { margin: 10px 0 4px; font-size: 12px; color: var(--ink-2); }
.proto .panel a { display: block; padding: 3px 4px; text-decoration: none; border-radius: 4px; }
.proto .panel a:hover, .proto .panel a[aria-current] { background: var(--board-2); }
.proto .tg { display: flex; flex-wrap: wrap; gap: 6px; }
.noproto .proto { display: none; }

.kbd { font-family: "Atkinson Hyperlegible Mono", monospace; font-size: 12px; border: 1px solid var(--rule-2); border-radius: 4px; padding: 0 4px; }
.focus-pane { max-width: 640px; margin: 60px auto; text-align: left; }
.vstack > * + * { margin-top: 12px; }
.hr { border-top: 1px solid var(--rule); margin: 18px 0; }
.wyrows { list-style: none; padding: 0; margin: 0 0 12px; max-width: 760px; }
.wyrows li { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; padding: 7px 0; border-top: 1px solid var(--rule); font-size: 14px; }
.wyrows li .s { font-size: 12.5px; color: var(--ink-2); }
.wyrows li.set .lead { color: var(--ink); }
.wygroup { display: flex; justify-content: space-between; align-items: baseline; margin: 14px 0 2px; max-width: 760px; }
.wygroup h2 { font-size: 15px; font-weight: 700; }
.seg { display: inline-flex; border: 1px solid var(--rule-2); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 0 10px; min-height: 32px; cursor: pointer; font-size: 13px; border-right: 1px solid var(--rule-2); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--board-2); font-weight: 700; }
.seg button:hover { background: var(--board-2); }
.picker { max-width: 520px; margin: 80px auto; }
.pick { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border: 1px solid var(--rule-2); border-radius: 8px; margin: 10px 0; background: var(--board); }
.settings { max-width: 760px; }
.settings li { grid-template-columns: 1fr auto; }

/* ---------- Round 2: the daily page is the board ---------- */
/* The headline answers "what's next?" in the board's own face; the board below is the order, with the
   next departure enlarged as its first row; the week is the same one-row-per-day board the student
   watched fill during setup, now read against each day's open time. */
.nx { max-width: 840px; margin: 2px 0 16px; }
.nx-h { font-family: "Big Shoulders Text", "Big Shoulders", sans-serif; font-weight: 800; font-size: 52px; line-height: 0.95; letter-spacing: 0; text-wrap: balance; }
.nx-s { font-size: 17px; line-height: 1.4; margin-top: 8px; max-width: 64ch; color: var(--ink); text-wrap: pretty; }
.nx-s .ok { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.db { max-width: 840px; border: 1px solid var(--rule-2); border-radius: 8px; background: var(--board); box-shadow: var(--shadow); overflow: hidden; }
.db + .db, .db + .wkb { margin-top: 18px; }
.db-h { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 10px 14px 8px; }
.db-h .lab { font-size: 21px; }
.db-cols, .db .row { grid-template-columns: 92px 76px minmax(0, 1fr) 62px 132px; }
.db-cols { display: grid; column-gap: 12px; padding: 4px 14px; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); border-top: 1px solid var(--rule); background: var(--board-2); }
.db-cols span:nth-child(4) { text-align: right; }
.db .rows { max-width: none; }
.db .row { padding: 6px 14px; min-height: 48px; }
.db .rows .row:last-child { border-bottom: 0; }
.row .stat { display: flex; justify-content: flex-start; min-width: 0; }
.row .stat .word { font-size: 12.5px; }
.row .stat .word.plain { font-weight: 500; color: var(--ink-2); }
.row .ra { position: absolute; right: 8px; top: 8px; background: var(--board); padding-left: 8px; box-shadow: -12px 0 12px var(--board); }
.rows:not(.db .rows) .row .ra { background: var(--ground); box-shadow: -12px 0 12px var(--ground); }
.db .row.lead { padding: 14px 14px 16px; align-items: start; background: var(--amber-fill); border-top: 1px solid var(--rule); }
.row.lead .due .fig { font-size: 28px; }
.row.lead .due .dw { font-size: 12.5px; color: var(--ink); font-weight: 600; margin-top: 4px; display: block; }
.row.lead .ttl h2 { font-size: 24px; line-height: 1.15; font-weight: 700; }
.row.lead .ttl .why { font-size: 14.5px; margin-top: 6px; max-width: 58ch; text-wrap: pretty; }
.row.lead .ttl .actions { margin-top: 12px; }
.row.lead .left { font-size: 15px; color: var(--ink); padding-top: 6px; }
.row.lead .left .fig { font-size: 22px; display: block; }
.row.lead .stat { padding-top: 6px; flex-direction: column; gap: 6px; align-items: flex-start; }
.row.lead .stat .k { font-size: 12px; color: var(--ink-2); }
.row.lead .stat .fig { font-size: 19px; line-height: 1; }
.row.lead .ra, .row.open .ra { display: none; }
.db-sep { display: flex; justify-content: space-between; gap: 12px; padding: 7px 14px 5px; border-top: 1px solid var(--rule-2); font-size: 12.5px; font-weight: 700; color: var(--ink-2); background: var(--board-2); }
.db-sep .meter i { width: 7px; height: 10px; }
.wkb { max-width: 840px; margin-top: 18px; border: 1px solid var(--rule-2); border-radius: 8px; background: var(--board); box-shadow: var(--shadow); }
.wkb ol { list-style: none; margin: 0; padding: 0; }
.wkr { display: grid; grid-template-columns: 74px 30px 48px minmax(120px, 1fr) 300px; column-gap: 12px; align-items: center; min-height: 36px; padding: 2px 14px; border-top: 1px solid var(--rule); font-size: 13.5px; }
.wkr .d { font-family: "Big Shoulders Text", sans-serif; font-weight: 700; font-size: 18px; }
.wkr .n { font-size: 20px; text-align: right; line-height: 1; }
.wkr .h { text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.wkr .fit { position: relative; height: 12px; border-radius: 3px; background: transparent; box-shadow: inset 0 0 0 1px var(--rule-2); overflow: hidden; }
.wkr .fit b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink-2); border-radius: 3px 0 0 3px; }
.wkr.tight .fit b { background: var(--amber); }
.wkr .note { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wkr .note b { color: var(--ink); font-weight: 600; }
.wkr.today { background: var(--board-2); }
.wkr.later .d { font-size: 15px; }
.wkr.past { color: var(--ink-3); }
.wkr.past .d { color: var(--ink-2); }
.wkb-foot { padding: 8px 14px 10px; border-top: 1px solid var(--rule); font-size: 13px; color: var(--ink-2); }
.daybar .now { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }
.daybar .stretch { position: absolute; top: 0; bottom: 0; background: transparent; box-shadow: inset 0 0 0 2px var(--amber); border-radius: 3px; }
.top .health .alert { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); padding: 3px 4px 3px 10px; border-radius: 999px; background: var(--needs-fill); }
.top .health .alert .shape { color: var(--needs); }
.top .health .alert .btn { min-height: 26px; padding: 0 10px; font-size: 12.5px; border-radius: 999px; }
.closedq { font-size: 12.5px; color: var(--ink-2); margin-top: 10px; }
/* O9 rebuilt: questions first, then groups checked at a glance */
.qs { list-style: none; margin: 0 0 6px; padding: 0; max-width: 820px; }
.qs > li { padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.qs .q { font-weight: 700; font-size: 15.5px; }
.qs .q + .small { margin-top: 2px; }
.qs .ans { display: flex; flex-wrap: wrap; gap: 8px 10px; margin-top: 10px; align-items: center; }
.qs .ev { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 6px 0; border-top: 1px dashed var(--rule); font-size: 14px; }
.qs .ev:first-of-type { border-top: 0; }
.grp { max-width: 820px; border-top: 1px solid var(--rule-2); padding: 12px 0 6px; }
.grp-h { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.grp-h h3 { font-size: 15.5px; font-weight: 700; }
.grp ul { list-style: none; margin: 6px 0 0; padding: 0; }
.grp li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 4px 0; font-size: 14px; border-top: 1px dashed var(--rule); }
.grp li:first-child { border-top: 0; }
.grp li .link { font-size: 13px; }
h2.qhead { font-family: "Big Shoulders Text", sans-serif; font-weight: 700; font-size: 22px; margin: 6px 0 2px; }
/* Light: the day board. Thin condensed strokes lose weight on paper; give figures a step more. */
:root[data-theme="light"] .fig, :root[data-theme="light"] .lab { font-weight: 700; }
:root[data-theme="light"] .nx-h { font-weight: 800; color: oklch(0.2 0.03 258); }
:root[data-theme="light"] .db .row.lead { background: oklch(0.955 0.045 80); }
:root[data-theme="light"] .db-cols, :root[data-theme="light"] .db-sep { background: oklch(0.95 0.01 85); }

/* ---------- Round 3 ---------- */
.rail-row .pf .fnd { color: var(--ink); font-weight: 600; }
.proof .txt { text-wrap: balance; }
/* The proof's ruled rows: what was left out, and why (graft from 1b's S-proof). */
.leftout-h { font-size: 13px; font-weight: 700; color: var(--ink-2); margin: 10px 0 3px; }
.leftout { list-style: none; margin: 0; padding: 0; max-width: 72ch; border-top: 1px solid var(--rule-2); }
.leftout li { display: grid; grid-template-columns: 34px 170px minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 3px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
.leftout .n { font-size: 20px; line-height: 1; text-align: right; }
.leftout .w { color: var(--ink-2); font-size: 13.5px; }
/* W1: Building your week, a countable list. */
.bw { max-width: 760px; }
.bw-h { display: flex; align-items: center; gap: 16px; padding-bottom: 10px; }
.bw-n { font-size: 30px; line-height: 1; white-space: nowrap; }
.bw-seg { display: flex; gap: 3px; flex: 1; max-width: 270px; }
.bw-seg i { flex: 1; height: 8px; border-radius: 2px; box-shadow: inset 0 0 0 1px var(--rule-2); }
.bw-seg i.on { background: var(--ink-2); box-shadow: none; }
.bw-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule-2); }
.bw-list li { display: grid; grid-template-columns: 24px 200px minmax(0, 1fr) 70px; gap: 10px; align-items: center; min-height: 34px; border-bottom: 1px solid var(--rule); font-size: 14px; }
.bw-list .mk { display: grid; place-items: center; }
.bw-list .mk .check { width: 18px; height: 18px; }
.bw-list .a { font-weight: 600; }
.bw-list .b { color: var(--ink-2); font-size: 13.5px; }
.bw-list .s { font-size: 12.5px; font-weight: 600; color: var(--ink-2); text-align: right; }
.bw-list li.run { background: var(--board); }
.bw-list li.run .s { color: var(--ink); }
[data-motion="full"] .bw-list li.ok .check path { animation-delay: calc(var(--i) * 90ms); }
[data-motion="full"] .bw-list li.run .mk .shape { animation: bwrun 1.6s ease-in-out infinite; }
@keyframes bwrun { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .bw-list li.run .mk .shape { animation: none; } }
.bw-note { font-size: 13.5px; color: var(--ink-2); margin-top: 10px; max-width: 66ch; }
.bw-cap { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; padding: 10px 12px; border-radius: 6px; background: var(--needs-fill); font-size: 14px; max-width: 72ch; }
/* R1: the reveal is the setup board, now named. */
.rvb { border: 1px solid var(--rule-2); border-radius: 8px; padding: 14px 18px 12px; box-shadow: var(--shadow); }
.rvb .bd-row.rvb-row { grid-template-columns: 74px 30px minmax(0, 1fr) 230px; align-items: start; padding: 6px 0; }
.rvb .bd-row .d, .rvb .bd-row .n { padding-top: 3px; }
.rvb .bd-row .it { overflow: visible; display: block; }
.rvb .bd-row .fix { flex-direction: column; align-items: flex-end; gap: 1px; white-space: normal; text-align: right; padding-top: 4px; }
.rvis { list-style: none; margin: 0; padding: 0; }
.rvi { display: grid; grid-template-columns: 72px 52px minmax(0, 1fr) 96px; gap: 10px; align-items: center; min-height: 28px; }
.rvi + .rvi { border-top: 1px dashed var(--rule); }
.rvi .tm { font-size: 17px; white-space: nowrap; }
.rvi .cc { justify-self: start; }
.rvi .t { font-size: 14.5px; font-weight: 500; text-wrap: pretty; }
.rvi .h { font-size: 13px; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
.rvi.next .t { font-weight: 700; }
.nexttag { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 4px; font-size: 11.5px; font-weight: 700; background: var(--amber-fill); color: var(--ink); box-shadow: inset 0 0 0 1px var(--amber); vertical-align: 1px; }
.rv-top + .rvb { margin-top: 0; }
/* M1: Due · Course · Assignment · Work left · Status · Done, with the action visible on every row. */
.row { grid-template-columns: 96px 82px minmax(0,1fr) 88px auto 34px; }
.db-cols, .db .row { grid-template-columns: 92px 76px minmax(0, 1fr) 74px 120px 34px; }
.row .ra, .rows:not(.db .rows) .row .ra { position: static; opacity: 1; background: none; box-shadow: none; padding: 0; display: flex; justify-content: flex-end; }
.ib.done-b { border-color: var(--rule-2); color: var(--ink-3); }
.ib.done-b:hover { color: var(--ink); border-color: var(--ink-2); }
.ib.done-b[aria-pressed="true"] { color: var(--ink); background: var(--board-2); }
.row.lead .ra { display: block; }
.row.late .due .fig, .row.lead .due .late-f { color: var(--amber); }
.row.lead .due .dw { font-weight: 500; line-height: 1.3; }
.row.lead .ttl .actions { flex-wrap: wrap; }
.lockhint { margin-top: 6px; }
.wkr { grid-template-columns: 74px 30px 60px minmax(110px, 1fr) 290px; }
/* The day bar labels itself: Now over the line, the free stretch named over its outline. */
.daylabels { position: relative; height: 16px; margin-top: 12px; font-size: 11.5px; font-weight: 600; color: var(--ink-2); }
.daylabels .now-l { position: absolute; transform: translateX(-2px); }
.daylabels .stretch-l { position: absolute; text-align: center; color: var(--amber); white-space: nowrap; }
.daylabels + .daybar { margin-top: 2px; }
:root[data-theme="light"] .row.late .due .fig, :root[data-theme="light"] .row.lead .due .late-f, :root[data-theme="light"] .daylabels .stretch-l { color: var(--amber); }
</style>

/* Rows ahead say what each step brings (the benefit), never what it will find. Findings appear only
   after the school read has produced them (o.found), so no proof shows before the login that earns it. */
const AHEAD = { school: 'Classes, assignments, grades and syllabi', payment: '$9.99 a month, after 7 days free', email: 'Date changes your teachers send', google: 'Club and job deadlines, your calendar', hw: 'Due dates from homework sites', syl: 'Exam dates, grade weights and late rules', week: 'Check class times, exams and late rules', reveal: 'Opens when everything has run once' };
/* Round 3 (graft from 4): a row the school read discovered says so, and why its login is asked for. */
const FOUND = { email: 'Same sign-in as your school', hw: ['Found at your school', "CS 110's Blackboard page links zyBooks; SPAN 202's syllabus names VHL"], syl: ['Found at your school', "4 of 5 in Blackboard; CS 110's isn't, so Knowlu asks"] };
const SUBWHY = { hw: ["Found at your school: linked from CS 110's Blackboard page", "Found at your school: named in SPAN 202's syllabus"] };
const pfHtml = pf => Array.isArray(pf) ? `<span class="pf"><span class="fnd">${esc(pf[0])}.</span> ${esc(pf[1])}</span>` : pf ? `<span class="pf">${esc(pf)}</span>` : '';
const SUB = {
  school: [['Classes', '5 this term (2 from last term left out)'], ['Assignments', '26: 6 this week, 16 later, 4 already turned in'], ['Class times', '5 classes, 14 meetings a week (registrar)'], ['Grades', '5 courses'], ['Syllabi', 'Found for 4 of 5']],
  google: [['Gmail', '40 read, 1 thing to do'], ['Calendar', '6 events this week']],
  hw: [['zyBooks', '8 assignments, 3 already turned in'], ['VHL', '6 assignments, 2 already turned in']],
};
/* o: { at: step key, subs: {school:[states]}, override: {stepKey: {st, pf, cls}}, showSubs: [keys] } */
function rail(o) {
  const idx = STEPS.findIndex(s => s.k === o.at);
  const found = o.found || idx > 1;
  let left = 0; STEPS.forEach((s, i) => { if (i >= idx) left += s.s; });
  const mins = Math.max(1, Math.round(left / 60));
  const rows = STEPS.map((s, i) => {
    const ov = (o.override || {})[s.k] || {};
    let st, pf, cls, shape;
    if (i < idx) { st = 'Done'; pf = PROOF[s.k]; cls = 'done'; shape = 'done'; }
    else if (i === idx) { st = 'Now'; pf = ''; cls = 'now'; shape = 'now'; }
    else { st = ''; pf = (found && FOUND[s.k]) || AHEAD[s.k] || ''; cls = 'ahead'; shape = 'ahead'; }
    if (ov.st !== undefined) st = ov.st; if (ov.pf !== undefined) pf = ov.pf; if (ov.shape) shape = ov.shape; if (ov.cls) cls += ' ' + ov.cls;
    let h = `<li class="rail-row ${cls}"${i === idx ? ' aria-current="step"' : ''}>${SH[shape]}<span class="nm">${esc(s.nm)}</span><span class="st">${esc(st)}</span>${pfHtml(pf)}</li>`;
    const subs = (o.subs || {})[s.k];
    /* Sub-rows show only while something under the step is still running or needs the student;
       once every source is Done the row collapses to its one proof line (the pane holds the detail). */
    if (subs && subs.some(v => v !== 'Done')) h += SUB[s.k].map((sb, j) => {
      const sv = subs[j]; if (!sv) return '';
      const [sst, spf] = Array.isArray(sv) ? sv : [sv, null];
      const shp = { Done: 'done', Reading: 'reading', 'Still reading': 'reading', 'Needs you': 'needs', 'Not connected': 'skipped', Waiting: 'ahead' }[sst] || 'ahead';
      const pfx = spf !== null ? spf : (sst === 'Done' ? sb[1] : sst === 'Waiting' && SUBWHY[s.k] ? SUBWHY[s.k][j] : '');
      return `<li class="rail-row sub ${sst === 'Needs you' ? 'needs' : ''}">${SH[shp]}<span class="nm">${esc(sb[0])}</span><span class="st">${esc(sst)}</span>${pfx ? `<span class="pf">${esc(pfx)}</span>` : ''}</li>`;
    }).join('');
    return h;
  }).join('');
  return `<aside class="rail" aria-label="Setup progress">
    <div class="rail-head">${wm()}<span class="small dim">Setup</span></div>
    <div class="rail-title"><span class="lab">Your sources</span><span class="small dim">${idx >= 0 ? `Step ${idx + 1} of ${STEPS.length}` : 'Before you start'}</span></div>
    <ol class="rail-list">${rows}</ol>
    <div class="rail-foot"><span class="small dim">About ${mins} minute${mins > 1 ? 's' : ''} left</span>${o.noLater ? '' : lk('x1-finish-later', 'Finish later')}</div>
  </aside>`;
}

/* ---------- onboarding: the week strip (Oct 19-25), counts only until the reveal ---------- */
const WEEK = D.reveal.week;
const SRC = t => /^VHL/.test(t) ? 'vhl' : /^Lab 6/.test(t) ? 'zy' : 'bb';
const hm = s => { const [h, m] = s.split(':').map(Number); return h + m / 60; };
const REPEAT = /circulation|Pre-Health|soccer|office hours/;
/* The board: one row per day, filled by each login. Before the reveal it carries course, due time and
   counts, never titles, hours or order (R2.1): the reveal is where the week is first named.
   f: { school: false|'reading'|true, google, hw, vhlSkipped, syl, totalsOnly, fresh: 'school'|'google'|'hw'|'vhl'|'syl' } */
const short2 = c => ({ 'BIO 201': 'BIO', 'CHEM 231': 'CHEM', 'CS 110': 'CS', 'SPAN 202': 'SPAN', 'ENG 210': 'ENG' }[c] || c);
function strip(f, extra = '') {
  const later = (f.school === true ? 16 : 0) + (f.google ? 1 : 0) + (f.hw ? (f.vhlSkipped ? 4 : 6) : 0);
  const turned = (f.school === true ? 4 : 0) + (f.hw ? (f.vhlSkipped ? 3 : 5) : 0);
  const fresh = f.fresh || '';
  const isNew = src => (fresh === 'school' && src === 'bb') || (fresh === 'hw' && src === 'zy') || (fresh === 'vhl' && src === 'vhl') || (fresh === 'hwall' && (src === 'zy' || src === 'vhl'));
  const empty = !f.school, reading = f.school === 'reading';
  let total = 0, added = 0;
  const rows = WEEK.map(d => {
    const dt = new Date(d.date + 'T12:00');
    const items = d.due.filter(x => {
      const s = SRC(x.title);
      if (s === 'bb') return f.school === true;
      if (s === 'zy') return !!f.hw;
      if (s === 'vhl') return !!f.hw && !f.vhlSkipped;
    }).sort((a, b) => toH(a.due_time) - toH(b.due_time));
    total += items.length;
    const its = empty || reading ? `<span class="ghost ${reading ? 'reading' : ''}" aria-hidden="true"></span>`
      : f.totalsOnly ? '' : items.map(x => { const n = isNew(SRC(x.title)); if (n) added++; return `<span class="dep2 ${n ? 'new' : ''}">${cc(x.course, short2(x.course))}<span class="fig">${esc(x.due_time)}</span></span>`; }).join('');
    const cls = f.school === true ? d.blocks.filter(b => b.kind === 'class' || b.kind === 'lab').length : 0;
    const oh = f.school === true ? d.blocks.filter(b => b.kind === 'office hours').length : 0;
    const ev = f.google ? d.blocks.filter(b => !/class|lab|office hours/.test(b.kind)).length : 0;
    const fix = [cls ? `${cls} class${cls > 1 ? 'es' : ''}` : '', oh ? `office hours` : '', ev ? `<span class="${fresh === 'google' ? 'new' : ''}">${ev} event${ev > 1 ? 's' : ''}</span>` : ''].filter(Boolean).join(' · ');
    const n = empty || reading || f.totalsOnly ? '' : items.length;
    return `<li class="bd-row"><span class="d">${d.weekday.slice(0, 3)} ${dt.getDate()}</span><span class="n fig ${n === 0 ? 'zero' : ''}">${n}</span><span class="it">${its}</span><span class="fix">${fix}</span></li>`;
  }).join('');
  const laterNew = (fresh === 'google' ? 1 : 0);
  const laterTxt = empty || reading ? '' : f.totalsOnly ? `${f.school === true ? 22 : ''} not yet sorted by day` : later ? `due after Sunday${f.syl ? '' : ''}` : '';
  const laterRow = `<li class="bd-row later"><span class="d">Later</span><span class="n fig ${later ? '' : 'zero'}">${empty || reading || f.totalsOnly ? '' : later}</span><span class="it"><span>${laterTxt}</span>${laterNew ? `<span class="dep2 new">${cc('', 'Pre-Health')}<span class="fig">Oct 30</span></span>` : ''}${f.syl ? `<span class="dep2 ${fresh === 'syl' ? 'new' : ''}">${cc('CHEM 231', 'CHEM')}<span>exam</span><span class="fig">Thu Oct 29</span></span>` : ''}</span><span class="fix">${f.syl ? '10 exams, from syllabi' : ''}</span></li>`;
  const DELTA = {
    school: `+${added} due this week and 16 later, from Halverson State`,
    google: '+1 deadline from Gmail, and your own events from Calendar',
    hw: `+${added} due this week, from zyBooks`,
    vhl: `+${added} due this week, from VHL`,
    syl: 'Exam dates from your syllabi',
  };
  const right = fresh && DELTA[fresh] ? `<span class="bd-delta"><span class="sw" aria-hidden="true"></span>${DELTA[fresh]}</span>`
    : `<span class="small dim">${empty ? 'Fills in as you connect each account.' : reading ? 'Counting your assignments…' : f.totalsOnly ? 'Counts so far' : `${total} due this week so far`}</span>`;
  const foot = [];
  if (empty) foot.push(`<span class="fr">Your school brings assignments and class times. Google brings your own events and personal deadlines. Homework sites bring their due dates.</span>`);
  if (f.totalsOnly) foot.push(`<span class="fr">${SH.reading} Due dates for each day come in after payment, when Knowlu reads the assignments into your plan.</span>`);
  if (turned) foot.push(`<span class="fr">${SH.done} ${turned} already turned in. They won't be on your list.</span>`);
  if (extra) foot.push(extra);
  if (!(f.fresh || reading || f.full || f.totalsOnly)) {
    const cells = WEEK.map(d => {
      const k = d.due.filter(x => { const s2 = SRC(x.title); return s2 === 'bb' ? f.school === true : s2 === 'zy' ? !!f.hw : !!f.hw && !f.vhlSkipped; }).length;
      return `<span class="mc"><span class="d">${d.weekday.slice(0, 3)}</span><span class="fig ${k ? '' : 'zero'}">${empty || f.totalsOnly ? '·' : k}</span></span>`;
    }).join('') + `<span class="mc later"><span class="d">Later</span><span class="fig">${empty || f.totalsOnly ? '·' : later}</span></span>`;
    return `<section class="bd mini" aria-label="Your week so far"><div class="bd-head"><span class="lab">Your week, Oct 19 to 25</span><span class="mcs">${cells}</span><span class="small dim">${empty ? 'Fills in as you connect.' : `${turned} turned in, kept off your list`}</span></div>${extra ? `<div class="bd-foot">${extra}</div>` : ''}</section>`;
  }
  return `<section class="bd" aria-label="Your week so far">
    <div class="bd-head"><span class="lab">Your week, October 19 to 25</span>${right}</div>
    <ol class="bd-rows">${rows}${laterRow}</ol>
    ${foot.length ? `<div class="bd-foot">${foot.join('')}</div>` : ''}
  </section>`;
}

/* ---------- onboarding shell ---------- */
function ob(o) {
  return `<div class="ob">${rail(o.rail)}<main class="obmain" id="main">
    <section class="step" aria-labelledby="h1">
      ${o.notice || ''}
      <div class="step-top"><h1 id="h1" tabindex="-1">${o.title}</h1></div>
      ${o.why ? `<p class="why">${o.why}</p>` : ''}
      <div class="body">${o.body}</div>
    </section>
    ${o.strip === null || !(o.strip || {}).school || (o.strip || {}).school === 'reading' ? '' : strip(o.strip || {}, o.stripExtra)}
  </main></div>${o.overlay || ''}`;
}

const t12 = s => { let [h, m] = s.split(':').map(Number); const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return `${h}:${String(m).padStart(2, '0')} ${ap}`; };
const range12 = (a, b) => { const A = t12(a), B = t12(b); return A.slice(-2) === B.slice(-2) ? `${A.slice(0, -3)}-${B}` : `${A}-${B}`; };
const fmtRow = s => s
  .replace(/(\d{4})-(\d{2})-(\d{2}) (\d{2}:\d{2})/g, (_, y, mo, d, t) => new Date(`${y}-${mo}-${d}T12:00`).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) + ', ' + t12(t))
  .replace(/(\d{2}:\d{2})-(\d{2}:\d{2})/g, (_, a, b) => range12(a, b))
  .replace(/^Awake (\d{2}:\d{2}) to (\d{2}:\d{2})/, (_, a, b) => `Awake ${t12(a)} to ${t12(b)}`);

function revealWeek(skipVHL) {

const T = D.today;
const DEC = Object.fromEntries(D.decisions.map(d => [d.id, d]));
const EM = Object.fromEntries(D.emails.map(e => [e.id, e]));
const GR = Object.fromEntries(D.grades.map(g => [g.course, g]));
const NEEDS_TARGET = Object.fromEntries(D.decisions.filter(d => d.target).map(d => [d.target, d]));
const dueParts = (iso, dueText) => {
  const d = new Date(iso); const h = d.getHours(), m = d.getMinutes();
  const t = t12(`${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`);
  const w = dueText.replace(/ at .*/, '').replace(/^last /, 'last ');
  return [t, w];
};

/* Round 2: open time is computed from the day, never a literal. Wake-to-bed window from planning_day;
   hard and soft commitments are busy, optional ones are not (the read model's method). */
const H12 = h => { let hh = Math.floor(h + 1e-6), mm = Math.round((h - hh) * 60); if (mm === 60) { hh++; mm = 0; } return t12(`${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`); };
const WAKE = hm(D.planning_day.wake), BED = hm(D.planning_day.bed);
function openTime(blocks, from) {
  const start = Math.max(WAKE, from == null ? WAKE : from);
  const busy = blocks.filter(x => x.level !== 'optional').map(x => [hm(x.start), hm(x.end)]).sort((a, c) => a[0] - c[0]);
  const iv = []; let t = start;
  for (const [s, e] of busy) { if (e <= t) continue; if (s > t) iv.push([t, Math.min(s, BED)]); t = Math.max(t, e); }
  if (t < BED) iv.push([t, BED]);
  const hours = iv.reduce((s, [a, c]) => s + c - a, 0);
  const longest = iv.reduce((m, x) => (!m || x[1] - x[0] > m[1] - m[0] ? x : m), null);
  return { iv, hours, longest, from: start };
}
function freeLabel(blocks, now) {
  const o = openTime(blocks, now), L = o.longest;
  if (!L) return { text: 'No open time left today', o };
  return { text: L[0] <= o.from + 1e-6 ? `Free now to ${H12(L[1])}` : `Free from ${H12(L[0])}`, o };
}
/* Round 3: one time format on every surface, "1h 12m" / "24m", never decimal hours ("4.7h"). */
const hfmt = h => { const t = Math.round((h || 0) * 60); if (!t) return '0m'; const H = Math.floor(t / 60), M = t % 60; return H ? (M ? `${H}h ${M}m` : `${H}h`) : `${M}m`; };
const minsOf = s => { const m = String(s).match(/(?:(\d+)h)?\s*(?:(\d+)m)?/); return (+(m[1] || 0)) * 60 + (+(m[2] || 0)); };
const MUST_H = () => T.list.slice(0, 5).reduce((s, t) => s + minsOf(t.estimate_text), 0) / 60;
const NOW_H = hm(T.as_of.slice(11, 16));

/* Needs-you cards are date-checked: a question whose date has passed closes on its own and never offers
   "Keep Friday" on a Sunday. The ends below are the dates each card is about (from the card's own data). */

const decEnds = d => (d.change ? d.change.due[0] : DEC_ENDS[d.id]) || '9999';

  if (o.allClear) health = `<span>Checked ${esc(o.checked || '6:02 am')} · every source answered</span>`;

    <div class="health">${vhl}${health}<button class="link" type="button" data-go="m10-settings">Settings</button></div></header>`;

/* The week, as the same one-row-per-day board the student watched fill during setup. Each row reads the
   work due that day against that day's open time (wake to bed, minus hard and soft commitments). */
function weekBoard(todayIdx = 0, o = {}) {
  const all = T.ahead_14_days;
  const days = all.slice(todayIdx, todayIdx + 7), rest = all.slice(todayIdx + 7);
  const info = days.map((d, k) => {
    const i = todayIdx + k; const blocks = D.week.days[i % 7].blocks;
    const op = openTime(blocks, k === 0 ? (o.nowH ?? NOW_H) : null).hours;
    return { d, op, r: op ? d.hours_due / op : 0 };
  });
  const tight = info.reduce((m, x, k) => (x.r > info[m].r ? k : m), 0);
  const rows = info.map(({ d, op, r }, k) => {
    const dt = new Date(d.date + 'T12:00');
    const label = k === 0 ? 'Today' : `${d.weekday} ${dt.getDate()}`;
    const ex = d.exams.length ? `<b>${esc(d.exams[0])}</b> · ` : '';
    const note = d.hours_due ? `${ex}${hfmt(d.hours_due)} due in ${hfmt(op)} open` : `${ex}Nothing due · ${hfmt(op)} open`;
    return `<li class="wkr ${k === 0 ? 'today' : ''} ${k === tight && d.hours_due ? 'tight' : ''}" ${k === 0 ? 'aria-current="date"' : ''}>
      <span class="d">${label}</span><span class="n fig">${d.tasks}</span><span class="h">${hfmt(d.hours_due)}</span>
      <span class="fit" role="img" aria-label="${hfmt(d.hours_due)} due in ${Math.round(op)} hours of open time"><b style="width:${Math.min(100, r * 100).toFixed(0)}%"></b></span>
      <span class="note">${note}</span></li>`;
  }).join('');
  const nh = rest.reduce((s, d) => s + d.hours_due, 0), nt = rest.reduce((s, d) => s + d.tasks, 0), nex = rest.reduce((s, d) => s + d.exams.length, 0);
  const restRow = rest.length > 2 ? (() => {
    const a = new Date(rest[0].date + 'T12:00'), b = new Date(rest[rest.length - 1].date + 'T12:00');
    const lbl = `${a.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} to ${a.getMonth() === b.getMonth() ? b.getDate() : b.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`;
    return `<li class="wkr later"><span class="d">${lbl}</span><span class="n fig">${nt}</span><span class="h">${hfmt(nh)}</span><span></span><span class="note">${nex ? `<b>${nex} exam${nex > 1 ? 's' : ''}</b> · ` : ''}the week after</span></li>`;
  })() : '';
  const t = info[tight];
  const foot = t.d.hours_due ? `Tightest: <b style="color:var(--ink)">${k2day(t.d, tight === 0)}</b>, about ${hfmt(t.d.hours_due)} due in ${hfmt(t.op)} of open time. The bar is the work due that day against that day's open time.` : 'Nothing is tight this week.';
  return `<section class="wkb" aria-labelledby="wkb-h"><div class="db-h"><span class="lab" id="wkb-h">${o.title || 'This week'}</span><span class="small dim">due · hours · against open time</span></div>
    <ol>${rows}${restRow}</ol><div class="wkb-foot">${foot}</div></section>`;
}
const k2day = (d, isToday) => isToday ? 'today' : new Date(d.date + 'T12:00').toLocaleDateString('en-US', { weekday: 'long' });

/* Round 3: every row shows its one action, Done, at rest (Pin and Open live in the task detail). */
const ACTIONS = (id, done) => `<span class="ra"><button class="ib done-b" type="button" title="${done ? 'Uncheck (x)' : 'Done (x)'}" aria-label="${done ? 'Uncheck' : 'Mark done'}" aria-pressed="${!!done}" data-done="${id}">${SH.tick}</button></span>`;
const LATE_CLOSE = { 't-cs-lab6': 'Wed 11:59 pm' };
/* Every row is a departure: due time, course, what it is, time left, and a status word (with its shape). */
const statOf = (t, o = {}) => {
  if (o.done) return word('done', 'Done', '');
  if (NEEDS_TARGET[t.id]) return word('needs', 'Needs you', 'needs');
  if (t.state === 'past due, inside late window') return word('late', 'Late window', 'amber');
  if (t.source === 'VHL') return word('needs', 'VHL signed out', 'needs');
  if (t.hours_today) return `<span class="word plain">Today's share of 4h</span>`;
  const p = t.platform_progress ?? t.progress;
  return `<span class="word plain">${p ? p + '% done' : 'Not started'}</span>`;
};
function rowHtml(t, ord, o = {}) {
  const [tm, dw] = dueParts(t.due, t.due_text);
  const late = t.state === 'past due, inside late window';
  return `<li class="row ${o.done ? 'done' : ''} ${o.open ? 'open' : ''} ${late ? 'late' : ''}" data-row="${t.id}">
    <span class="due">${late ? `<span class="fig">Late</span><span class="dw">window closes ${esc(LATE_CLOSE[t.id] || '')}</span>` : `<span class="fig">${tm}</span><span class="dw">${esc(dw)}</span>`}</span>
    <span>${cc(t.course, t.course || t.domain)}</span>
    <span class="ttl"><button type="button" data-go="${o.goto || 'm2-task'}" title="${esc(t.title)}" aria-expanded="${!!o.open}">${esc(t.title)}</button><span class="sub">${esc(t.source)}</span></span>
    <span class="left">${esc((t.estimate_text || '').replace(' today (of 4h left)', ''))}</span>
    <span class="stat">${statOf(t, o)}</span>
    ${ACTIONS(t.id, o.done)}${o.drawer || ''}</li>`;
}

/* The next departure, enlarged as the board's first row: same columns, bigger type, its why and its actions. */

    <span class="due"><span class="fig late-f">Late</span><span class="dw">window closes<br>Wed 11:59 pm</span></span>

    <span class="ttl"><h2 id="live-h">${esc(t.title)}</h2><span class="sub">zyBooks · ${t.progress}% done</span><p class="why">${esc(t.why)}</p>
      <div class="actions"><button class="btn primary" type="button" data-done-card="1">${SH.tick} Done</button><button class="btn" type="button">${SH.open} Open in zyBooks</button></div>

function domains(sel) {
  /* Your classes: one row per course (grade ring and letter when shown, pace), the read model's sentence
     under any course that is behind, because it carries the way back. Domains without a grade share one line. */
  const hide = pref('grades', 'show') === 'hide';
  const rowsC = T.domains.filter(d => d.code).map(d => {
    const g = GR[d.code];
    const pace = d.status === 'behind' ? `about ${Math.round(d.hours)}h behind` : d.status === 'ahead' ? `${d.hours}h ahead` : 'on track';
    return `<li><button type="button" aria-pressed="${sel === d.domain}" data-dom="${esc(d.domain)}">${g && !hide ? ring(g.pct, g.letter) : '<span></span>'}<span title="${esc(d.code)}">${esc(d.domain)}</span><span class="pace">${g && !hide ? `<b>${esc(g.letter)}</b>` : ''}${pace}</span>${d.status === 'behind' ? `<span class="say">${esc(d.sentence)}</span>` : ''}</button></li>`;
  }).join('');
  const other = T.domains.filter(d => !d.code).map(d => d.domain);
  return `<ul class="cls" aria-label="Your classes: filter the list">${rowsC}</ul><p class="small dim" style="margin-top:8px">${esc(other.slice(0, -1).join(', '))} and ${esc(other.slice(-1)[0])}: on track.</p>`;
}

function verdict() {
  const fit = Math.round(T.verdict.must_do_hours * 2), cap = Math.round(T.verdict.capacity_hours * 2);
  const m = Array.from({ length: cap }, (_, i) => `<i class="${i < fit ? '' : 'cap'}"></i>`).join('');
  return `<p class="verdict"><span>${esc(T.verdict.headline)}</span><span class="meter" role="img" aria-label="${fit} half-hour blocks due by tomorrow, ${cap} blocks of room today">${m}</span></p>`;
}

function folds(open = {}) {
  const later = T.later.map((t, i) => rowHtml(t, '')).join('');
  const lwc = T.late_window_closed.map(t => {
    const ask = open.still === t.id;
    return `<div class="line"><div><b>${esc(t.course)} ${esc(t.title)}</b><div class="small dim">Was due ${esc(t.due_text)}. ${esc(t.rule)}.</div>
      ${ask ? `<div style="margin-top:8px"><p class="small" style="margin-bottom:6px"><b>When will you turn it in?</b></p><span class="seg" role="group" aria-label="Day">${['Today', 'Tue', 'Wed', 'Thu', 'Fri', 'Pick a date'].map((d, k) => `<button type="button" aria-pressed="${k === 1}">${d}</button>`).join('')}</span> <button class="btn sm primary" type="button" data-go="m1-today">Put it back on my list</button></div>` : ''}</div>
      <div class="a">${ask ? '' : `<button class="btn sm" type="button" data-go="m1-today">Archive</button>${go('m4-still-doing', 'Still doing it', 'sm')}`}</div></div>`;
  }).join('');
  const closed = T.closed_this_week.map(c => {
    const when = new Date(c.closed_at).toLocaleDateString('en-US', { weekday: 'long' }) + ' ' + t12(c.closed_at.slice(11, 16));
    const undone = open.undone && c.id === 't-chem-pq7';
    const who = c.by === 'Knowlu' ? `Marked by Knowlu: ${c.how}, ${when}` : `Done by you, ${when}`;
    return `<div class="line"><div><span>${cc(c.course, short(c.course))} ${esc(c.title)}</span><div class="small dim">${undone ? 'Undone by you, 8:16 am. Back on your list.' : esc(who)}</div></div><div class="a">${c.undo && !undone ? go('m1-undo', 'Undo', 'sm') : ''}</div></div>`;
  }).join('');
  const f = (key, label, count, inner) => `<div class="fold" ${open[key] && open.scroll === key ? 'data-scroll' : ''}><button type="button" aria-expanded="${!!open[key]}" data-fold="${key}"><span>${label}</span><span class="c">${count}</span></button><div class="inner" ${open[key] ? '' : 'hidden'}>${inner}</div></div>`;
  return `<div class="foldgap"></div>
    ${f('done', 'Done today', '1', `<ul class="rows">${rowHtml({ ...T.list[1], id: 't-bio-r9', title: 'Reading: Ch. 9, Cellular respiration', course: 'BIO 201', source: 'Done by you, 7:55 am · uncheck to put it back', due: '2026-10-26T09:00', due_text: 'today at 9:00 am', estimate_text: '30m', platform_progress: null }, '', { done: true })}</ul>`)}
    ${f('later', 'Later', `21 more, through December 4`, `<ul class="rows">${later}</ul>`)}
    ${f('lwc', 'Late window closed', '2 · archive or keep going', lwc)}
    ${f('closed', 'Closed this week', '8 · you and Knowlu', closed)}`;
}

function rightCol(o = {}) {
  const schedule = o.schedule || T.schedule;
  const nowH = o.nowH ?? NOW_H;
  const sch = schedule.map(s => `<li><span class="fig">${t12(s.start).replace(' am', '').replace(' pm', '')}<span class="small dim" style="font-family:inherit"> ${t12(s.start).slice(-2)}</span></span><span>${esc(s.title)}${s.level === 'optional' ? ' <span class="small dim">· optional</span>' : ''}<br><span class="r">${esc(s.room || '')}</span></span></li>`).join('');
  const span = BED - WAKE, pos = h => ((h - WAKE) / span * 100).toFixed(2);
  const fl = freeLabel(schedule, nowH);
  const L = fl.o.longest;
  const blocks = schedule.map(s => `<i class="${s.level === 'optional' ? 'opt' : ''}" style="left:${pos(hm(s.start))}%;width:${((hm(s.end) - hm(s.start)) / span * 100).toFixed(2)}%"></i>`).join('')
    + (L ? `<span class="stretch" style="left:${pos(L[0])}%;width:${((L[1] - L[0]) / span * 100).toFixed(2)}%"></span>` : '')
    + `<span class="now" style="left:${pos(nowH)}%"></span>`;
  const stretchLbl = L ? `<span class="stretch-l" style="left:${pos(L[0])}%;width:${((L[1] - L[0]) / span * 100).toFixed(2)}%">Free ${H12(L[0])} to ${H12(L[1])}</span>` : '';
  const nowLbl = `<span class="now-l" style="left:${pos(nowH)}%">Now</span>`;
  /* Needs you, date-checked against the page's own date. */
  const nowIso = o.nowIso || T.as_of;
  const order = ['d-surf', 'd-panel', 'd-ext', 'd-lab8'];
  const pending = order.slice(o.deck || 0);
  const live = pending.filter(id => decEnds(DEC[id]) > nowIso), expired = pending.filter(id => decEnds(DEC[id]) <= nowIso);
  const ageDays = id => Math.max(0, Math.round((new Date(nowIso) - new Date(DEC[id].proposed_at)) / 86400000));
  let deckHtml = '';
  if (live.length) {
    const d = DEC[live[0]], em = EM[d.evidence_email];
    deckHtml = `<div class="card"><p class="q">${esc(d.question)}</p>${d.detail ? `<p class="small dim" style="margin-top:4px">${esc(d.detail)}</p>` : ''}
      <p class="small dim" style="margin-top:4px">From ${esc(em.from.replace(/ <.*/, ''))}'s email, ${new Date(em.received).toLocaleDateString('en-US', { month: 'long', day: 'numeric' })}. ${lk('m5-needs-you', 'Show the email')}</p>
      <div class="actions">${d.answers.map((a, i) => i === 0 ? go('m5-needs-you', esc(a), 'sm primary') : lk('m5-needs-you', esc(a))).join('')}<button class="link" type="button">Not now</button></div></div>`;
  }
  const NAME = { 'd-ext': 'the Literature review date', 'd-panel': 'the admissions panel', 'd-surf': 'the SURF application', 'd-lab8': 'the Lab 8 date' };
  const closedQ = expired.length ? `<p class="closedq">${expired.length === 1 ? 'One question' : expired.length + ' questions'} closed on ${expired.length === 1 ? 'its' : 'their'} own once the date passed (${expired.map(id => NAME[id]).join(' and ')}). Nothing in your plan changed; the official dates stood.</p>` : '';
  const oldest = live.length ? Math.max(...live.map(ageDays)) : 0;
  const lab8open = o.lab8;
  const changes = `<ul class="chg">
    <li ${lab8open ? 'data-scroll style="border:1px solid var(--rule-2);border-radius:8px;padding:12px;background:var(--board)"' : ''}><b>Lab 8: Dictionaries</b>. Official: Wednesday, November 4 at 11:59 pm. Email says: Friday, November 6 at 11:59 pm.<span class="src">From Priya Raman, CS 110 TA, Sunday 9:41 pm. The official date stays until you answer.</span>
      ${lab8open ? `<div class="quote"><span class="qh">Priya Raman, CS 110 TA &lt;praman@halverson.example&gt; · Sunday 9:41 pm · from your school mailbox · quoted as sent</span>"${esc(EM.m6.quote)}"</div><p class="small dim">Blackboard still shows Wednesday. If Blackboard changes it too, Knowlu applies that and lists it here.</p>` : ''}
      <div class="actions">${go('m1-today', 'Move it', 'sm')}${go('m1-today', 'Keep Wednesday', 'sm')}${lab8open ? '' : lk('m3-change', 'Show the email')}</div></li>
    <li>Pre-lecture quiz: Ch. 7 done.<span class="src">Blackboard shows it turned in, Sunday 4:40 pm. Marked by Knowlu.</span><div class="actions">${go('m1-undo', 'Undo', 'sm')}</div></li>
    <li>BIO 201 Lab 4 report graded: 44/50.<span class="src">Blackboard grades, Sunday 6:00 pm.</span></li></ul>
    <p class="small dim" style="margin:14px 0 4px;font-weight:600">Good to know</p>
    <ul class="chg"><li>CHEM 231 Exam 2 on Thursday is in Hallett Hall 120, not the usual room.<span class="src">From a CHEM 231 Blackboard announcement email, Saturday 10:03 am. Nothing in your plan changes.</span></li>
    <li>CHEM 231 Problem set 6 is marked missing in Blackboard.<span class="src">It's in Late window closed, on the left.</span></li></ul>`;
  const repair = o.repair ? `<section class="rsec"><div class="rh"><span class="lab">Sign in to VHL</span>${lk('m1-today', 'Close')}</div>${keptForm('VHL', 'VHL Central')}<div class="actions">${go('m1-today', 'Sign in to VHL', 'primary')}</div><p class="small dim" style="margin-top:8px">New VHL work since Sunday 6:04 pm comes in on the next check.</p></section>` : '';
  return `<aside class="rightcol" aria-label="Your day, questions and changes">${repair}
    <section class="rsec"><div class="rh"><span class="lab">${o.dayLabel || 'Your day'}</span><span class="small dim">${esc(fl.text)} · ${hfmt(fl.o.hours)} open</span></div>
      <ul class="sched">${sch}</ul><div class="daylabels" aria-hidden="true">${nowLbl}${stretchLbl}</div><div class="daybar" role="img" aria-label="Day from ${H12(WAKE)} to ${H12(BED)}: your classes, now, and your longest free stretch">${blocks}</div><div class="dayticks"><span>${H12(WAKE)}</span><span>noon</span><span>6 pm</span><span>${H12(BED)}</span></div>
      <p class="small dim" style="margin-top:6px">Grey blocks are the classes above. Knowlu shows where free time falls; it doesn't put work into it.</p></section>
    ${o.noDeck ? '' : `<section class="rsec"><div class="rh"><span class="lab">Needs you</span><span class="small dim">${live.length ? `${live.length} waiting · oldest ${oldest} day${oldest === 1 ? '' : 's'}` : 'nothing waiting'}</span></div>${deckHtml || '<p class="small dim">Nothing needs you right now.</p>'}${closedQ}</section>`}
    ${o.noChanges ? '' : `<section class="rsec"><div class="rh"><span class="lab">Since last night</span><span class="small dim">since 6:00 pm Sunday</span></div>${changes}</section>`}
    ${o.noClasses ? '' : `<section class="rsec"><div class="rh"><span class="lab">Your classes</span><span class="small dim">click one to filter</span></div>${domains(o.dom)}</section>`}
  </aside>`;
}
