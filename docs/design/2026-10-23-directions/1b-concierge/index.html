<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowlu Concierge</title>
<meta name="description" content="Direction 1b: onboarding as a session run on the student's own data, and Today as a list with Knowlu's letter in the margin. Invented student data.">
<style>
/* Literata and Mona Sans (SIL OFL), from Google Fonts, self-hosted so screenshots and offline runs are stable */
@font-face{font-family:'Literata';font-style:normal;font-weight:400 500;font-display:block;src:url(assets/fonts/Literata-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
@font-face{font-family:'Literata';font-style:normal;font-weight:400 500;font-display:block;src:url(assets/fonts/Literata-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Mona Sans';font-style:normal;font-weight:400 600;font-display:block;src:url(assets/fonts/MonaSans-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
@font-face{font-family:'Mona Sans';font-style:normal;font-weight:400 600;font-display:block;src:url(assets/fonts/MonaSans-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}

:root{
  --paper:oklch(0.985 0.004 250); --margin:oklch(0.962 0.008 252); --sheet:oklch(0.995 0.002 250);
  --ink:oklch(0.255 0.045 265); --ink-2:oklch(0.44 0.035 262); --rule:oklch(0.88 0.012 255);
  --pen:oklch(0.43 0.12 262); --on-ink:oklch(0.985 0.004 250); --tick:oklch(0.48 0.09 170);
  --caret:oklch(0.50 0.12 65); --caret-ground:oklch(0.95 0.035 80); --quote:oklch(0.95 0.01 250);
  --brand:#BC4444; --shadow:0 10px 28px oklch(0.3 0.04 262 / .16), 0 2px 6px oklch(0.3 0.04 262 / .08);
  --win-shadow:0 24px 60px oklch(0.2 0.04 262 / .30), 0 4px 12px oklch(0.2 0.04 262 / .14);
  --chipL:0.93; --chipC:0.045; --labL:0.38;
  --serif:"Literata", Georgia, serif; --sans:"Mona Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"]{
  --paper:oklch(0.205 0.022 262); --margin:oklch(0.235 0.026 262); --sheet:oklch(0.265 0.03 262);
  --ink:oklch(0.935 0.01 250); --ink-2:oklch(0.79 0.02 255); --rule:oklch(0.34 0.025 262);
  --pen:oklch(0.78 0.10 255); --on-ink:oklch(0.205 0.022 262); --tick:oklch(0.80 0.09 170);
  --caret:oklch(0.82 0.12 80); --caret-ground:oklch(0.30 0.04 75); --quote:oklch(0.25 0.025 262);
  --shadow:0 10px 28px oklch(0 0 0 / .45), 0 2px 6px oklch(0 0 0 / .3);
  --win-shadow:0 24px 60px oklch(0 0 0 / .6), 0 4px 12px oklch(0 0 0 / .4);
  --chipL:0.32; --chipC:0.05; --labL:0.88;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:oklch(0.205 0.022 262); --margin:oklch(0.235 0.026 262); --sheet:oklch(0.265 0.03 262);
    --ink:oklch(0.935 0.01 250); --ink-2:oklch(0.79 0.02 255); --rule:oklch(0.34 0.025 262);
    --pen:oklch(0.78 0.10 255); --on-ink:oklch(0.205 0.022 262); --tick:oklch(0.80 0.09 170);
    --caret:oklch(0.82 0.12 80); --caret-ground:oklch(0.30 0.04 75); --quote:oklch(0.25 0.025 262);
    --chipL:0.32; --chipC:0.05; --labL:0.88; color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overflow:hidden}
::selection{background:color-mix(in oklch, var(--pen) 28%, transparent);color:var(--ink)}
*{scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pen);outline-offset:3px;border-radius:6px}
a{color:var(--pen);text-underline-offset:3px;text-decoration-thickness:1px}
.tn{font-variant-numeric:lining-nums proportional-nums}
.serif{font-family:var(--serif);font-variant-numeric:lining-nums;font-optical-sizing:auto}
svg.g{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.c-tick{color:var(--tick)} .c-caret{color:var(--caret)} .c-quiet{color:var(--ink-2)} .c-pen{color:var(--pen)}

/* ---------- top bar ---------- */
.top{height:44px;display:flex;align-items:center;gap:16px;padding:0 32px;border-bottom:1px solid var(--rule);background:var(--paper);position:relative;z-index:5}
.mark{display:inline-flex;align-items:center;height:28px;padding:0 2px;border-radius:5px}
.mark img{height:19px;display:block}
/* dark: the wordmark's ink turns to paper and its red block keeps its hue; no tile behind it */
:root[data-theme="dark"] .mark img{filter:invert(1) hue-rotate(180deg) saturate(1.15)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mark img{filter:invert(1) hue-rotate(180deg) saturate(1.15)}}
.top .status{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.875rem;color:var(--ink-2)}
.top .status.needs{color:var(--ink)}
.top .status .act{font-weight:600;color:var(--pen);background:none;border:0;padding:4px 6px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.top .tbtn{background:none;border:0;font-size:.875rem;color:var(--ink-2);cursor:pointer;padding:6px 8px;border-radius:6px}
.top .tbtn:hover{color:var(--ink)}

/* ---------- onboarding frame ---------- */
.ob{display:grid;grid-template-columns:1fr 17rem;position:fixed;top:44px;left:0;right:0;bottom:0;transition:grid-template-columns .4s cubic-bezier(.16,1,.3,1)}
.thread-wrap{overflow-y:auto;overflow-x:hidden;position:relative}
/* the stage: one open exchange at a fixed anchor, centred in the main area; history folds into one line */
.stage{width:38rem;margin:0 auto;padding:9vh 0 10vh;transition:margin .3s cubic-bezier(.16,1,.3,1)}
.ob.has-win .stage{margin-left:56px;width:26.5rem}
.thread{list-style:none;margin:0;padding:0}
.hist{display:flex;align-items:center;gap:10px;font-size:.8125rem;color:var(--ink-2);margin:0 0 6px}
.hist::after{content:"";flex:1;border-top:1px solid var(--rule)}
.hist .link{font-size:.8125rem}
.earlier{margin:0 0 8px;padding:0 0 18px;border-bottom:1px solid var(--rule)}
.earlier .ex:first-child{margin-top:8px}
.prev{margin:10px 0 0;color:var(--ink-2)}
.prev .answer{color:var(--ink-2);margin-top:0}
.prev .reply{color:var(--ink-2);font-size:1rem;margin-top:6px}
.prev .proof{color:var(--ink-2);margin-top:6px}
.stage > .fu{margin-top:14px}
.stage > .ex.open{margin-top:34px}
.stage.tall{padding-top:4vh}
.stage.tall > .thread > .ex.open{margin-top:24px}
.rail{background:var(--margin);border-left:1px solid var(--rule);padding:22px 22px 18px;display:flex;flex-direction:column;overflow:auto;font-size:.875rem}

.ex{margin-top:28px;animation:rise .2s cubic-bezier(.16,1,.3,1) both}
.ex.past{animation:none}
.ex.past .why,.ex.past .reply,.ex.past .proof,.ex.past .summary,.ex.past .body{color:var(--ink-2)}
.ex.past .chips,.ex.past .cost,.ex.past .sheet,.ex.past .opt{display:none}
.ex.past .keep{display:block}
.why,.reply,.fu-text{font-family:var(--serif);font-size:1.125rem;line-height:1.55;margin:0;max-width:38rem;font-variant-numeric:lining-nums}
.why + .why{margin-top:8px}
.takes{font-size:.875rem;color:var(--ink-2);margin:8px 0 0;max-width:36rem}
.body{margin-top:12px}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.chip{height:40px;padding:0 18px;border-radius:8px;border:1px solid var(--ink);background:transparent;font-size:.9375rem;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px;position:relative;transition:transform .1s, background .15s}
.chip:active{transform:translateY(1px) scale(.99)}
.chip.p{background:var(--ink);color:var(--on-ink)}
.chip.p:hover{background:color-mix(in oklch, var(--ink) 88%, var(--pen))}
.chip.s:hover{background:color-mix(in oklch, var(--ink) 6%, transparent)}
.chip.t{border:0;padding:0 6px;height:32px;margin-left:8px;color:var(--pen);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.chip[disabled]{opacity:.45;cursor:not-allowed}
.chip .k{display:none;position:absolute;top:-9px;right:-6px;font-size:.6875rem;line-height:1;padding:3px 5px;border-radius:4px;background:var(--pen);color:var(--on-ink);font-weight:600}
.chip:focus-visible .k{display:block}
.cost{font-size:.875rem;color:var(--ink-2);margin:10px 0 0;max-width:36rem}
.cost b{font-weight:600;color:var(--ink)}
.answer{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin:14px 0 0;font-size:.9375rem;color:var(--ink);max-width:38rem;font-weight:500}
.answer::before{content:"";flex:1;max-width:6rem;border-top:1px solid var(--rule);margin-right:6px}
.reply{margin-top:14px}
.quietline{font-size:.875rem;color:var(--ink-2);margin:8px 0 0;max-width:36rem}
.proof{list-style:none;padding:0;margin:14px 0 0;font-size:.9375rem;max-width:38rem}
.proof li{display:grid;grid-template-columns:22px 13rem 1fr;align-items:baseline;gap:6px;padding:4px 0;font-variant-numeric:lining-nums proportional-nums}
.proof li .q{color:var(--ink-2);font-size:.875rem}
.proof li.rd{color:var(--ink-2)}
.proof.two{display:grid;grid-template-columns:1fr 1fr;column-gap:24px;align-items:start}
.proof.two li{grid-template-columns:22px 1fr;padding:3px 0}
.proof.two li .q{grid-column:2;font-size:.8125rem;line-height:1.3}
.proof li svg{vertical-align:-2px}
.open-mark{position:absolute;left:-28px;top:6px;width:12px;height:2px;background:var(--pen)}
.ex.open{position:relative}
.fu{margin-top:18px;padding-left:0;position:relative;list-style:none;display:grid;grid-template-columns:22px 1fr;gap:4px;align-items:baseline}
.fu .fu-text{font-size:1.0625rem;color:var(--ink)}
.fu > svg, .fu > .dots{position:relative;top:1px}
.fu.warn > svg{color:var(--caret)}
.code{font-size:.8125rem;color:var(--ink-2);margin-top:4px}
.hairline{border:0;border-top:1px solid var(--rule);margin:28px 0 0;max-width:38rem}
.where{margin:14px 0 0;padding:0;list-style:none;max-width:38rem;font-size:.9375rem}
.where li{display:grid;grid-template-columns:9rem 1fr;gap:12px;padding:7px 0;border-top:1px solid var(--rule)}
.where li:last-child{border-bottom:1px solid var(--rule)}
.where b{font-weight:600}
.link{background:none;border:0;padding:0;color:var(--pen);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font:inherit}

/* summary (payment) */
.summary{margin-top:16px;max-width:34rem;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);padding:12px 0 14px;font-size:.9375rem;font-variant-numeric:lining-nums proportional-nums}
.summary .row{display:flex;justify-content:space-between;gap:16px;font-weight:600}
.summary .small{font-size:.875rem;color:var(--ink-2);margin-top:6px;line-height:1.5}
.summary .next{margin-top:12px;padding-top:12px;border-top:1px solid var(--rule);color:var(--ink)}

/* tables inside the thread */
.tt{width:100%;max-width:38rem;border-collapse:collapse;margin-top:12px;font-size:.875rem;font-variant-numeric:lining-nums proportional-nums}
.tt td{padding:7px 8px 7px 0;border-top:1px solid var(--rule);vertical-align:baseline}
.tt tr:last-child td{border-bottom:1px solid var(--rule)}
.tt .lbl{font-weight:500;white-space:nowrap}
.tt td.tm{white-space:nowrap}
.tt .src{color:var(--ink-2);font-size:.8125rem}
.tt .chg{text-align:right}
.lv{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.lv[hidden]{display:none}
.lv button{height:30px;padding:0 10px;border-radius:6px;border:1px solid var(--rule);background:transparent;font-size:.8125rem;cursor:pointer}
.lv button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}

/* sign-in sheet: the one enclosed shape */
.sheet{margin-top:16px;width:32rem;background:var(--sheet);border:1px solid var(--pen);border-radius:10px;box-shadow:var(--shadow);padding:18px 20px;animation:sheet .25s cubic-bezier(.16,1,.3,1) both}
.sheet .sh{display:flex;gap:8px;align-items:center;font-size:.875rem;font-weight:600;color:var(--pen);margin-bottom:10px}
.sheet .priv{font-size:.875rem;color:var(--ink-2);margin:10px 0 0}
.sheet label{display:block;font-size:.8125rem;color:var(--ink-2);margin:10px 0 4px}
.sheet input{width:100%;height:38px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);font:inherit;font-size:.9375rem;padding:0 10px;caret-color:var(--pen)}
.sheet input:focus{outline:2px solid var(--pen);outline-offset:1px}
.boxes{display:flex;gap:8px;margin-top:8px}
.boxes input{width:44px;height:48px;text-align:center;font-size:1.25rem;font-variant-numeric:lining-nums proportional-nums}
.sheet.key{border-style:dashed}

/* drawn picture of a third-party screen (schematic, never a copy of its UI) */
.pic{margin-top:14px;max-width:30rem;border:1px solid var(--rule);border-radius:8px;padding:14px 16px;background:var(--quote);font-family:var(--sans);font-size:.875rem;color:var(--ink-2)}
.pic .ph{font-weight:600;color:var(--ink);font-size:.9375rem;margin-bottom:6px}
.pic .hl{display:inline-block;border:1px solid var(--pen);border-radius:5px;padding:0 7px;color:var(--pen);font-weight:500}
.pic .arrow{color:var(--ink-2)}

/* simulated OS windows: school, Google, browser checkout */
.oswin{position:fixed;left:calc(56px + 26.5rem + 40px);top:76px;width:min(480px, calc(100vw - 17rem - 56px - 26.5rem - 64px));background:#fff;color:#1d1d1f;border-radius:8px;box-shadow:var(--win-shadow);font-family:"Segoe UI",system-ui,sans-serif;z-index:20;overflow:hidden;animation:winin .25s cubic-bezier(.16,1,.3,1) both;border:1px solid #c9ccd3}
.oswin .tb{height:34px;background:#eceef2;display:flex;align-items:center;padding:0 0 0 12px;font-size:12px;color:#444;gap:8px}
.oswin .tb .host{background:#fff;border:1px solid #d5d8de;border-radius:4px;padding:2px 8px;font-size:12px}
.oswin .tb .x{margin-left:auto;width:46px;height:34px;border:0;background:transparent;cursor:pointer;font-size:15px;color:#333}
.oswin .tb .x:hover{background:#e81123;color:#fff}
.oswin .pg{padding:28px 44px 34px}
.oswin .crest{font-family:Georgia,serif;font-size:22px;color:#2a3d66;letter-spacing:.01em}
.oswin .crest small{display:block;font-family:"Segoe UI",sans-serif;font-size:12px;color:#666;letter-spacing:0;margin-top:2px}
.oswin label{display:block;font-size:13px;margin:14px 0 4px;color:#333}
.oswin input{width:100%;height:34px;border:1px solid #a9aeb8;border-radius:3px;padding:0 8px;font:inherit;font-size:14px}
.oswin .sbtn{margin-top:18px;height:36px;padding:0 22px;background:#2a3d66;color:#fff;border:0;border-radius:3px;font-size:14px;cursor:pointer}
.oswin .sbtn.alt{background:#fff;color:#2a3d66;border:1px solid #2a3d66;margin-left:8px}
.oswin .proto{margin-top:18px;padding-top:12px;border-top:1px dashed #c9ccd3;font-size:12px;color:#666}
.oswin .proto button{font-size:12px;margin-right:6px;padding:4px 8px;border:1px solid #aaa;background:#f6f6f6;border-radius:3px;cursor:pointer}
.oswin .phone{display:flex;gap:16px;align-items:center;margin-top:14px;font-size:14px}
.oswin .phone svg{width:40px;height:56px}
.oswin .scope{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid #e3e5ea;font-size:14px}
.oswin .gray{color:#666;font-size:13px}

/* rail */
.rail h2{font-size:.9375rem;font-weight:600;margin:0;line-height:1.3}
.rail .left{color:var(--ink-2);margin:4px 0 0;font-size:.8125rem}
.rail ol{list-style:none;padding:0;margin:18px 0 0}
.rail li{display:grid;grid-template-columns:20px 1fr;gap:6px;padding:6px 0;align-items:start}
.rail li .lab{font-weight:500}
.rail li .sub{grid-column:2;color:var(--ink-2);font-size:.8125rem;margin-top:1px;font-variant-numeric:lining-nums proportional-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail li{padding:5px 0}
.rail li.older .lab{font-weight:400;color:var(--ink-2);line-height:1.45}
.rail .dots i{width:3px;height:3px;margin:0 1px}
.rail li.now .lab{text-decoration:underline;text-decoration-color:var(--pen);text-decoration-thickness:2px;text-underline-offset:5px}
.rail li.now .w{color:var(--pen);font-size:.75rem;font-weight:600;margin-left:6px}
.rail li button.lab{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:500}
.rail li button.lab:hover{color:var(--pen)}
.rail .sec{font-size:.75rem;color:var(--ink-2);margin:16px 0 0;font-weight:600}
.rail .then{color:var(--ink-2);font-size:.8125rem;margin:6px 0 0;line-height:1.5}
.rail .foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--rule)}
.rail .foot button{background:none;border:0;padding:4px 0;color:var(--pen);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:.875rem}
.rail .foot .na{color:var(--ink-2);font-size:.8125rem}
.dots i{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--ink-2);margin:0 1.5px;animation:dot 1.2s infinite both}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
.rail .dots{padding-top:6px}

/* ---------- Today and the reveal ---------- */
.day{display:grid;grid-template-columns:calc(45rem + 32px) 1fr;grid-template-rows:minmax(0,1fr);position:fixed;top:44px;left:0;right:0;bottom:0}
.main{overflow-y:auto;padding:20px 0 40px 32px;position:relative}
.main-in{width:45rem}
.marg{background:var(--margin);border-left:1px solid var(--rule);display:flex;flex-direction:column;min-width:0;position:relative;margin-left:40px}
.marg-scroll{overflow-y:auto;flex:1;min-height:0;padding:22px 30px 20px 30px;position:relative}
.sum{font-family:var(--serif);font-size:1rem;line-height:1.55;margin:0 0 12px;font-variant-numeric:lining-nums}
.counts{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.counts > li{border-bottom:1px solid var(--rule)}
.counts .cnt{display:grid;grid-template-columns:2.25rem 1fr 16px;align-items:baseline;gap:6px;width:100%;background:none;border:0;padding:8px 2px;text-align:left;cursor:pointer;font-size:.875rem;color:var(--ink)}
.counts .cnt:hover{background:color-mix(in oklch, var(--ink) 4%, transparent)}
.counts .cnt .n{font-size:1.0625rem;font-weight:600;font-variant-numeric:lining-nums tabular-nums;text-align:right;padding-right:6px}
.counts .cnt .n.w{font-size:.8125rem}
.counts .cnt .s{color:var(--ink-2)}
.counts .cnt svg{transition:transform .2s cubic-bezier(.16,1,.3,1);color:var(--ink-2)}
.counts .cnt[aria-expanded="true"] svg{transform:rotate(90deg)}
.counts .cnt.caret .n{color:var(--caret)}
.counts .fn{margin:0 0 10px;padding-top:0;border-top:0}
.dhead{display:flex;align-items:baseline;gap:12px;font-size:.9375rem}
.dhead b{font-weight:600;font-size:1rem}
.dhead .q{color:var(--ink-2);font-size:.875rem}
.strip{position:relative;height:30px;margin-top:12px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}

function railHTML(sc, mainIdx, openId){
  const passed = id => MAIN.indexOf(id) > -1 && MAIN.indexOf(id) < mainIdx;
  const items = [];
  if (passed('A') || sc.id === 'A-restored') items.push({ex:'A', lab:'Account', sub:'signed in with Google', st:'done'});
  if (passed('S-proof') || (MAIN.indexOf('S-proof') <= mainIdx && sc.stage)){
    const st = sc.stage;
    items.push({ex:'S-proof', lab:'Halverson State', st: st === 'early' ? 'reading' : 'done',
      sub: st === 'early' ? '5 classes so far'
        : st === 'slow' ? 'grades taking longer'
        : st === 'nocount' ? 'counted after checkout'
        : '5 classes, 26 assignments'});
  } else if (sc.id === 'A-restored'){ items.push({ex:'A', lab:'Halverson State', st:'done', sub:'from your account'}); }
  if (passed('P-out')) items.push({ex:'P', lab:'Payment', sub:'first charge Oct 25', st:'done'});
  if (passed('E')){
    if ((sc.skipped || []).includes('email')) items.push({ex:'E', lab:'School email', st:'skipped', sub:'emailed date changes missed'});
    else if (mainIdx <= MAIN.indexOf('G') && sc.emailWaiting) items.push({ex:'E', lab:'School email', st:'reading', sub:'waiting for the test message'});
    else items.push({ex:'E', lab:'School email', st:'done', sub:'forwarding on'});
  }
  if (passed('G-proof') || (sc.cut === 'G')){
    if ((sc.skipped || []).includes('google')) items.push({ex:'G', lab:'Gmail and Calendar', st:'skipped', sub:'your own events ignored'});
    else items.push({ex:'G-proof', lab:'Gmail and Calendar', st:'done', sub:'1 thing to do, 6 events'});
  }
  if (passed('H-vhl')) items.push({ex:'H-vhl', lab:'VHL', st:'done', sub:'6 assignments, 2 done'});
  if (sc.vhlNeeds) items.push({ex:'H-vhl', lab:'VHL', st:'needs', sub:'sign in again'});
  if (passed('H-zybooks')) items.push({ex:'H-zybooks', lab:'zyBooks', st:'done', sub:'8 assignments, 3 done'});
  if (passed('Y-cs110')) items.push({ex:'Y-cs110', lab:'CS 110 syllabus', st: openId === 'W-cs110' ? 'done' : 'reading', sub: openId === 'W-cs110' ? 'read' : 'usually under a minute'});
  if (passed('K4')) items.push({ex:'K4', lab:'Your week', st:'done', sub:'checked by you'});

  const nowKey = MAIN[mainIdx] || 'O0';
  const left = LEFT[nowKey] ?? 5;
  const known = mainIdx > MAIN.indexOf('S-proof');
  const head = nowKey === 'W' ? 'Your week, within 3 minutes' : `Your week in about ${left + 3} minutes`;
  const sub = nowKey === 'W' ? 'Nothing more to answer.' : `${left} with you, then up to 3 while I read.`;
  const glyph = st => st === 'done' ? g('tick','c-tick') : st === 'reading' ? dots() : st === 'needs' ? g('caret','c-caret') : st === 'skipped' ? g('dash','c-quiet') : g('circle','c-quiet');
  const word = st => st === 'reading' ? ' <span class="c-quiet" style="font-weight:400">reading…</span>' : st === 'skipped' ? ' <span class="c-quiet" style="font-weight:400">not now</span>' : st === 'needs' ? ' <span class="c-caret" style="font-weight:600">needs you</span>' : '';
  /* only the two newest keep their proof; older finished ones fold into one line */
  const KEEP = 2;
  const cut = Math.max(0, items.length - KEEP);
  const older = items.slice(0, cut), newer = items.slice(cut);
  const olderDone = older.filter(i => i.st === 'done'), olderOther = older.filter(i => i.st !== 'done');
  const one = i => `<li>${glyph(i.st)}<span><button class="lab" data-goto="${i.ex}">${i.lab}${word(i.st)}</button><span class="sub" style="display:block">${i.sub}</span></span></li>`;
  const list = (olderDone.length ? `<li class="older">${g('tick','c-tick')}<span class="lab">${olderDone.map(i => i.lab).join(', ')}</span></li>` : '')
    + olderOther.map(i => `<li>${glyph(i.st)}<span class="lab">${i.lab}${word(i.st)}</span></li>`).join('')
    + newer.map(one).join('');
  const win = sc.win || EX[openId]?.noFinish;
  return `<h2>${head}</h2><p class="left">${sub}</p>
    ${items.length ? `<p class="sec">So far</p><ol aria-label="Connected so far">${list}</ol>` : ''}
    <p class="sec">Now</p>
    <ol><li class="now" aria-current="step"><svg class="g c-pen" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 12.5h10"/></svg><span class="lab">${NOW[nowKey] || ''}</span></li></ol>
    ${nowKey !== 'W' ? `<p class="then">${known ? THEN[nowKey] || '' : THEN_EARLY}</p>` : ''}
    <div class="foot">${win ? '<span class="na">Finish later comes back when this window closes.</span>' : '<button data-to="X">Finish later</button>'}</div>`;
}

/* the exchange just answered, folded to its answer and reply */
function recapHTML(id, sc){
  const ex = EX[id]; if (!ex) return '';
  const ans = (sc.answers && sc.answers[id]) || ex.answer;
  let rep = (sc.replies && sc.replies[id]) || ex.reply;
  if (id === 'G-proof' && sc.calSkipped) rep = EX['G-part'].reply;
  const A = ans ? `<p class="answer">${ans} ${g('tick','c-tick')}</p>` : '';
  if (ex.proofStage) return P(PROOF_LINE[sc.stage || 'full'], 'reply') + A;
  if (ex.transient) return rep ? P(rep, 'reply') : '';
  if (ex.wait) return '';
  const R = rep ? P(rep, 'reply') : '';
  return ex.showReplyOpen && !ex.answerFirst ? R + A : A + R;
}

/* leader line: from a row to the note about it */
function drawLeader(fromEl, toEl){
  const svg = $('#leader'), day = $('#day');
  if (!svg || !fromEl || !toEl) return;
  const R = day.getBoundingClientRect(), a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect(), m = $('.marg').getBoundingClientRect();
  if (a.bottom < R.top || a.top > R.bottom) { svg.innerHTML = ''; return; }
  const x1 = a.right - R.left + 6, x2 = b.left - R.left - 8, xm = m.left - R.left - 14;
  const y2 = b.top - R.top + 13, y1 = Math.abs((a.top - R.top + 21) - y2) < 30 ? y2 : a.top - R.top + Math.min(a.height / 2, 22);
  svg.setAttribute('width', R.width); svg.setAttribute('height', R.height);
  const d = `M${x1} ${y1} H${xm} L${x2 - 6} ${y2} H${x2}`;
  const len = Math.round(Math.abs(xm - x1) + Math.hypot(x2 - 6 - xm, y2 - y1) + 6);
  svg.innerHTML = `<circle cx="${x1}" cy="${y1}" r="2"/><path d="${d}" style="--len:${len}"/>`;
}
function alignTo(row, note, base){
  note.style.transition = 'none';
  note.style.marginTop = base + 'px';
  const dy = (row.getBoundingClientRect().top + 8) - note.getBoundingClientRect().top;
  if (dy > 0) note.style.marginTop = (base + dy) + 'px';
}
function placeNote(){
  const note = $('#note'), row = $(`.row[data-id="${TS.focus}"]`) || $('.row');
  if (!note || !row) return;
  alignTo(row, note, 0);
  drawLeader(row, note);
}

    if (e.key === 'x' && TS.focus){ TS.done.has(TS.focus) ? TS.done.delete(TS.focus) : TS.done.add(TS.focus); rerenderToday(); $(`.row[data-id="${TS.focus}"]`)?.focus(); }
    if (e.key === 'p' && TS.focus){ TS.pinned.has(TS.focus) ? TS.pinned.delete(TS.focus) : TS.pinned.add(TS.focus); rerenderToday(); }
    if (e.key === 'Enter' && e.target.classList?.contains('row')){ TS.open = TS.open === TS.focus ? null : TS.focus; rerenderToday(); $(`.row[data-id="${TS.focus}"]`)?.focus(); }
    if (e.key === '/'){ e.preventDefault(); $('#ask')?.focus(); }
    if (e.key === 'Escape'){ TS.open = null; TS.fn = null; rerenderToday(); }
    return;
  }
  if (typing) return;
  const open = $('.ex.open');
  if (!open) return;
  const chips = $$('.chip:not([disabled])', open);
  if (e.key === 'Enter' && !(e.target.closest && e.target.closest('button'))){ chips[0]?.click(); }
  if (/^[1-4]$/.test(e.key)){ chips[Number(e.key) - 1]?.click(); }
});
window.addEventListener('hashchange', () => { SHOWHIST = false; render(); });
window.addEventListener('resize', () => { if (TODAY.includes(parse().id)) placeNote(); });

/* ---------- prototype jumper (Quinn's controls) ---------- */
function renderJumper(){
  const j = $('#jump'); if (!j || j.hidden) return;
  const cur = parse().id;
  j.innerHTML = `<div class="ctl">
    <button data-set="theme">${SET.theme === 'dark' ? 'Dark' : 'Light'}</button>
    <button data-set="motion">Motion: ${SET.motion}</button>
    <button data-set="voice">Voice: ${SET.voice === 'I' ? '"I"' : '"Knowlu"'}</button>
    <button data-set="rows">Rows: ${SET.rows}</button>
    <button data-set="copy">Copy my settings</button></div>
    ${GROUPS.map(([t, ids]) => `<h4>${t}</h4>${ids.map(i => `<a href="#${i}" class="${i === cur ? 'cur' : ''}">${i}</a>`).join('')}`).join('')}`;
}
document.addEventListener('click', e => {
  const s = e.target.closest('[data-set]'); if (!s) return;
  const k = s.dataset.set;
  if (k === 'theme') SET.theme = SET.theme === 'dark' ? 'light' : 'dark';
  if (k === 'motion') SET.motion = SET.motion === 'on' ? 'reduced' : 'on';
  if (k === 'voice') SET.voice = SET.voice === 'I' ? 'Knowlu' : 'I';
  if (k === 'rows') SET.rows = SET.rows === 'condensed' ? 'roomy' : 'condensed';
  if (k === 'copy'){ const t = `Knowlu 1b concierge settings\nscreen: ${parse().id}\ntheme: ${SET.theme}\nmotion: ${SET.motion}\nvoice: ${SET.voice}\nrows: ${SET.rows}`; navigator.clipboard?.writeText(t).catch(() => {}); s.textContent = 'Copied'; return; }
  try { localStorage.setItem('kn1b', JSON.stringify(SET)); } catch (_) {}
  render();
});
$('#protoBtn').addEventListener('click', () => { const j = $('#jump'); j.hidden = !j.hidden; $('#protoBtn').setAttribute('aria-expanded', !j.hidden); renderJumper(); });
try { Object.assign(SET, JSON.parse(localStorage.getItem('kn1b') || '{}')); } catch (_) {}
if (new URLSearchParams(location.search).has('shot')) { document.body.classList.add('shot'); SET.theme = 'light'; SET.motion = 'on'; SET.voice = 'I'; SET.rows = 'condensed'; }
render();

</script>
