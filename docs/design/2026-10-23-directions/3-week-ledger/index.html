<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowlu · Week ledger</title>
<meta name="description" content="Direction 3 (the week as a balance): a clickable prototype of Knowlu's long onboarding, the Here's your week reveal and the main page. Invented student data.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
/* Knowlu direction 3: the week as a balance. A student's statement: warm statement stock, ruled
   lines, dotted leaders, one double-ruled answer, a perforation and a torn foot. Red is Knowlu's
   (the wordmark's red), used for the one primary action per screen, focus and the answer marker. */
:root{
  --ground: oklch(0.966 0.011 80);
  --paper: oklch(0.994 0.004 85);
  --sunk: oklch(0.945 0.013 78);
  --ink: oklch(0.235 0.012 40);
  --ink-2: oklch(0.43 0.015 50);
  --ink-3: oklch(0.60 0.013 60);
  --rule: oklch(0.885 0.012 75);
  --rule-2: oklch(0.79 0.015 70);
  --rule-total: oklch(0.30 0.012 40);
  --brand: oklch(0.525 0.150 24);
  --brand-hover: oklch(0.465 0.145 24);
  --brand-ink: oklch(0.99 0.005 85);
  --brand-text: oklch(0.47 0.150 24);
  --brand-soft: oklch(0.948 0.026 32);
  --hl: oklch(0.945 0.075 98);
  --hl-ink: oklch(0.40 0.06 90);
  --tint-bio: oklch(0.925 0.045 155);  --tint-bio-ink: oklch(0.45 0.10 155);
  --tint-chem: oklch(0.925 0.045 305); --tint-chem-ink: oklch(0.45 0.11 305);
  --tint-cs: oklch(0.925 0.045 230);   --tint-cs-ink: oklch(0.45 0.10 230);
  --tint-span: oklch(0.925 0.06 80);   --tint-span-ink: oklch(0.47 0.10 75);
  --tint-eng: oklch(0.925 0.045 120);  --tint-eng-ink: oklch(0.45 0.09 120);
  --tint-other: oklch(0.925 0.012 70); --tint-other-ink: oklch(0.45 0.02 60);
  --grade-a: oklch(0.50 0.09 165); --grade-b: oklch(0.45 0.07 250); --grade-c: oklch(0.55 0.11 75); --grade-d: oklch(0.42 0.02 50);
  --ring-track: oklch(0.90 0.010 75);
  --sans: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --serif: "Source Serif 4", Georgia, serif;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground: oklch(0.205 0.008 50); --paper: oklch(0.245 0.009 50); --sunk: oklch(0.225 0.008 50);
  --ink: oklch(0.95 0.008 80); --ink-2: oklch(0.80 0.012 75); --ink-3: oklch(0.62 0.012 70);
  --rule: oklch(0.34 0.010 55); --rule-2: oklch(0.44 0.012 60); --rule-total: oklch(0.85 0.010 80);
  --brand: oklch(0.64 0.15 26); --brand-hover: oklch(0.70 0.14 26); --brand-ink: oklch(0.18 0.02 30);
  --brand-text: oklch(0.76 0.12 28); --brand-soft: oklch(0.31 0.05 28);
  --hl: oklch(0.36 0.06 95); --hl-ink: oklch(0.88 0.08 95);
  --tint-bio: oklch(0.31 0.05 155);  --tint-bio-ink: oklch(0.84 0.08 155);
  --tint-chem: oklch(0.31 0.05 305); --tint-chem-ink: oklch(0.84 0.08 305);
  --tint-cs: oklch(0.31 0.05 230);   --tint-cs-ink: oklch(0.84 0.08 230);
  --tint-span: oklch(0.31 0.05 80);  --tint-span-ink: oklch(0.86 0.08 80);
  --tint-eng: oklch(0.31 0.05 120);  --tint-eng-ink: oklch(0.84 0.08 120);
  --tint-other: oklch(0.31 0.012 60);--tint-other-ink: oklch(0.84 0.02 70);
  --grade-a: oklch(0.78 0.09 165); --grade-b: oklch(0.78 0.08 250); --grade-c: oklch(0.82 0.10 75); --grade-d: oklch(0.75 0.02 60);
  --ring-track: oklch(0.34 0.01 55);
  color-scheme: dark;
}}
:root[data-theme="dark"]{
  --ground: oklch(0.205 0.008 50); --paper: oklch(0.245 0.009 50); --sunk: oklch(0.225 0.008 50);
  --ink: oklch(0.95 0.008 80); --ink-2: oklch(0.80 0.012 75); --ink-3: oklch(0.62 0.012 70);
  --rule: oklch(0.34 0.010 55); --rule-2: oklch(0.44 0.012 60); --rule-total: oklch(0.85 0.010 80);
  --brand: oklch(0.64 0.15 26); --brand-hover: oklch(0.70 0.14 26); --brand-ink: oklch(0.18 0.02 30);
  --brand-text: oklch(0.76 0.12 28); --brand-soft: oklch(0.31 0.05 28);
  --hl: oklch(0.36 0.06 95); --hl-ink: oklch(0.88 0.08 95);
  --tint-bio: oklch(0.31 0.05 155);  --tint-bio-ink: oklch(0.84 0.08 155);
  --tint-chem: oklch(0.31 0.05 305); --tint-chem-ink: oklch(0.84 0.08 305);
  --tint-cs: oklch(0.31 0.05 230);   --tint-cs-ink: oklch(0.84 0.08 230);
  --tint-span: oklch(0.31 0.05 80);  --tint-span-ink: oklch(0.86 0.08 80);
  --tint-eng: oklch(0.31 0.05 120);  --tint-eng-ink: oklch(0.84 0.08 120);
  --tint-other: oklch(0.31 0.012 60);--tint-other-ink: oklch(0.84 0.02 70);
  --grade-a: oklch(0.78 0.09 165); --grade-b: oklch(0.78 0.08 250); --grade-c: oklch(0.82 0.10 75); --grade-d: oklch(0.75 0.02 60);
  --ring-track: oklch(0.34 0.01 55);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums}
::selection{background:var(--hl);color:var(--ink)}
input,textarea{caret-color:var(--brand)}
*{scrollbar-width:thin;scrollbar-color:var(--rule-2) transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--rule-2);border-radius:10px;border:3px solid var(--ground)}
a{color:inherit;text-underline-offset:3px;text-decoration-thickness:1px;text-decoration-color:var(--ink-3)}
h1,h2,h3,p{margin:0}
h1{font:600 26px/32px var(--serif);letter-spacing:-0.012em;text-wrap:balance}
h2{font:600 19px/24px var(--serif);letter-spacing:-0.005em;text-wrap:balance}
h3{font-size:13px;line-height:18px;font-weight:600;letter-spacing:0.01em}
.fig{font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum","lnum"}
.ink2{color:var(--ink-2)}
.small{font-size:14px;line-height:20px}
.xs{font-size:12.5px;line-height:17px}
:focus{outline:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.wm{height:18px;width:auto;display:block}
:root[data-theme="dark"] .wm{background:oklch(0.97 0.004 85);padding:3px 5px;border-radius:2px;box-sizing:content-box}

/* buttons: one red primary per screen; secondaries are ruled ink */
.btn{font:600 15px/20px var(--sans);border-radius:4px;padding:10px 18px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;transition:background .15s var(--ease),border-color .15s var(--ease),box-shadow .15s var(--ease)}
.btn.primary{background:var(--brand);color:var(--brand-ink);box-shadow:0 1px 2px oklch(0.3 0.08 24 / .25)}
.btn.primary:hover{background:var(--brand-hover)}
.btn.secondary{background:var(--paper);color:var(--ink);border-color:var(--rule-2);font-weight:500}
.btn.secondary:hover{border-color:var(--ink-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{font-size:14px;padding:6px 12px}
.link{background:none;border:0;padding:2px 0;font:inherit;color:var(--ink);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;text-decoration-color:var(--ink-3)}
.link:hover{text-decoration-color:var(--ink);text-decoration-thickness:2px}
.quiet{background:none;border:0;padding:2px 0;font:inherit;color:var(--ink-2);cursor:pointer;text-decoration:underline;text-decoration-color:var(--rule-2);text-underline-offset:3px}
.quiet:hover{color:var(--ink);text-decoration-color:var(--ink-2)}
.inlinebtn{font:500 12.5px/16px var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--rule-2);border-radius:3px;padding:2px 8px;cursor:pointer;margin-left:8px;white-space:nowrap}
.inlinebtn:hover{border-color:var(--ink-2)}
.inlinebtn.red{color:var(--brand-text);border-color:color-mix(in oklch,var(--brand) 45%,var(--rule-2))}

/* ============ onboarding shell ============ */
.ob{height:100vh;display:flex;flex-direction:column}
.obbar{height:56px;flex:none;display:flex;align-items:center;gap:28px;padding:0 32px;border-bottom:1px solid var(--rule)}
.map{display:flex;align-items:center;list-style:none;margin:0;padding:0;font-size:13px;line-height:16px;color:var(--ink-2);flex:1;min-width:0}
.map li{display:flex;align-items:center;gap:5px;white-space:nowrap;height:56px}
.map li+li::before{content:"";width:12px;height:1px;background:var(--rule-2);margin:0 9px}
.map li.done{color:var(--ink-2)}
.map li.done svg{width:13px;height:13px}
.map li.now{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--brand)}
.map li.skipped span{text-decoration:line-through;text-decoration-color:var(--ink-3)}
.map li.end{color:var(--ink);font-family:var(--serif);font-weight:600;font-size:14px}
.left-time{font-size:13px;color:var(--ink-2);white-space:nowrap;flex:none}
.obbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);overflow:hidden}
.obbody.split{grid-template-columns:minmax(0,520px) minmax(0,1fr)}
.step{min-height:0;overflow:auto;display:flex;flex-direction:column;padding:32px 48px 32px 56px}
.step>.inner{margin:auto 0;display:flex;flex-direction:column;gap:18px}
.centered .step{align-items:center}
.centered .step>.inner{width:min(600px,100%)}
.benefit{font-size:17px;line-height:26px;color:var(--ink);max-width:60ch}
.say{font-size:15px;line-height:23px;color:var(--ink-2);max-width:60ch}
.privacy{display:flex;gap:8px;font-size:14px;line-height:20px;color:var(--ink-2);max-width:60ch}
.privacy svg{margin-top:2px}
.foot{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:4px}
.skipcost{font-size:14px;line-height:20px;color:var(--ink-2);max-width:54ch}
.skipcost b{font-weight:600;color:var(--ink)}
.proof{border-top:1px solid var(--rule-total);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.proof .pl{display:flex;gap:10px;align-items:baseline;font-size:15px;line-height:22px}
.proof .pl svg{color:var(--brand-text);flex:none;align-self:center}
.proof .pl b{font-weight:600}
.resume{border-top:2px solid var(--brand);background:var(--paper);padding:12px 14px;font-size:14px;line-height:20px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 1px 3px oklch(0.3 0.02 50 / .08)}
.resume svg{margin-top:2px;color:var(--brand-text)}
.ahead-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule-total)}
.ahead-list li{display:grid;grid-template-columns:150px 1fr auto;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px;line-height:20px;align-items:baseline}
.ahead-list li b{font-weight:600}
.ahead-list .fig{color:var(--ink-2)}
.fieldrow{display:flex;flex-direction:column;gap:6px}
label.lab{font-size:14px;font-weight:500}
.input{font:400 15px/20px var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--rule-2);border-radius:4px;padding:10px 12px;width:100%}
.input::placeholder{color:var(--ink-2)}
.input:focus-visible{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}
.input.err{border-color:var(--brand)}
.errline{display:flex;gap:8px;font-size:14px;line-height:20px;color:var(--ink)}
.errline svg{color:var(--brand-text);margin-top:2px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:20px}
.check input{accent-color:var(--brand);width:16px;height:16px;margin-top:2px}

/* the one enclosed treatment: credential moments only */
.secure{border:1px solid var(--rule-total);border-radius:6px;background:var(--paper);padding:16px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 2px 8px -2px oklch(0.3 0.02 50 / .10)}
.secure-head{display:flex;align-items:center;gap:8px;font-size:13px;line-height:16px;font-weight:600;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.secure-head .xs{font-weight:400;color:var(--ink-2);margin-left:auto}
.needlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:22px}
.needlist li{display:flex;gap:10px}
.needlist li svg{margin-top:3px;color:var(--ink-2)}

/* notices: the notch is the needs-you shape */
.notice{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px solid var(--rule-2);border-radius:4px;background:var(--paper);font-size:14px;line-height:20px}
.notice.notch{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,0 66%,8px 50%,0 34%);padding-left:20px;background:var(--brand-soft);border-color:transparent}
.notice.notch>svg{color:var(--brand-text);margin-top:2px}
.notice b{font-weight:600}

/* simulated windows: the school's sign-in, the phone, checkout */
.winwrap{position:fixed;inset:0;background:color-mix(in oklch,var(--ink) 28%,transparent);display:flex;align-items:center;justify-content:center;gap:40px;z-index:5}
.win{width:540px;background:#fff;color:oklch(0.22 0.01 250);border:1px solid oklch(0.80 0.01 250);border-radius:8px;box-shadow:0 22px 50px -14px oklch(0.2 0.02 50 / .45),0 2px 6px oklch(0.2 0.02 50 / .15);overflow:hidden}
.wintitle{display:flex;align-items:center;gap:10px;padding:8px 12px;background:oklch(0.95 0.004 250);border-bottom:1px solid oklch(0.88 0.006 250);font:400 12px/16px var(--sans);color:oklch(0.40 0.01 250)}
.addr{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid oklch(0.86 0.006 250);border-radius:5px;padding:4px 8px;flex:1;font-size:12.5px;color:oklch(0.22 0.01 250)}
.addr b{font-weight:600}
.schoolpage{padding:28px 40px 30px;display:flex;flex-direction:column;gap:14px;font-family:Georgia,"Times New Roman",serif}
.schoolpage .crest{font:600 13px/16px var(--sans);letter-spacing:.04em;color:oklch(0.35 0.06 150);display:flex;align-items:center;gap:8px}
.schoolpage .crest i{width:22px;height:22px;border-radius:4px;background:oklch(0.35 0.06 150);display:inline-block}
.schoolpage h2{font:400 22px/28px Georgia,serif}
.schoolpage .input{font-family:var(--sans);background:#fff;color:oklch(0.22 0.01 250);border-color:oklch(0.80 0.01 250)}
.schoolbtn{background:oklch(0.35 0.06 150);color:#fff;border:0;border-radius:4px;padding:10px 16px;font:600 14px var(--sans);cursor:pointer}
.schoolbtn.ghost{background:none;color:oklch(0.35 0.06 150);text-decoration:underline;padding:4px 0}
.winnote{border-top:1px solid oklch(0.88 0.006 250);padding:12px 16px;background:oklch(0.97 0.004 250);font:400 13px/18px var(--sans);color:oklch(0.38 0.01 250);display:flex;gap:8px}
.phone{width:220px;height:420px;border-radius:30px;background:oklch(0.20 0.01 250);padding:12px;box-shadow:0 22px 50px -14px oklch(0.2 0.02 50 / .5);flex:none}
.phone .scr{background:oklch(0.97 0.004 250);border-radius:20px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;font:400 13px/18px var(--sans);color:oklch(0.25 0.01 250);text-align:center}
.phone .scr b{font-size:15px;font-weight:600}
.phone .scr .ok{background:oklch(0.48 0.12 150);color:#fff;border:0;border-radius:20px;padding:10px 0;width:100%;font:600 14px var(--sans);cursor:pointer}
.phone .scr .no{background:#fff;color:oklch(0.35 0.01 250);border:1px solid oklch(0.80 0.01 250);border-radius:20px;padding:9px 0;width:100%;font:500 14px var(--sans);cursor:pointer}
.phone .cap{font:400 12px/16px var(--sans);color:var(--ink);text-align:center;margin-top:10px}
.checkout{padding:26px 34px 28px;display:flex;flex-direction:column;gap:12px;font-family:var(--sans)}
.checkout .row2{display:flex;justify-content:space-between;font-size:14px;border-bottom:1px solid oklch(0.90 0.006 250);padding:8px 0}
.checkout .paybtn{background:oklch(0.30 0.02 250);color:#fff;border:0;border-radius:6px;padding:12px;font:600 15px var(--sans);cursor:pointer}

/* ============ the statement (the ledger) ============ */
.ledgerpane{min-height:0;overflow:auto;padding:24px 40px 24px 8px;display:flex;flex-direction:column}
.ledgerpane>.sheetwrap{margin:auto 0}
.sheetwrap{filter:drop-shadow(0 1px 1px oklch(0.3 0.02 50 / .08)) drop-shadow(0 8px 14px oklch(0.3 0.02 50 / .10));width:100%;max-width:660px}
.sheet{background:var(--paper);padding-bottom:20px;
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 6px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/12px 6px repeat-x;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - 6px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/12px 6px repeat-x}
.sheet-head{padding:16px 24px 10px;display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--rule-total)}
.sheet-head h2{font-size:19px;line-height:24px}
.sheet-head .sub{font-size:12.5px;color:var(--ink-2);margin-left:auto;white-space:nowrap}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 50px 80px;column-gap:8px;align-items:baseline}
.sect{padding:12px 24px 2px;font-size:12px;line-height:16px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.sect span:nth-child(2),.sect span:nth-child(3){text-align:right;font-weight:500}
.ln{padding:3px 24px;font-size:14px;line-height:20px;min-height:26px;position:relative}
.ln .lbl{display:flex;align-items:baseline;min-width:0}
.ln .tx{min-width:0}
.ln .tx b{font-weight:500}
.ln .tx .d{color:var(--ink-2)}
.ln .ldr{flex:1 1 16px;min-width:14px;align-self:flex-end;border-bottom:1.5px dotted var(--rule-2);margin:0 0 5px 8px}
.ln .n,.ln .h{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum","lnum"}
.ln .state{font-size:12px;color:var(--ink-2);font-variant-numeric:normal}
.ln.muted .tx b,.ln.muted .h{color:var(--ink-2);font-weight:400}
.ln.struck .tx b{font-weight:500}
.ln .titles{display:block;font-size:12.5px;line-height:17px;color:var(--ink-2)}
.ln .titles s{text-decoration-color:var(--ink-3)}
.ln.total{margin:4px 24px 0;padding:6px 0 2px;border-top:1px solid var(--rule-total);font-weight:600}
.ln.total .tx b{font-weight:600}
.ln.answer{margin:10px 24px 0;padding:8px 0 4px;border-top:1px solid var(--rule-total)}
.ln.answer .tx b{font:600 16px/22px var(--serif)}
.ln.answer .h{font-weight:700;font-size:16px}
.ln.answer .h span{border-bottom:3px double var(--rule-total);padding-bottom:1px}
.ln.answer .h .state{border:0}
.ln .why2{display:block;font-size:12.5px;line-height:17px;color:var(--ink-2);font-weight:400;font-family:var(--sans)}
.ln.fresh .tx b{background:linear-gradient(transparent 52%,var(--hl) 52%,var(--hl) 92%,transparent 92%);box-decoration-break:clone;-webkit-box-decoration-break:clone}
.newtag{font-size:11.5px;line-height:16px;font-weight:600;color:var(--hl-ink);margin-left:6px;white-space:nowrap}
.ln.pending .tx b{color:var(--ink-2);font-weight:500}
.ln.needs{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,0 70%,8px 50%,0 30%);background:var(--brand-soft);margin:2px 0}
.ln.needs .state{color:var(--brand-text);font-weight:600}
.perf{position:relative;height:16px;margin:14px 0 0;background:radial-gradient(circle,var(--ground) 2.6px,transparent 3px) 4px 50%/10px 10px repeat-x}

const dots = (label = 'reading') => `<span class="dots" role="img" aria-label="${label}"><i></i><i></i><i></i></span>`;

/* ===================== the week, computed from the sample ===================== */
const T = D.today, RV = D.reveal;
const hrs = t => { const [h, m] = t.split(':').map(Number); return h + m / 60; };
const hm = t => { const [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'pm' : 'am'; const hh = ((h + 11) % 12) + 1; return m ? `${hh}:${String(m).padStart(2, '0')} ${ap}` : `${hh} ${ap}`; };
const AWAKE = hrs(D.planning_day.bed) - hrs(D.planning_day.wake);
const dur = b => hrs(b.end) - hrs(b.start);
const isClass = b => b.kind === 'class' || b.kind === 'lab';
const counts = b => b.level !== 'optional';
const RECUR = ['work', 'club'];
const SRC = Object.fromEntries(D.assignments.map(a => [a.title, a.source]));
/* one week of days -> the statement's figures. cal=false: the calendar isn't read (yet). */
function weekOf(days, o = {}) {
  const { cal = true, vhl = true } = o;
  const rows = days.map(d => {
    const classes = d.blocks.filter(b => isClass(b));
    const mine = d.blocks.filter(b => !isClass(b) && b.kind !== 'office hours');
    const busy = classes.reduce((a, b) => a + dur(b), 0) + (cal ? mine.filter(counts).reduce((a, b) => a + dur(b), 0) : 0);
    const due = d.due.filter(x => vhl || SRC[x.title] !== 'VHL');
    return { d, classes, mine: cal ? mine : [], open: AWAKE - busy, due, dueH: due.reduce((a, b) => a + b.estimate_hours, 0) };
  });
  const open = rows.reduce((a, r) => a + r.open, 0), dueH = rows.reduce((a, r) => a + r.dueH, 0);
  const tight = rows.reduce((m, r) => (r.dueH / r.open > m.dueH / m.open ? r : m), rows[0]);
  return { rows, open, dueH, tight };
}
const W0 = weekOf(RV.week);
const classH = W0.rows.reduce((a, r) => a + r.classes.reduce((x, b) => x + dur(b), 0), 0);
const recurH = W0.rows.reduce((a, r) => a + r.mine.filter(b => counts(b) && RECUR.includes(b.kind)).reduce((x, b) => x + dur(b), 0), 0);
const onceH = W0.rows.reduce((a, r) => a + r.mine.filter(b => counts(b) && !RECUR.includes(b.kind)).reduce((x, b) => x + dur(b), 0), 0);
const thisWeek = src => RV.week.flatMap(d => d.due).filter(x => SRC[x.title] === src);
const hSum = arr => arr.reduce((a, b) => a + b.estimate_hours, 0);
const TURNED = D.assignments.filter(a => /imported-done/.test(a.state_at_onboarding || ''));
const turned = src => TURNED.filter(a => a.source === src).map(a => a.title);
const LIVE_BB = 22, LIVE_ZY = 5, LIVE_VHL = 4, STUDY = 3;
const fmtDay = (iso, opt = { weekday: 'long', month: 'long', day: 'numeric' }) => new Date(iso.slice(0, 10) + 'T12:00').toLocaleDateString('en-US', opt);

/* ===================== the statement: one week, time against work ===================== */
const ST = ['school-wait', 'school-reading', 'school', 'paid', 'email', 'google', 'sites', 'syllabi', 'week', 'wait', 'done'];
const at = (s, k) => ST.indexOf(s) >= ST.indexOf(k);
const before = (s, k) => !at(s, k);
const half = x => (Number.isInteger(x) ? x : x.toFixed(1)) + 'h';

function ledger(stage, v = {}) {
  v = Object.assign({ vhl: 'ok', google: 'ok', email: 'ok', school: 'ok', feed: false, checkable: false, classesChecked: false }, v);
  if (stage === 'school-wait') return sheet([], [], stage, v, `<div class="ln" style="padding:22px 24px 10px;color:var(--ink-2);font-size:14px;line-height:21px;display:block">This is your week, Monday to Sunday. As ${esc(D.school.short)} is read, it fills in two sides: what takes your time, and the work due. The two are weighed day by day only when you finish.</div>`);
  const L = [], B = [];
  const fr = (...ks) => !v.quiet && ks.includes(stage);
  const reading = stage === 'school-reading';
  const cal = at(stage, 'google') && v.google === 'ok';
  const hs = settle => before(stage, 'paid') ? '' : before(stage, settle) ? 'est' : 'num';

  // ---- your time
  L.push({ sect: 'What takes your time', n: '', h: 'hours' });
  L.push({ lbl: 'Awake', d: `${hm(D.planning_day.wake)} to ${hm(D.planning_day.bed)}, 7 days · Knowlu's default`, fresh: fr('school-reading'), btn: at(stage, 'school') ? { label: 'Change', go: 'o10-your-week' } : null });
  let taken = 0;
  if (reading) B.push({ reading: true, lbl: 'Class times', d: 'from the registrar' });
  else if (v.feed) B.push({ pending: true, st: 'not read', lbl: 'Class times', d: 'need the school sign-in; asked at Check it instead' });
  else {
    const c = at(stage, 'week') || v.classesChecked;
    taken += rH(classH);
    L.push({ lbl: 'Classes', d: '7 meetings, from the registrar', h: rH(classH), neg: true, found: !c, committed: c, fresh: fr('school', 'week'), check: !c && v.checkable });
  }
  if (cal) {
    const c = at(stage, 'week');
    taken += rH(recurH) + rH(onceH);
    L.push({ lbl: 'Library job, Pre-Health Society', d: 'repeating, from Google Calendar', h: rH(recurH), neg: true, found: !c, committed: c, fresh: fr('google', 'week') });
    L.push({ lbl: 'This week only', d: 'haircut Thursday, family call Sunday', h: rH(onceH), neg: true, fresh: fr('google') });
    L.push({ lbl: 'Intramural soccer', d: 'optional, so not taken out', muted: true, fresh: fr('google') });
  }
  const noCal = at(stage, 'google') && v.google !== 'ok';

  // ---- work due this week
  L.push({ sect: 'Work due this week', n: 'items', h: 'hours, about' });
  const srcs = [];
  if (reading) B.unshift({ reading: true, lbl: 'Blackboard', d: 'assignments this term' });
  else if (v.feed) srcs.push({ lbl: `${D.school.lms} calendar link`, d: 'due dates only; some may be turned in already', n: thisWeek('Blackboard').length, h: '', fresh: true });
  else {
    const bb = thisWeek('Blackboard'), s = hs('google');
    srcs.push({ lbl: D.school.lms, d: 'BIO 201, CHEM 231, ENG 210', n: bb.length, h: s === 'num' ? hSum(bb) : s, fresh: fr('school', 'google') });
  }
  if (at(stage, 'sites')) {
    const s = hs('syllabi'), zy = thisWeek('zyBooks'), vh = thisWeek('VHL');
    srcs.push({ lbl: 'zyBooks', d: zy.map(x => x.title).join(', '), n: zy.length, h: s === 'num' ? hSum(zy) : s, fresh: fr('sites', 'syllabi') });
    if (v.vhl === 'ok') srcs.push({ lbl: 'VHL', d: 'Lección 5, two sets', n: vh.length, h: s === 'num' ? hSum(vh) : s, fresh: fr('sites', 'syllabi') });
  }
  srcs.forEach(x => L.push(x));
  const settled = srcs.length && srcs.every(x => typeof x.h === 'number');
  const due = srcs.reduce((a, x) => a + (typeof x.h === 'number' ? x.h : 0), 0);
  if (srcs.length) L.push({ total: true, lbl: settled && at(stage, 'syllabi') ? 'Work due' : 'Work due, so far', n: srcs.reduce((a, x) => a + x.n, 0), h: settled ? due : '', fresh: fr('school', 'google', 'syllabi') });

  // ---- the answer: open time less the work due, same week
  if (!reading && !v.feed) {
    L.push({ answer: true, lbl: 'Each day, work against open time', hstate: 'at the end',
      why: before(stage, 'paid') ? 'Hours are estimated once your trial starts. The days are weighed when everything is read.'
        : 'Weighed day by day when everything is read, so no day is judged on half the picture.' });
  }

  // ---- after this week, and turned in (counts only: never judged, never a task)
  if (at(stage, 'school') && !v.feed) {
    const parts = [[D.school.lms, LIVE_BB - thisWeek('Blackboard').length]];
    if (at(stage, 'sites')) { parts.push(['zyBooks', LIVE_ZY - 1]); if (v.vhl === 'ok') parts.push(['VHL', LIVE_VHL - 2]); }
    if (at(stage, 'syllabi')) parts.push(['exam study', STUDY]);
    if (cal) parts.push(['Gmail', 1]);
    L.push({ sect: 'After this week', n: 'items', h: '' });
    L.push({ lbl: 'Due through December 4', d: parts.map(p => `${p[0]} ${p[1]}`).join(' · '), n: parts.reduce((a, p) => a + p[1], 0), fresh: fr('school', 'google', 'sites', 'syllabi') });
    let tt = turned('Blackboard');
    if (at(stage, 'sites')) { tt = tt.concat(turned('zyBooks')); if (v.vhl === 'ok') tt = tt.concat(turned('VHL')); }
    L.push({ sect: 'Already turned in, never a task', n: 'items', h: '' });
    L.push({ lbl: before(stage, 'paid') ? 'Turned in; archived when your trial starts' : 'Turned in; archived', n: tt.length, titles: tt, fresh: fr('school', 'paid', 'sites'), nolead: false });
  }
  // ---- also read (one line)
  if (at(stage, 'school') && !v.feed) {
    const a = ['grades for 5 courses', stage === 'wait' ? 'syllabi 4 of 5 read' : before(stage, 'syllabi') ? 'syllabi 4 of 5 found' : 'syllabi 5 of 5 read'];
    if (at(stage, 'email') && v.email === 'ok') a.push('school email, forwarding on');
    if (cal) a.push('Gmail, 40 messages');
    L.push({ sect: 'Also read', n: '', h: '' });
    L.push({ lbl: a.join(' · '), plain: true, fresh: fr('email') });
  }

  // ---- under the perforation
  if (reading) { B.push({ reading: true, lbl: 'Grades' }); B.push({ reading: true, lbl: 'Syllabi', d: `looking in ${D.school.lms}` }); }
  if (at(stage, 'school') && !v.feed) {
    if (stage === 'wait') B.push({ reading: true, lbl: 'Syllabi', d: "reading CS 110's file" });
    else if (before(stage, 'syllabi')) B.push({ reading: true, lbl: 'Syllabi', d: '4 found · reading them' });
  }
  if (v.feed) B.push({ pending: true, st: 'not read', lbl: 'Grades, syllabi, turned-in work', d: 'need the school sign-in' });
  if (at(stage, 'email')) {
    if (v.email === 'skipped') B.push({ pending: true, lbl: 'School email', d: 'would add date changes your professors announce' });

  }

  return sheet(L, B, stage, v);
}

function lineHTML(o) {
  if (o.sect) return `<div class="sect cols"><span>${esc(o.sect)}</span><span>${esc(o.n)}</span><span>${esc(o.h)}</span></div>`;
  const cls = ['ln', 'cols', o.pending && 'pending', o.needs && 'needs', o.total && 'total', o.answer && 'answer', o.fresh && 'fresh', o.muted && 'muted'].filter(Boolean).join(' ');
  let n = o.n ?? '', h = '';
  if (o.reading) { n = `<span class="state">reading</span>`; h = dots(); }
  else if (o.still) { n = `<span class="state">still coming</span>`; h = dots('still coming'); }
  else if (o.pending) n = `<span class="state">${esc(o.st || 'skipped')}</span>`;
  else if (o.needs) n = `<span class="state">needs you</span>`;
  else if (o.hstate) h = `<span class="state">${esc(o.hstate)}</span>`;
  else if (o.h === 'est') h = dots('estimating');
  else if (typeof o.h === 'number') h = (o.neg ? '−' : '') + (o.answer || o.total ? half(o.h) : fmtH(o.h));
  if (o.answer && h && !o.hstate) h = `<span>${h}</span>`;
  const d = o.d ? ` <span class="d">· ${esc(o.d)}</span>` : '';
  const st = o.found ? ' <span class="state">· found</span>' : o.committed ? ' <span class="state">· confirmed</span>' : '';
  const nt = o.fresh && !o.total && !o.answer ? `<span class="newtag">just read</span>` : '';
  const chk = o.check ? `<button class="inlinebtn" data-check>Check them</button>` : '';
  const btn = o.btn ? `<button class="inlinebtn ${o.btn.cls || ''}" data-go="${o.btn.go}">${esc(o.btn.label)}</button>` : '';
  const titles = o.titles ? `<span class="titles">${o.titles.slice(0, 4).map(t => `<s>${esc(t)}</s>`).join(' · ')}${o.titles.length > 4 ? ` · and ${o.titles.length - 4} more` : ''}</span>` : '';
  const why = o.why ? `<span class="why2">${esc(o.why)}</span>` : '';
  const ldr = o.plain || o.pending || o.needs || o.reading || o.still ? '' : '<span class="ldr" aria-hidden="true"></span>';
  const label = o.plain ? `<span class="d" style="color:var(--ink-2)">${esc(o.lbl)}</span>` : `<b>${esc(o.lbl)}</b>`;
  if (o.answer && o.hstate) return `<div class="${cls}"><span><span class="lbl"><span class="tx"><b>${esc(o.lbl)}</b></span><span class="ldr" aria-hidden="true"></span></span>${why}</span><span class="h" style="grid-column:2/4">${h}</span></div>`;
  return `<div class="${cls}"><span><span class="lbl"><span class="tx">${label}${d}${st}${nt}${chk}${btn}</span>${ldr}</span>${titles}${why}</span><span class="n">${n}</span><span class="h">${h}</span></div>`;
}

function sheet(L, B, stage, v, empty) {
  const head = `<div class="sheet-head"><h2>Your week</h2><span class="sub">${v.feed ? 'From the calendar link · ' : ''}Mon, Oct 19 to Sun, Oct 25 · week 9 of 16</span></div>`;
  const wrap = inner => `<div class="sheetwrap"><section class="sheet" aria-label="Your week: time against work">${inner}</section></div>`;
  if (empty) return wrap(`${head}${empty}<div class="perf" aria-hidden="true"></div><div class="below-h">Being read now</div><div class="ln cols"><span class="lbl"><span class="tx"><b>${esc(D.school.short)}</b> <span class="d">· waiting for your sign-in</span></span></span><span></span><span></span></div>`);
  const kept = L.filter((x, i) => !x.sect || (L[i + 1] && !L[i + 1].sect));
  const bl = B.length ? B.map(lineHTML).join('') : `<div class="ln cols"><span class="tx" style="color:var(--ink-2)">Nothing still being read.</span><span></span><span></span></div>`;
  const foot = before(stage, 'paid') ? `Counted on this computer from what ${esc(D.school.short)} shows. Hours are estimated once your trial starts; nothing is judged before then.`
    : stage === 'done' ? "Hours are Knowlu's estimates. Time comes from your class times and calendar. Turned-in work is archived, never a task."
    : 'Hours fill in as each place is estimated. Time comes from your class times and calendar, never a guess.';
  return wrap(`${head}${kept.map(lineHTML).join('')}<div class="perf" aria-hidden="true"></div><div class="below-h">Still being read, skipped, or waiting for you</div>${bl}<div class="sheet-foot">${foot}</div>`);
}

      ${v.stillOpen === i ? `<div style="grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:6px"><span class="small">When will you turn it in?</span>${['Today', 'Tomorrow', 'Wednesday', 'Pick a day'].map(x => `<button class="inlinebtn" style="margin:0">${x}</button>`).join('')}</div>` : ''}</div>`).join('')}</div>`;
  out += `<div class="grp">${grpH('Later', later.length, later.reduce((a, b) => a + b.remaining_hours, 0) + 2.2, `<button class="r link small" aria-expanded="false">Show</button>`)}</div>`;
  const closed = T.closed_this_week;
  out += `<div class="grp" id="closed">${grpH('Closed this week', closed.length, null, `<button class="r link small" aria-expanded="${!!v.closedOpen}">${v.closedOpen ? 'Hide' : 'Show'}</button>`)}${v.closedOpen ? closed.map(c => {
    const undone = v.undone === c.id;
    return `<div class="closedrow"><span${undone ? '' : ' style="text-decoration:line-through;text-decoration-color:var(--ink-3)"'}>${esc(c.title)} <span class="xs ink2">· ${esc(c.course)}</span></span>
      <span class="who">${undone ? 'back on your list' : c.by === 'Knowlu' ? `Knowlu · ${esc(c.how)}` : 'you'}</span>
      ${c.undo ? (undone ? `<button class="link small">Mark done again</button>` : `<button class="link small" data-undo="${c.id}">${I.undo} Undo</button>`) : '<span></span>'}</div>`;
  }).join('') : ''}</div>`;
  return out;
}
function side(v = {}) {
  const sched = v.sched || [
    ['8:15', '', 'open', '8:15–9:00 am'], ['9:00', 'BIO 201 lecture', 'Cell Biology', 'Kessler Hall 104'], ['10:00', 'SPAN 202 lecture', 'Spanish', 'Bellamy Hall 212'],
    ['10:50', '', 'open', '10:50 am–1:00 pm'], ['1:00', 'CS 110 lecture', 'Programming', 'Ostrander 140'], ['2:15', '', 'open', '2:15–11:30 pm'], ['3:30', 'CHEM 231 office hours', 'opt', 'optional']];
  const tl = sched.map(([t, title, dom, room]) => dom === 'open' ? `<span class="t">${t}</span><span class="b open">open · ${room}</span>`
    : `<span class="t">${t}</span><span class="b ${dom === 'opt' ? 'opt' : ''}" style="${dom === 'opt' ? '' : `background:var(--tint-${tint(dom)})`}">${esc(title)}<span class="rm">${esc(room)}</span></span>`).join('');
  const s = D.decisions.find(d => d.id === 'd-surf'), m = D.emails.find(e => e.id === s.evidence_email);
  const W = weekOf(D.week.days.map(d => Object.assign({}, d, { due: [] })));
  const ah = T.ahead_14_days.slice(0, 7);
  const dueW = ah.reduce((a, d) => a + d.hours_due, 0), openW = rH(W.open);
  const ti = ah.reduce((b, d, i) => d.hours_due / W.rows[i].open > ah[b].hours_due / W.rows[b].open ? i : b, 0);
  const wk = W.rows.map((r, i) => `<span class="${i === 0 ? 'today' : ''}">${ah[i].weekday}</span>${wbar(r.open, ah[i].hours_due)}<span class="num">${fmtH(ah[i].hours_due) || '0h'}</span><span class="num">${fmtH(r.open)}</span>`).join('');
  return `<section aria-label="Today's schedule"><h3>Today</h3>
      ${v.freeLine ? `<p class="freehead">${v.freeLine}</p>` : `<div class="daybal" aria-label="Today's balance"><span>Open today</span><span class="ldr"></span><b>12h</b><span>Must do</span><span class="ldr"></span><b>−4.5h</b><span>Recommended</span><span class="ldr"></span><b>−2h</b><span class="tt">Open after the work</span><span class="ldr"></span><b class="tt">about 5.5h</b></div><p class="xs ink2" style="margin:-2px 0 8px">In these stretches. Knowlu doesn't set when you work.</p>`}
      <div class="tl">${tl}</div></section>
    ${v.noWeek ? '' : `<section aria-label="This week"><h3>This week <span class="ink2">Oct 26 to Nov 1</span></h3>
      <div class="wkm" role="img" aria-label="This week: about ${fmtH(dueW)} due; Friday the heaviest.">
        <span class="hd"></span><span class="hd">work due, inside open time</span><span class="hd num">due</span><span class="hd num">open</span>${wk}
        <span class="tot" style="grid-column:1/3">Tightest day: ${ah[ti].weekday}</span><span class="tot num" style="grid-column:3/5;white-space:nowrap"><span style="border-bottom:3px double var(--rule-total)">${fmtH(ah[ti].hours_due)} of ${fmtH(W.rows[ti].open)}</span></span></div>
      <p class="xs ink2" style="margin-top:6px">${esc(T.ahead_takeaway)} CHEM 231 Exam 2 is Thursday.</p></section>`}
    ${v.noGrades ? '' : `<section aria-label="Grades"><h3>Grades <span class="ink2">updated 6:02 am</span><button class="r link xs">Hide</button></h3>
      <div class="grades">${D.grades.map(g => `<button class="gr" data-go="m1-domain" aria-label="${g.course}: ${g.letter}, ${g.pct}%">${ring(g)}<span>${g.course}</span><b>${g.letter}</b><span class="num">${g.pct}%</span></button>`).join('')}</div></section>`}
    <section aria-label="Needs you"><h3>Needs you <span class="fig ink2">4 waiting · oldest 7 days</span></h3>
      <div class="decide"><p class="q">${esc(s.question)}</p><q>${esc(m.quote)}</q><span class="xs ink2">From ${esc(m.from.split('<')[0].trim())}, October 19</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap">${s.answers.map((a, i) => `<button class="btn ${i ? 'secondary' : 'primary'} sm">${esc(a)}</button>`).join('')}<button class="quiet small" style="margin-left:auto">Not now</button></div></div></section>`;
}
const L6 = byId('t-cs-lab6');
const m1main = (v = {}) => `${v.pre || ''}${nextBlock(L6)}${groups(Object.assign({}, v, { mid: delta(v) + domStrip(v) }))}`;

function bindM1() {
  $$('[data-open]').forEach(b => { const f = () => location.hash = 'm1-task-open'; b.onclick = f; b.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); f(); } }; });
  $$('.row .circle').forEach(b => b.onclick = () => { const r = b.closest('.row'); const d = r.classList.toggle('done'); b.classList.toggle('on', d); if (d) toast(`${esc(r.querySelector('.title').textContent)} done. <button class="link">Undo</button>`); });
  $$('[data-undo]').forEach(b => b.onclick = () => { location.hash = 'm1-undo'; });
  $$('[data-still]').forEach(b => b.onclick = () => { location.hash = 'm1-late'; });
  $$('#closed .grp-h .link').forEach(b => b.onclick = () => { location.hash = b.getAttribute('aria-expanded') === 'true' ? 'm1-today' : 'm1-closed'; });
  document.onkeydown = e => { if (e.ctrlKey && e.key.toLowerCase() === 'k') { e.preventDefault(); $('.ask')?.focus(); } if (e.key === 'Escape' && $('.drawer')) location.hash = 'm1-today'; };
}
const scrollTo_ = (sel, off = 12) => () => { bindM1(); const el = $(sel), m = $('.main'); if (el && m) m.scrollTop = el.offsetTop - m.offsetTop - off; };

screen('m1-today', 'Main page', 'Today', () => m1({ main: m1main() }), bindM1);
screen('m1-today-dark', 'Main page', 'Today, dark', () => m1({ main: m1main() }), bindM1);

    <p class="xs ink2" style="margin-top:4px">Checking every step doesn't close the task; Knowlu asks first.</p><button class="link small">${I.plus} Add a step</button></div>
  <div class="field"><dt>Notes</dt><dd class="editable ink2" tabindex="0">Add a note</dd></div>
  <div class="actions"><button class="btn primary sm">${I.play} Lock in</button><button class="btn secondary sm">${I.pin} Pin</button><button class="quiet small">Report a problem</button><button class="quiet small">Delete</button></div></aside>`;
screen('m1-task-open', 'Main page', 'Today: a task opened', () => m1({ main: m1main({ sel: 't-chem-ex2', stepsOpen: true }), drawer: taskDrawer(ex2) }), scrollTo_('[data-id="t-chem-ex2"]', 330));
screen('m1-closed', 'Main page', 'Closed this week', () => m1({ main: m1main({ closedOpen: true }) }), scrollTo_('#late'));
screen('m1-undo', 'Main page', 'Undo on an auto-closed item', () => m1({ main: m1main({ closedOpen: true, undone: 't-chem-pq7' }) }), () => { scrollTo_('#late')(); toast(`Pre-lecture quiz: Ch. 7 is back on your list. Knowlu won't mark it done again. <button class="link">Redo</button>`); });
screen('m1-late', 'Main page', 'Late window closed', () => m1({ main: m1main({ stillOpen: 0 }) }), scrollTo_('#late'));
screen('m1-vhl', 'Main page', 'VHL needs you', () => m1({ main: m1main({ pre: `<div class="notice notch" role="status">${I.notch}<span><b>VHL signed you out.</b> Sign in again to bring in new VHL work; what Knowlu already has is still here. <button class="link">Sign in to VHL</button></span></div>` }) }), bindM1);

const chem = D.grades.find(g => g.course === 'CHEM 231'), chemD = DOMS.find(d => d.domain === 'Organic Chemistry');
const courseDrawer = () => `<aside class="drawer" aria-label="Organic Chemistry">
  <div style="display:flex;align-items:flex-start;gap:12px"><div style="flex:1"><h2>Organic Chemistry</h2><span class="small ink2">CHEM 231</span></div><button class="quiet small" data-go="m1-today">Close</button></div>

  <p class="notice">${I.behind}<span>${esc(chemD.sentence)}</span></p>
  <div><h3>Exams</h3>${D.courses.find(c => c.code === 'CHEM 231').exams.map(e => `<div class="closedrow" style="grid-template-columns:1fr;padding:6px 0"><span>${esc(e.title)} · ${fmtDay(e.date)} at ${hm(e.start)}<br><span class="xs ink2">${esc(e.room)}</span></span></div>`).join('')}</div>
  <div><h3>Grades</h3>${chem.entries.slice(0, 6).map(e => `<div class="kv"><span>${esc(e.title)}</span><span class="ldr"></span><span class="fig">${e.score != null ? `${e.score}/${e.possible}` : esc(e.status)}</span></div>`).join('')}</div>

screen('m1-domain', 'Main page', 'A course opened', () => m1({ filter: 'Organic Chemistry', main: `${domStrip({ filter: 'Organic Chemistry' })}<div class="grp">${grpH('Organic Chemistry', 3, 7.5)}${['t-chem-ps7', 't-chem-ex2', 't-chem-rw8'].map(id => rowHTML(byId(id))).join('')}</div><p class="small ink2">Showing Organic Chemistry only. Press it again to show everything.</p>`, drawer: courseDrawer() }), bindM1);

screen('m1-all-clear', 'States', 'All clear', () => m1({ when: 'Sunday, November 1', delta: '', main: `<section class="allclear"><span class="lead">Next</span><h1 class="t">Nothing is due today. The day is yours.</h1><p class="say" style="margin-top:8px">Next due: Reading: Ch. 11, Cell signaling, tomorrow at 9:00 am, about 30m.</p></section>
  ${tally({ open: 15, must: 0, rec: 0, note: 'Only your own plans today.' })}

screen('m1-spill', 'States', 'More must-do than open time', () => m1({ when: 'Wednesday, October 28', status: 'tight', main: `${nextBlock(lab7, { due: 'today at 11:59 pm', left: '2h', why: "Due tonight at 11:59 pm, and it's the largest must-do piece that's due first." })}
  ${tally({ open: 5.5, must: 6.5, over: 1, note: "Today's must-do needs about 1h more than today's open time. Knowlu shows it; it doesn't move your plans." })}
  <div class="grp">${grpH('Must do', '3 more', 4.5)}${spillMust.slice(1).map(t => rowHTML(t, t.id === 't-chem-ex2' ? { hOverride: '2h 12m', dueOverride: 'tomorrow at 9:30 am' } : { dueOverride: t.due_text.replace('Thursday', 'tomorrow') })).join('')}</div>
  ${delta({ since: 'Since 12:00 pm', deltaItems: ['CHEM 231 Recitation worksheet 8 is past due; its late window is open until Friday.'] })}`,
  side: side({ freeLine: '<b>No free time left today</b> once must-do work is counted.', sched: [['4:30', '', 'open', '4:30–6:30 pm'], ['6:30', 'Pre-Health Society', 'Pre-Health Society', 'Bryce Hall 110'], ['7:30', '', 'open', '7:30–11:30 pm']] }) }), bindM1);

screen('m1-avoided', 'States', 'A task being put off rises', () => m1({ main: m1main({ avoided: true }) }), scrollTo_('.grp'));
screen('m1-source-broken', 'States', 'A source broke', () => m1({ broken: true, main: m1main({ pre: `<div class="notice notch" role="status">${I.notch}<span><b>${D.school.lms} stopped answering at 6:02 am.</b> Knowlu tries again at 12:00 pm. What it already has is still here. <button class="link">Details</button></span></div>` }) }), bindM1);
screen('m1-offline', 'States', 'Offline', () => m1({ offline: true, main: m1main({ pre: `<div class="notice" role="status">${I.wifi}<span><b>Offline.</b> Changes stay on this computer and sync when you're back.</span></div>` }) }), bindM1);
