# cargo-deny policy (.github/workflows/security.yml runs it; docs/notes/2026-11-09-security-tooling.md).
# Knowlu is a paid, closed-source app: a dependency's licence must allow shipping it in one.

[graph]
# The release target (release.yml checks the host triple); a Linux-only dependency is not ours.
targets = ["x86_64-pc-windows-gnu", "x86_64-pc-windows-msvc"]
all-features = false

[advisories]
# Every RustSec advisory fails, unmaintained crates included; an exception is listed here with why.
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = [
    # zip: all four advisories are in ZipArchive/ZipStreamReader::extract. Reviewed 2026-11-09.
    # knowlu-engine is on zip 9.x (fixed) and only WRITES backups (engine/src/backup.rs). Only the
    # updater's copy remains (tauri-plugin-updater's zip 4.x, not ours to bump): it installs the NSIS
    # .exe on Windows, verifies the minisign signature before it opens anything, and the four are
    # Unix-permission and symlink issues. Remove these when the updater moves to zip >= 9 too.
    { id = "RUSTSEC-2026-0367", reason = "zip extract only; we never extract untrusted archives" },
    { id = "RUSTSEC-2026-0368", reason = "zip extract only; we never extract untrusted archives" },
    { id = "RUSTSEC-2026-0369", reason = "zip extract only; we never extract untrusted archives" },
    { id = "RUSTSEC-2026-0429", reason = "zip extract only; we never extract untrusted archives" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# Permissive licences only. No GPL/AGPL/LGPL: none of them fits a closed binary we sell.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
[licenses.private]
ignore = true   # knowlu and knowlu-engine themselves

[bans]
multiple-versions = "allow"   # Tauri's graph has many; cargo bloat, not this, tracks size
wildcards = "deny"
allow-wildcard-paths = true
# CLAUDE.md: TLS via rustls/ring, never OpenSSL.
deny = [
    { name = "openssl", reason = "TLS is rustls/ring, never OpenSSL (CLAUDE.md)" },
    { name = "openssl-sys", reason = "TLS is rustls/ring, never OpenSSL (CLAUDE.md)" },
    { name = "native-tls", reason = "TLS is rustls/ring, never OpenSSL (CLAUDE.md)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
