name: ci
on:
  push: { branches: [main] }
  pull_request: {}
permissions: { contents: read }
env:
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: always
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0  # master
        with: { toolchain: "1.98.0-x86_64-pc-windows-gnu" }
      - run: .\scripts\ci\toolchain.ps1
        shell: pwsh
      - name: assert gnu host toolchain
        shell: pwsh
        run: |
          $v = (rustc -vV | Out-String)
          Write-Output $v
          if ($v -notmatch "host: x86_64-pc-windows-gnu") { Write-Output "expected host: x86_64-pc-windows-gnu"; exit 1 }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - run: ./scripts/ci/eol-check.ps1
        shell: pwsh
      - name: test (workspace, 0 warnings)
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
        run: |
          cargo test --workspace --no-fail-fast 2>&1 | Tee-Object test.log
          $code = $LASTEXITCODE
          # The grep must run on every push, pass or fail, so a real warning is never hidden behind a
          # test failure exiting first. The one accepted linker line; any other 'warning:' is a
          # failure even if rustc and every test passed.
          $all = @(Select-String -Path test.log -Pattern '^warning:')
          $other = @($all | Where-Object { $_.Line -notmatch 'rsrc merge failure: multiple non-default manifests' })
          Write-Output "warnings: $($all.Count - $other.Count) accepted (.rsrc), $($other.Count) other"
          if ($other.Count -gt 0) { $other | ForEach-Object { $_.Line }; exit 1 }
          if ($code -ne 0) { exit $code }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with: { name: test-log, path: test.log }
