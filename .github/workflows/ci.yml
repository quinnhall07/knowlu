name: ci
on:
  # No path filter on either trigger: branch protection REQUIRES the checks `test`, `cloud` and
  # `eval-gate`, and a workflow a path filter skips never reports them, so a document-only PR could
  # never merge. Instead the `changes` job below decides whether anything outside the document paths
  # changed, and the three required jobs always run and succeed, skipping their heavy steps when it
  # did not (every run here is a Windows job billed at twice its wall-clock minutes).
  push:
    branches: [main]
  pull_request:
permissions: { contents: read }
env:
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: always
# The repository variable CI_SELF_HOSTED: the literal `on` sends every job below to
# [self-hosted, windows, x64, knowlu-ci]; unset (or anything else), each job falls back to the
# hosted image it ran on before, so going back to hosted runners is deleting the variable, never a
# code change. On the self-hosted runner, `cloud` and `eval-gate` still run on Windows: `deno check`
# expands its own `**` globs (verified 2026-09-22 with deno 2.9.6 in PowerShell, where the shell
# passes them literally), and the `shell: bash` steps (eval-gate's own, and dtolnay/rust-toolchain's
# internal ones) need Git for Windows' bash.exe ahead of WSL's on the runner's PATH — a runner-setup
# requirement, not a workflow one. release.yml never reads this switch: its signing and publish
# secrets stay on GitHub-hosted runners.
jobs:
  # Plain git, no third-party action. `code` is `true` unless every changed file is a document
  # (`docs/**`, HANDOFF.md, VISION.md, PROVENANCE.md). Anything it cannot work out (the first push of
  # a branch, a zero or force-pushed-away before sha, a failed diff) counts as code changed. The
  # three required jobs `need` this one and key their steps on its output, never the job itself on an
  # `if:` - a skipped required job would never report.
  changes:
    runs-on: ${{ vars.CI_SELF_HOSTED == 'on' && fromJSON('["self-hosted","windows","x64","knowlu-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0 }
      - name: did anything outside the documents change?
        id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          code=true
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE_SHA...HEAD"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$zero" ]; then
            range="$BEFORE_SHA $HEAD_SHA"
          else
            range=""
          fi
          if [ -n "$range" ] && files=$(git diff --name-only $range); then
            code=false
            for f in $files; do
              case "$f" in
                docs/*|HANDOFF.md|VISION.md|PROVENANCE.md) ;;
                *) code=true ;;
              esac
            done
          fi
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ${{ vars.CI_SELF_HOSTED == 'on' && fromJSON('["self-hosted","windows","x64","knowlu-ci"]') || 'windows-latest' }}
    needs: changes
    timeout-minutes: 60
    steps:
      - name: no code changed, nothing to run (this check still reports)
        if: needs.changes.outputs.code != 'true'
        run: echo "only documents changed; skipping the heavy steps"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: needs.changes.outputs.code == 'true'
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0  # master
        if: needs.changes.outputs.code == 'true'
        with: { toolchain: "1.98.0-x86_64-pc-windows-gnu" }
      - run: .\scripts\ci\toolchain.ps1
        if: needs.changes.outputs.code == 'true'
        shell: pwsh
      - name: assert gnu host toolchain
        if: needs.changes.outputs.code == 'true'
        shell: pwsh
        run: |
          $v = (rustc -vV | Out-String)
          Write-Output $v
          if ($v -notmatch "host: x86_64-pc-windows-gnu") { Write-Output "expected host: x86_64-pc-windows-gnu"; exit 1 }
      # cache-on-failure, because the cache otherwise saves only on a green run and this job's whole
      # purpose is to go red: every fix-up round would start from a cold build of the entire
      # dependency graph (R-C0-20).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        if: needs.changes.outputs.code == 'true'
        with: { cache-on-failure: true }
      - run: ./scripts/ci/eol-check.ps1
        if: needs.changes.outputs.code == 'true'
        shell: pwsh
      - name: test (workspace, 0 warnings)
        if: needs.changes.outputs.code == 'true'
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
        run: |
          cargo test --workspace --no-fail-fast 2>&1 | Tee-Object test.log
          $code = $LASTEXITCODE
          # The grep must run on every push, pass or fail, so a real warning is never hidden behind a
          # test failure exiting first. The one accepted linker line; any other 'warning:' is a
          # failure even if rustc and every test passed. Cargo also prints one "generated N warning"
          # tally line per target that hit the accepted warning (once for the bin, once for its test
          # binary) — that is cargo counting the same accepted warning again, not a second warning,
          # so tallies are split out and never counted as "other".
          $all = @(Select-String -Path test.log -Pattern '^warning:')
          $tallies = @($all | Where-Object { $_.Line -match ' generated \d+ warnings?( \(\d+ duplicates?\))?$' })
          $accepted = @($all | Where-Object { $_.Line -match 'rsrc merge failure: multiple non-default manifests' })
          $other = @($all | Where-Object { $_.Line -notmatch 'rsrc merge failure: multiple non-default manifests' -and $_.Line -notmatch ' generated \d+ warnings?( \(\d+ duplicates?\))?$' })
          Write-Output "warnings: $($accepted.Count) accepted (.rsrc), $($tallies.Count) tallies, $($other.Count) other"
          if ($other.Count -gt 0) { $other | ForEach-Object { $_.Line }; exit 1 }
          if ($code -ne 0) { exit $code }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure() && needs.changes.outputs.code == 'true'
        with: { name: test-log, path: test.log }

  # The cloud codebase (Supabase Edge Functions, Deno). A separate job: nothing in it is Windows-specific
  # and the Rust job above is the long pole. C1 hand-off H7, applied early (R-C1-23); C2 amends this one
  # job (R-X-7) — nothing adds a second `cloud` job.
  cloud:
    runs-on: ${{ vars.CI_SELF_HOSTED == 'on' && fromJSON('["self-hosted","windows","x64","knowlu-ci"]') || 'ubuntu-latest' }}
    needs: changes
    timeout-minutes: 10
    steps:
      - name: no code changed, nothing to run (this check still reports)
        if: needs.changes.outputs.code != 'true'
        run: echo "only documents changed; skipping the heavy steps"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: needs.changes.outputs.code == 'true'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed  # v2.0.5
        if: needs.changes.outputs.code == 'true'
        with: { deno-version: "2.x" }
      # `cloud/eval/` is C2's and sits outside `cloud/supabase/`, so every path is named explicitly
      # (hand-off H8 part 1, C2 Task 13; the `eval-gate` job is Task 14's, added in its own commit).
      - name: deno check
        if: needs.changes.outputs.code == 'true'
        run: deno check --config cloud/supabase/deno.json cloud/supabase/functions/**/*.ts cloud/eval/*.ts
      - name: deno lint
        if: needs.changes.outputs.code == 'true'
        run: deno lint --config cloud/supabase/deno.json cloud/supabase/ cloud/eval/
      # --allow-net=127.0.0.1 is needed from C2 Task 0 on, and only from then: `judge_anthropic_test.ts`
      # exercises the model client against a listener bound to 127.0.0.1:0 inside the test. No egress,
      # no name resolution, no listener on a routable interface (CLAUDE.md; plan 3a's loopback rule).
      # --allow-env is scoped to four names the pinned @anthropic-ai/sdk@0.125.0 constructor reads
      # unconditionally (ANTHROPIC_WEBHOOK_SIGNING_KEY, ANTHROPIC_AUTH_TOKEN, ANTHROPIC_LOG,
      # ANTHROPIC_CUSTOM_HEADERS) even though this file always passes apiKey/baseURL explicitly and
      # never reads a secret through it — not anticipated when Task 0's exact CI line was ruled;
      # flagged in the Task 0 report for review, not a silent change.
      # --allow-write is `cloud/eval/`'s loader tests: they build their temp fixtures under
      # `cloud/eval/.tmp-<random>/` (git-ignored by `cloud/eval/.gitignore`) rather than the OS temp
      # root, precisely so this grant can stay scoped to the one directory that needs it.
      - name: deno test
        if: needs.changes.outputs.code == 'true'
        run: deno test --allow-read --allow-write=cloud/eval --allow-net=127.0.0.1 --allow-env=ANTHROPIC_WEBHOOK_SIGNING_KEY,ANTHROPIC_AUTH_TOKEN,ANTHROPIC_LOG,ANTHROPIC_CUSTOM_HEADERS --config cloud/supabase/deno.json cloud/supabase/ cloud/eval/

  # §5.4 measure 2's deploy blocker (hand-off H8, part 2; C2 Task 14): the eval suite replays
  # `cloud/eval/`'s seed against the pinned model whenever a PR touches what a judgment is asked
  # (a prompt, a schema) or which model answers it (a `models` row), and fails the PR on a
  # regression past `cloud/eval/thresholds.json`. C0's branch protection is what actually blocks
  # the merge; this job only fails the check.
  #
  # `cloud/eval/seed/` is empty at merge (ruling R-C2-E12, Task 13) and stays empty FOREVER — it is
  # not where a consented correction lands once a later stream's opt-in exists; `eval_cases` is.
  # `run_eval.ts` checks the seed first and, if it is empty, asks exactly one more question before
  # doing anything else that could spend money or need a connection: is
  # `SUPABASE_SERVICE_ROLE_KEY` set at all (C2 final review A-4, regrading a gate that could never
  # wake up)? Absent, it exits 0 printing "0 cases — nothing to score (no seed, no database
  # access)" without ever reading `OPENROUTER_API_KEY` or opening a connection — which is what lets
  # this job pass green on a PR that sets neither secret. Present, it asks the database once
  # whether `eval_cases` holds anything at all, and runs the suite for real the day it does.
  # Deliberately, that count is uncaught (ruling m147): a key IS present at that point, so a failed
  # `eval_cases` count — a staging outage, a bad key — must fail this PR-only gate loud, never be
  # read as "0 cases" and pass vacuously.
  #
  # The two GitHub secrets Quinn sets, by name: **`OPENROUTER_API_KEY`** and
  # **`SUPABASE_STAGING_SERVICE_ROLE_KEY`**. Which model actually answers is not a CI decision: the
  # runner reads the pinned `models` row per kind and calls whichever provider that row names
  # (`openrouter`, since the provider swap of 2026-09-16) — a model pin change never needs a
  # workflow edit; a provider change needs this step's env and net lists too.
  #
  # **A fork PR gets no secrets at all** (GitHub does not expose them to `pull_request` runs from a
  # fork), so on a fork this job can never make a real model call however many cases staging's
  # `eval_cases` holds — the check above answers "no database access" before it could ever find
  # out, and spends nothing finding that out. The spend this job CAN incur is on a branch PR in
  # this repository — whose steps below set both secrets TOGETHER, never one without the other —
  # and it is bounded even then: `run_eval.ts`'s `MAX_CASES` caps each kind's corpus at 200 rows in
  # the query itself (C2 final review S-5), so the worst case is 600 model calls at roughly $0.0002
  # each on the pinned OpenRouter models (provider swap Task 4; the figure was Haiku-priced before
  # 2026-09-16) — well under a dollar — and the run prints its own case count before each kind's loop.
  eval-gate:
    runs-on: ${{ vars.CI_SELF_HOSTED == 'on' && fromJSON('["self-hosted","windows","x64","knowlu-ci"]') || 'ubuntu-latest' }}
    needs: [changes, cloud]
    if: github.event_name == 'pull_request'
    timeout-minutes: 20
    # A-6: the staging project's host, named once at job level and referenced twice below (the
    # `eval suite` step's own `SUPABASE_URL` and its `--allow-net` list) — the literal used to
    # appear twice, independently, which is exactly the shape that drifts the day staging moves.
    # Not a secret (the C1 plan: "each project's reference id, its URL ... none secret" —
    # `app/src/account.rs`'s own `DEFAULT_API_BASE` names prod's the same way).
    env:
      STAGING_HOST: brvhgbihxevrudqpulcm.supabase.co
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0 }
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed  # v2.0.5
        if: needs.changes.outputs.code == 'true'
        with: { deno-version: "2.x" }
      # On a document-only change `changes` says `code=false`, the touched-check below finds no prompt,
      # schema or pin, and `run` stays `no`: the job reports success without spending anything.
      - name: does this PR touch a prompt, a schema, or the model pins?
        id: touched
        shell: bash
        env:
          # C2 Task 14 fix 1 (R-C2-E51, finding 4): named through env: rather than interpolated
          # straight into the script, so a base branch name can never be read as shell syntax.
          BASE_REF: ${{ github.base_ref }}
        run: |
          files=$(git diff --name-only "origin/$BASE_REF"...HEAD)
          run=no
          # The four files that define what is asked and how the answer is checked — A-6 adds
          # `judge_pipeline.ts` (the call order, the verdict shape, the outcome the eval suite
          # itself replays) beside the three that were already here...
          if echo "$files" | grep -Eq '^cloud/supabase/functions/_shared/judge_(prompts|models|validate|pipeline)\.ts$'; then run=yes; fi
          # ...and ANY migration that mentions the `models` table. A pin change is "a migration row
          # with a date" (§5.2) — `20260912000100_pin_sonnet.sql`, say — so a filename pattern is
          # exactly the wrong test: it would miss the model swap the gate exists for.
          for f in $(echo "$files" | grep -E '^cloud/supabase/migrations/.*\.sql$' || true); do
            if [ -f "$f" ] && grep -qiE '\bmodels\b' "$f"; then run=yes; fi
          done
          echo "run=$run" >> "$GITHUB_OUTPUT"
      # `SUPABASE_URL` is not secret (the job-level `STAGING_HOST` comment above says why); the two
      # secrets Quinn sets — `OPENROUTER_API_KEY` and `SUPABASE_STAGING_SERVICE_ROLE_KEY` — are
      # named in the C2 Task 14 report and the provider-swap Task 4 report, never a value. This
      # step runs PR-AUTHORED CODE (`cloud/eval/run_eval.ts`, and everything it imports) WITH the
      # staging service-role key — the same trust every job on this workflow already extends to a
      # branch PR in this repository — while a FORK PR gets neither secret at all (GitHub does not
      # expose them to `pull_request` runs from a fork), which is what keeps this step from ever
      # spending anything on an untrusted checkout. C2 Task 14 fix 1 (R-C2-E51, finding 3) dropped
      # `EVAL_ACCOUNT_ID`: nothing in the eval path uses an account id for anything real (every
      # consumer is a stub), so it named a secret that did nothing.
      #
      # Provider swap Task 4 (2026-09-16, R8 amended): the runner's model is chosen by the pinned
      # `models` row, and every row now pins `provider = 'openrouter'` — so this step authenticates
      # to OpenRouter, not Anthropic. `ANTHROPIC_API_KEY` is deliberately unset here; the four
      # `ANTHROPIC_*` names stay in `--allow-env` only because the pinned `@anthropic-ai/sdk` is
      # still compiled into the runner (the `cloud` job's own comment explains why) and its
      # constructor reads them unconditionally even when no Anthropic call is ever made.
      - name: eval suite
        if: needs.changes.outputs.code == 'true' && steps.touched.outputs.run == 'yes'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL: https://${{ env.STAGING_HOST }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
        # C2 Task 14 fix 1 (R-C2-E51, finding 4): the grants are scoped to exactly what this run
        # needs while it holds the service-role key — the three this script itself reads plus the
        # four names Task 0 ruled the pinned @anthropic-ai/sdk reads unconditionally (never a
        # secret through them; see the `cloud` job's own comment), and network only to the hosts it
        # actually calls. `--allow-read` stays unscoped: npm module downloads at import time are
        # not gated by Deno's runtime permissions, only by `--allow-read`/`--allow-net`'s absence
        # entirely, and this step needs to read its own source tree and thresholds.json.
        run: deno run --allow-read --allow-env=OPENROUTER_API_KEY,SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,ANTHROPIC_WEBHOOK_SIGNING_KEY,ANTHROPIC_AUTH_TOKEN,ANTHROPIC_LOG,ANTHROPIC_CUSTOM_HEADERS --allow-net=openrouter.ai,${{ env.STAGING_HOST }} --config cloud/supabase/deno.json cloud/eval/run_eval.ts --thresholds cloud/eval/thresholds.json
