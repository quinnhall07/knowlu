name: ci
on:
  push: { branches: [main] }
  pull_request: {}
permissions: { contents: read }
env:
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: always
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0  # master
        with: { toolchain: "1.98.0-x86_64-pc-windows-gnu" }
      - run: .\scripts\ci\toolchain.ps1
        shell: pwsh
      - name: assert gnu host toolchain
        shell: pwsh
        run: |
          $v = (rustc -vV | Out-String)
          Write-Output $v
          if ($v -notmatch "host: x86_64-pc-windows-gnu") { Write-Output "expected host: x86_64-pc-windows-gnu"; exit 1 }
      # cache-on-failure, because the cache otherwise saves only on a green run and this job's whole
      # purpose is to go red: every fix-up round would start from a cold build of the entire
      # dependency graph (R-C0-20).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with: { cache-on-failure: true }
      - run: ./scripts/ci/eol-check.ps1
        shell: pwsh
      - name: test (workspace, 0 warnings)
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
        run: |
          cargo test --workspace --no-fail-fast 2>&1 | Tee-Object test.log
          $code = $LASTEXITCODE
          # The grep must run on every push, pass or fail, so a real warning is never hidden behind a
          # test failure exiting first. The one accepted linker line; any other 'warning:' is a
          # failure even if rustc and every test passed. Cargo also prints one "generated N warning"
          # tally line per target that hit the accepted warning (once for the bin, once for its test
          # binary) — that is cargo counting the same accepted warning again, not a second warning,
          # so tallies are split out and never counted as "other".
          $all = @(Select-String -Path test.log -Pattern '^warning:')
          $tallies = @($all | Where-Object { $_.Line -match ' generated \d+ warnings?( \(\d+ duplicates?\))?$' })
          $accepted = @($all | Where-Object { $_.Line -match 'rsrc merge failure: multiple non-default manifests' })
          $other = @($all | Where-Object { $_.Line -notmatch 'rsrc merge failure: multiple non-default manifests' -and $_.Line -notmatch ' generated \d+ warnings?( \(\d+ duplicates?\))?$' })
          Write-Output "warnings: $($accepted.Count) accepted (.rsrc), $($tallies.Count) tallies, $($other.Count) other"
          if ($other.Count -gt 0) { $other | ForEach-Object { $_.Line }; exit 1 }
          if ($code -ne 0) { exit $code }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with: { name: test-log, path: test.log }

  # The cloud codebase (Supabase Edge Functions, Deno). A separate job: nothing in it is Windows-specific
  # and the Rust job above is the long pole. C1 hand-off H7, applied early (R-C1-23); C2 amends this one
  # job (R-X-7) — nothing adds a second `cloud` job.
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed  # v2.0.5
        with: { deno-version: "2.x" }
      # `cloud/eval/` is C2's and sits outside `cloud/supabase/`, so every path is named explicitly
      # (hand-off H8 part 1, C2 Task 13; the `eval-gate` job is Task 14's, added in its own commit).
      - name: deno check
        run: deno check --config cloud/supabase/deno.json cloud/supabase/functions/**/*.ts cloud/eval/*.ts
      - name: deno lint
        run: deno lint --config cloud/supabase/deno.json cloud/supabase/ cloud/eval/
      # --allow-net=127.0.0.1 is needed from C2 Task 0 on, and only from then: `judge_anthropic_test.ts`
      # exercises the model client against a listener bound to 127.0.0.1:0 inside the test. No egress,
      # no name resolution, no listener on a routable interface (CLAUDE.md; plan 3a's loopback rule).
      # --allow-env is scoped to four names the pinned @anthropic-ai/sdk@0.125.0 constructor reads
      # unconditionally (ANTHROPIC_WEBHOOK_SIGNING_KEY, ANTHROPIC_AUTH_TOKEN, ANTHROPIC_LOG,
      # ANTHROPIC_CUSTOM_HEADERS) even though this file always passes apiKey/baseURL explicitly and
      # never reads a secret through it — not anticipated when Task 0's exact CI line was ruled;
      # flagged in the Task 0 report for review, not a silent change.
      # --allow-write is `cloud/eval/`'s loader tests: they build their temp fixtures under
      # `cloud/eval/.tmp-<random>/` (git-ignored by `cloud/eval/.gitignore`) rather than the OS temp
      # root, precisely so this grant can stay scoped to the one directory that needs it.
      - name: deno test
        run: deno test --allow-read --allow-write=cloud/eval --allow-net=127.0.0.1 --allow-env=ANTHROPIC_WEBHOOK_SIGNING_KEY,ANTHROPIC_AUTH_TOKEN,ANTHROPIC_LOG,ANTHROPIC_CUSTOM_HEADERS --config cloud/supabase/deno.json cloud/supabase/ cloud/eval/

  # §5.4 measure 2's deploy blocker (hand-off H8, part 2; C2 Task 14): the eval suite replays
  # `cloud/eval/`'s seed against the pinned model whenever a PR touches what a judgment is asked
  # (a prompt, a schema) or which model answers it (a `models` row), and fails the PR on a
  # regression past `cloud/eval/thresholds.json`. C0's branch protection is what actually blocks
  # the merge; this job only fails the check.
  #
  # `cloud/eval/seed/` is empty at merge (ruling R-C2-E12, Task 13) and stays empty until cases
  # arrive from consented corrections (a later stream's opt-in), so `run_eval.ts` itself exits 0
  # printing "0 cases — nothing to score" before it reads ANTHROPIC_API_KEY or
  # SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY, or opens a connection (ruling R-C2-E50 (2)) — which is
  # what lets this job pass green on a PR that sets none of its two secrets.
  #
  # **A fork PR gets no secrets at all** (GitHub does not expose them to `pull_request` runs from a
  # fork), so on a fork this job can never make a real model call however many cases exist: both
  # `secrets.*` below arrive empty and `run_eval.ts` exits 2 naming the missing key rather than
  # spending anything. The spend this job CAN incur is on a branch PR in this repository, and it is
  # bounded: `run_eval.ts`'s `MAX_CASES` caps each kind's corpus at 200 rows in the query itself
  # (C2 final review S-5), so the worst case is 600 model calls at roughly $0.0014 each, and the
  # run prints its own case count before each kind's loop.
  eval-gate:
    runs-on: ubuntu-latest
    needs: cloud
    if: github.event_name == 'pull_request'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0 }
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed  # v2.0.5
        with: { deno-version: "2.x" }
      - name: does this PR touch a prompt, a schema, or the model pins?
        id: touched
        shell: bash
        env:
          # C2 Task 14 fix 1 (R-C2-E51, finding 4): named through env: rather than interpolated
          # straight into the script, so a base branch name can never be read as shell syntax.
          BASE_REF: ${{ github.base_ref }}
        run: |
          files=$(git diff --name-only "origin/$BASE_REF"...HEAD)
          run=no
          # The three files that define what is asked and how the answer is checked...
          if echo "$files" | grep -Eq '^cloud/supabase/functions/_shared/judge_(prompts|models|validate)\.ts$'; then run=yes; fi
          # ...and ANY migration that mentions the `models` table. A pin change is "a migration row
          # with a date" (§5.2) — `20260912000100_pin_sonnet.sql`, say — so a filename pattern is
          # exactly the wrong test: it would miss the model swap the gate exists for.
          for f in $(echo "$files" | grep -E '^cloud/supabase/migrations/.*\.sql$' || true); do
            if [ -f "$f" ] && grep -qiE '\bmodels\b' "$f"; then run=yes; fi
          done
          echo "run=$run" >> "$GITHUB_OUTPUT"
      # `SUPABASE_URL` is not secret (the C1 plan: "each project's reference id, its URL ... none
      # secret" — `app/src/account.rs`'s own `DEFAULT_API_BASE` names prod's the same way), so it
      # is the literal staging project URL, not a GitHub secret; the two secrets Quinn sets are
      # named in the C2 Task 14 report, never a value. C2 Task 14 fix 1 (R-C2-E51, finding 3)
      # dropped `EVAL_ACCOUNT_ID`: nothing in the eval path uses an account id for anything real
      # (every consumer is a stub), so it named a secret that did nothing.
      - name: eval suite
        if: steps.touched.outputs.run == 'yes'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: https://brvhgbihxevrudqpulcm.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
        # C2 Task 14 fix 1 (R-C2-E51, finding 4): the grants are scoped to exactly what this run
        # needs while it holds the service-role key — the four names Task 0 ruled the pinned
        # @anthropic-ai/sdk reads unconditionally (never a secret through them; see the `cloud`
        # job's own comment) plus the three this script itself reads, and network only to the two
        # hosts it actually calls. `--allow-read` stays unscoped: npm module downloads at import
        # time are not gated by Deno's runtime permissions, only by `--allow-read`/`--allow-net`'s
        # absence entirely, and this step needs to read its own source tree and thresholds.json.
        run: deno run --allow-read --allow-env=ANTHROPIC_API_KEY,SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,ANTHROPIC_WEBHOOK_SIGNING_KEY,ANTHROPIC_AUTH_TOKEN,ANTHROPIC_LOG,ANTHROPIC_CUSTOM_HEADERS --allow-net=api.anthropic.com,brvhgbihxevrudqpulcm.supabase.co --config cloud/supabase/deno.json cloud/eval/run_eval.ts --thresholds cloud/eval/thresholds.json
