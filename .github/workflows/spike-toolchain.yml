# Throwaway spike for C0 Task 1: which host toolchain can build and test this workspace on
# GitHub's windows-latest image? Deleted once the Outcome is recorded in the plan.
name: spike-toolchain
on:
  workflow_dispatch: {}

jobs:
  gnu-image:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: "1.98.0-x86_64-pc-windows-gnu"
      - name: gnu host check
        shell: pwsh
        run: |
          $v = (rustc -vV | Out-String)
          Write-Output $v
          if ($v -notmatch 'host: x86_64-pc-windows-gnu') {
            Write-Output "rustc is not a GNU host toolchain"
            exit 1
          }
      - name: toolchain
        shell: pwsh
        run: .\scripts\ci\toolchain.ps1 -Flavor image
      - name: evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          rustc -vV
          cargo --version
          where.exe gcc
          cmd /c "gcc -v 2>&1"
          as --version | Select-Object -First 1
          dlltool --version | Select-Object -First 1
          exit 0
      - name: cargo test
        shell: pwsh
        run: cargo test --workspace --no-fail-fast 2>&1 | Tee-Object gnu-image.log; exit $LASTEXITCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gnu-image-log
          path: gnu-image.log

  gnu-winlibs:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: "1.98.0-x86_64-pc-windows-gnu"
      - name: gnu host check
        shell: pwsh
        run: |
          $v = (rustc -vV | Out-String)
          Write-Output $v
          if ($v -notmatch 'host: x86_64-pc-windows-gnu') {
            Write-Output "rustc is not a GNU host toolchain"
            exit 1
          }
      - name: toolchain
        shell: pwsh
        run: .\scripts\ci\toolchain.ps1 -Flavor winlibs
      - name: evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          rustc -vV
          cargo --version
          where.exe gcc
          cmd /c "gcc -v 2>&1"
          as --version | Select-Object -First 1
          dlltool --version | Select-Object -First 1
          exit 0
      - name: cargo test
        shell: pwsh
        run: cargo test --workspace --no-fail-fast 2>&1 | Tee-Object gnu-winlibs.log; exit $LASTEXITCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gnu-winlibs-log
          path: gnu-winlibs.log

  msvc:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: "1.98.0"
      - name: evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          rustc -vV
          cargo --version
          exit 0
      - name: cargo test
        shell: pwsh
        run: cargo test --workspace --no-fail-fast 2>&1 | Tee-Object msvc.log; exit $LASTEXITCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: msvc-log
          path: msvc.log
