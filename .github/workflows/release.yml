# The release path, and the only one. A `v*` tag builds both binaries from that one commit, signs
# everything with Trusted Signing over Azure OIDC, deploys site\ to Cloudflare Pages and creates the
# GitHub Release. Nothing here is reproducible on a laptop by design: the updater key and the
# signing identity exist only as repository secrets and a federated credential, so a hand-run
# `cargo tauri build` cannot ship (C0 Task 3).
#
# The one deliberate exception (2026-09-17): with the repository VARIABLE RELEASE_AUTHENTICODE set
# to the literal `off`, the three Azure steps are skipped, every binary ships without Authenticode
# (Windows SmartScreen warns on the installer), the verify step asserts exactly that, and the notes
# say it. Unset, empty, or anything else means signing is required, so a missing Azure line still
# stops the release rather than shipping unsigned by accident - which is why the switch is a
# variable a person sets on purpose and never the absence of a secret. The updater signature
# (minisign, TAURI_SIGNING_PRIVATE_KEY) is never optional. engine/tests/workflows.rs pins all of it.
#
# Two jobs, not one (C0, 2026-09-17). `build` makes and signs the artefacts and hands them to
# `publish` as one uploaded artifact; `publish` deploys the site and creates the GitHub Release and
# compiles nothing. The first release run took 40 minutes and died at the deploy on a wrong token,
# which cost a second full build - now a publish-only failure is `gh run rerun <id> --failed` and a
# few minutes, with the build's cache and artifact still standing. The same run spent 21 of those 40
# minutes compiling the Tauri CLI from source, so the CLI is downloaded prebuilt for the pinned
# version and verified against a SHA-256 spelled here, never compiled.
#
# Every `uses:` is pinned to a full commit SHA with its tag as a trailing comment - a floating tag
# is a supply chain that can change under a signing job. engine/tests/workflows.rs is the judge.
name: release
on:
  push: { tags: ['v*'] }
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    # Created by GitHub on the first run. It exists so a required reviewer can be added later
    # without editing this file.
    environment: release
    # Only what this job uses. Checkout reads the repository; the OIDC token is the federated
    # credential's. Nothing in this job writes to the repository - `publish` does that.
    permissions: { contents: read, id-token: write }
    # The three artefact names, as BASENAMES, for the publish job: the paths below are this
    # runner's and mean nothing on the next one, but the names inside the artifact are the same.
    outputs:
      installer: ${{ steps.release.outputs.installer }}
      sig: ${{ steps.release.outputs.sig }}
      manifest: ${{ steps.release.outputs.manifest }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      # fetch-depth: 0 - the release notes need the tag history, and checkout's default depth of 1
      # would make `git describe --tags HEAD^` find nothing on every release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0 }
      # The toolchain steps are ci.yml's, line for line: same pinned action, same host triple, same
      # WinLibs archive. A release built on a different compiler than the one CI tested is not the
      # thing CI tested.
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0  # master
        with: { toolchain: "1.98.0-x86_64-pc-windows-gnu" }
      - run: .\scripts\ci\toolchain.ps1
        shell: pwsh
      - name: assert gnu host toolchain
        shell: pwsh
        run: |
          $v = (rustc -vV | Out-String)
          Write-Output $v
          if ($v -notmatch "host: x86_64-pc-windows-gnu") { Write-Output "expected host: x86_64-pc-windows-gnu"; exit 1 }
      # cache-on-failure, as ci.yml has it: the first release run failed, so the cache saved nothing
      # and the rerun paid for the whole dependency graph a second time.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with: { cache-on-failure: true }
      - name: release notes
        shell: pwsh
        env: { RELEASE_AUTHENTICODE: "${{ vars.RELEASE_AUTHENTICODE }}" }
        run: |
          # The previous tag, or - on the first release, when there is none - the root commit, said
          # out loud in the first line so nobody reads a whole-history changelog as one release's.
          # git describe's EXIT CODE is what is read, never its stderr: merging a native command's
          # stderr under $ErrorActionPreference = "stop" terminates the step on output that is not
          # an error.
          #
          # git hands back the raw UTF-8 bytes it stored. Without this line PowerShell decodes them
          # with the console codepage and every em dash in this repository's commit subjects lands
          # in the release notes as mojibake.
          [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding($false)
          $prev = (git describe --tags --abbrev=0 "HEAD^")
          if ($LASTEXITCODE -eq 0) {
            $head = "Changes since $prev."
            $log = @(git log --oneline ($prev + "..HEAD"))
          } else {
            # A range starting at the root commit would exclude the root commit itself, so the
            # first release lists the whole history instead.
            $root = @(git rev-list --max-parents=0 HEAD)[0]
            $head = "First release - every commit since the root commit $root."
            $log = @(git log --oneline HEAD)
          }
          # The unsigned notice comes first, above the changelog: a person reading the Release
          # learns what SmartScreen will say before they download anything.
          $notice = @()
          if ($env:RELEASE_AUTHENTICODE -eq "off") {
            $notice = @("**Unsigned build.** This release carries no Authenticode signature (the repository variable RELEASE_AUTHENTICODE is off): Windows SmartScreen warns when the installer first runs - choose More info, then Run anyway. The updater signature is present, and the app verifies it before applying any update.", "")
          }
          $lines = @("Knowlu $env:GITHUB_REF_NAME", "") + $notice + @($head, "") + @($log | ForEach-Object { "- $_" })
          [System.IO.File]::WriteAllText("release-notes.md", (($lines -join "`n") + "`n"), (New-Object System.Text.UTF8Encoding($false)))
          Get-Content release-notes.md
          exit 0
      # Pinned exactly, not "^2". The sidecar's signed path below is read out of tauri-bundler
      # 2.9.4's source, which is what this version pulls in, and it is the version the dev machine
      # runs - the same reason the compiler is pinned.
      #
      # Downloaded prebuilt, never compiled: building the CLI from source with `cargo install` cost
      # 21 of the first release run's 40 minutes (run 35179886527, 2026-09-17), and it is a tool,
      # not the product - it does not decide what is built for what target. So the archive is
      # Tauri's own Windows build and it is verified against the SHA-256 below, the same contract
      # app\src\inference.rs holds for llama.cpp runtimes: a bump is the VERSION AND THE HASH
      # together, and a wrong archive stops the run before anything is built.
      - name: tauri-cli
        shell: pwsh
        env:
          TAURI_CLI_VERSION: "2.11.4"
          TAURI_CLI_SHA256: "0743e30a661a35d63339b24cf63828f97ba5389a1d7f13b368a542794dd0a3f3"
        run: |
          .\scripts\ci\tauri-cli.ps1 -Version $env:TAURI_CLI_VERSION -Sha256 $env:TAURI_CLI_SHA256
          # Through cargo's own resolution, not the file: this is the binary `cargo tauri build` will run.
          $v = (cargo tauri --version | Out-String)
          if ($LASTEXITCODE -ne 0 -or $v -notmatch [regex]::Escape($env:TAURI_CLI_VERSION)) { throw "cargo tauri resolves to '$($v.Trim())', not $env:TAURI_CLI_VERSION" }
      # The Authenticode signing library. signtool.exe itself comes from the Windows SDK on the
      # runner image (find-signtool.ps1 resolves it through the registry), but /dlib is Microsoft's
      # Trusted Signing client, which is a NuGet package and is not installed anywhere on the image.
      # KNOWLU_SIGN_DLIB is how sign.ps1 - launched by the bundler with a fixed argv - is told where
      # it landed; without it every file would print UNSIGNED: and the check below would fail.
      - name: Trusted Signing client
        if: vars.RELEASE_AUTHENTICODE != 'off'
        shell: pwsh
        run: |
          nuget install Microsoft.Trusted.Signing.Client -Version 1.0.95 -OutputDirectory "$env:RUNNER_TEMP\tsc"
          $dlib = Get-ChildItem "$env:RUNNER_TEMP\tsc" -Recurse -Filter Azure.CodeSigning.Dlib.dll | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
          if (-not $dlib) { throw "no Azure.CodeSigning.Dlib.dll in the package" }
          Add-Content $env:GITHUB_ENV "KNOWLU_SIGN_DLIB=$($dlib.FullName)"
      # OIDC, so no client secret exists anywhere: the token is minted for this run only and the
      # Entra app's federated credential is what accepts it.
      #
      # THE SUBJECT CLAIM IS THE ENVIRONMENT, NOT THE TAG. Because this job declares the `release`
      # environment, GitHub's default subject substitutes the environment for the ref, so the token
      # carries exactly:
      #
      #     repo:quinnhall07/knowlu:environment:release
      #
      # The federated credential must therefore be entity type **Environment** with the value
      # `release` (issuer https://token.actions.githubusercontent.com, audience api://AzureADTokenExchange).
      # A credential scoped to a branch or tag - entity type Tag, `refs/tags/v*`, which is the
      # natural thing to write for a workflow that triggers on `v*` - never matches this subject:
      # `azure/login` fails with AADSTS700213 and the release stops here, before anything is signed.
      # If the `environment:` line above is ever removed, the subject becomes
      # `repo:quinnhall07/knowlu:ref:refs/tags/<tag>` and the credential has to change with it.
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c  # v3.0.2
        if: vars.RELEASE_AUTHENTICODE != 'off'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Endpoint, account and profile are repository VARIABLES, not secrets - they are names, and
      # keeping them out of the secret store keeps the log readable when one is wrong.
      - name: signing profile
        if: vars.RELEASE_AUTHENTICODE != 'off'
        shell: pwsh
        env: { TS_ENDPOINT: "${{ vars.TS_ENDPOINT }}", TS_ACCOUNT: "${{ vars.TS_ACCOUNT }}", TS_PROFILE: "${{ vars.TS_PROFILE }}" }
        run: .\scripts\ci\write-signing-profile.ps1 -Path "$env:RUNNER_TEMP\trusted-signing.json"
      # The updater key exists as an environment variable for the length of THIS STEP and nowhere
      # else: release.ps1 only checks that it is set and lets `cargo tauri build` inherit it.
      - name: release.ps1
        id: release
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_AUTHENTICODE: ${{ vars.RELEASE_AUTHENTICODE }}
        run: |
          # No profile on the unsigned path: sign.ps1 then prints UNSIGNED: per file and exits 0,
          # which is the path -DryRun takes on a laptop - with the updater key present this time.
          $profile = "$env:RUNNER_TEMP\trusted-signing.json"
          if ($env:RELEASE_AUTHENTICODE -eq "off") { $profile = "" }
          .\scripts\release.ps1 -SigningProfile $profile 2>&1 | Tee-Object release.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $last = (Get-Content release.log | Where-Object { $_ -like "RELEASE *" } | Select-Object -Last 1)
          if (-not $last) { throw "release.ps1 printed no RELEASE line" }
          # The env vars stay absolute - the steps below read files on THIS runner. The job outputs
          # are the basenames, because that is all the next job can use: it downloads the artifact,
          # it does not inherit this workspace. `none` stays `none` either way.
          foreach ($kv in ($last -replace "^RELEASE ", "") -split " ") {
            $k, $v = $kv -split "=", 2
            Add-Content $env:GITHUB_ENV ("REL_" + $k.ToUpper() + "=" + $v)
            $leaf = $v; if ($v -ne "none") { $leaf = Split-Path -Leaf $v }
            Add-Content $env:GITHUB_OUTPUT ($k + "=" + $leaf)
          }
      - name: size gate
        shell: pwsh
        run: .\scripts\ci\size-gate.ps1 -Engine target\release\knowlu-engine.exe -Installer $env:REL_INSTALLER
      # The one check that proves signing actually happened. sign.ps1 exits 0 when it cannot sign -
      # it has to, or an unsigned dev build could not bundle - so a silent UNSIGNED: run would
      # otherwise publish an installer Windows warns on. On the unsigned path (the variable, above)
      # the check inverts rather than disappears: every one of the three files must be NotSigned,
      # so a half-signed release - one binary signed by some leftover profile, two not - is still
      # a failed run, and the log says UNSIGNED RELEASE in capitals where the signed lines would be.
      #
      # The sidecar is checked at app\binaries\, NOT at target\release\knowlu-engine.exe. Those are
      # two different files: target\release\knowlu-engine.exe is cargo's own build output, while the
      # bundler signs settings.external_binaries() - `binaries/knowlu-engine-<triple>.exe` relative
      # to the tauri dir (tauri-bundler 2.9.4 bundle.rs sign_binaries_if_needed, tauri-utils 2.9.3
      # resources.rs external_binaries) - and Settings::copy_binaries lifts THAT file into the
      # installer with the triple stripped. Checking the cargo copy would fail every release while
      # the shipped bytes were signed all along. Globbed, so the triple is not spelled here too.
      #
      # -like and Sort-Object LastWriteTime, exactly as release.ps1's own installer lookup does it
      # and for the reason documented there: the FileSystem provider's -Filter uses Win32 wildcards,
      # where 8.3 aliasing lets a 3-letter extension match a longer one, so `*.exe` can pick up a
      # file this check has no business reading.
      - name: verify Authenticode
        shell: pwsh
        env: { RELEASE_AUTHENTICODE: "${{ vars.RELEASE_AUTHENTICODE }}" }
        run: |
          $want = "Valid"
          if ($env:RELEASE_AUTHENTICODE -eq "off") {
            $want = "NotSigned"
            Write-Output "UNSIGNED RELEASE: RELEASE_AUTHENTICODE is off - every binary must be NotSigned, and the release notes say so"
          }
          $sidecar = Get-ChildItem "app\binaries" -File | Where-Object { $_.Name -like "knowlu-engine-*.exe" } | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $sidecar) { throw "no staged sidecar under app\binaries" }
          foreach ($f in @($env:REL_INSTALLER, "target\release\knowlu.exe", $sidecar.FullName)) {
            $s = Get-AuthenticodeSignature $f
            Write-Output ("{0}: {1} {2}" -f $f, $s.Status, $s.SignerCertificate.Subject)
            if ($s.Status -ne $want) { throw "expected $want, got $($s.Status): $f" }
          }
      - name: stage for publish
        shell: pwsh
        run: |
          # Exactly the files that leave the machine, and nothing under target\: site\releases\ already
          # holds the versioned installer, the stable Knowlu-setup.exe and latest.json; the two GitHub
          # Release inputs that live nowhere under site\ - the detached .sig and the notes - go beside it.
          New-Item -ItemType Directory -Force publish | Out-Null
          Copy-Item release-notes.md publish\
          if ($env:REL_SIG -ne "none") { Copy-Item $env:REL_SIG publish\ }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release
          path: |
            site/releases/**
            publish/**
          if-no-files-found: error
          retention-days: 7
      # The profile file names an Azure account; release.log carries whatever the build printed.
      # Neither is a secret, and neither has any business outliving the job.
      - name: scrub
        if: always()
        shell: pwsh
        run: Remove-Item "$env:RUNNER_TEMP\trusted-signing.json" -ErrorAction SilentlyContinue; Remove-Item release.log -ErrorAction SilentlyContinue

  # Nothing here builds or signs anything: it takes the artifact the job above uploaded and puts it
  # where people get it. That is the point of the split - when a token is wrong or an upload times
  # out, `gh run rerun <id> --failed` reruns these few minutes instead of the whole build.
  publish:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    # Declared here too, not only above. A required reviewer added to the `release` environment
    # later is a gate on THIS job - the publish, the half that puts bytes in front of people - and,
    # because the job above declares the same environment for its OIDC subject claim, on that one
    # as well; the publish is what the gate is for.
    environment: release
    permissions: { contents: write }   # the GitHub Release, and nothing else
    steps:
      # fetch-depth: 1 - no notes are generated here, so no tag history is needed. The checkout is
      # for site\'s static pages, which are this same commit's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 1 }
      # path: . - the artifact was uploaded from the workspace root, so site/releases and publish
      # land back at exactly the relative paths they had.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with: { name: release, path: . }
      # site\releases\ now holds the versioned installer, the stable Knowlu-setup.exe and
      # latest.json - the updater endpoint baked into the app.
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0  # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name knowlu --branch main --commit-dirty=true
      - name: GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER: ${{ needs.build.outputs.installer }}
          SIG: ${{ needs.build.outputs.sig }}
          MANIFEST: ${{ needs.build.outputs.manifest }}
        run: |
          $files = @()
          $files += (Join-Path "site\releases" $env:INSTALLER)
          if ($env:SIG -ne "none") { $files += (Join-Path "publish" $env:SIG) }
          if ($env:MANIFEST -ne "none") { $files += (Join-Path "site\releases" $env:MANIFEST) }
          foreach ($f in $files) { if (-not (Test-Path $f)) { throw "release asset missing from the artifact: $f" } }
          gh release create $env:GITHUB_REF_NAME $files --title "Knowlu $env:GITHUB_REF_NAME" --notes-file publish\release-notes.md --verify-tag
